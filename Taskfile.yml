# https://taskfile.dev — 替代 Makefile 的统一任务入口
version: "3"

vars:
  SCHEMA_DIR: schema
  GEN_PY: src/biomed_ontology/_generated
  GEN_ART: schema/generated
  SCHEMAS: hmd_concept hmd_fact hmd_taxonomy hmd_obs hmd_tools hmd_enterprise
  # 单一项目 hmd-foundation；Milvus 片段见 docker/milvus-standalone.yml（被 include）
  FOUNDATION_COMPOSE: docker/docker-compose.foundation.yml
  MILVUS_SERVICES: etcd minio standalone

env:
  HMD_SEARCH_BACKEND: milvus

tasks:
  default:
    desc: 列出全部任务
    cmds:
      - task --list

  gen:
    desc: LinkML → pydantic / JSON Schema / SHACL / OWL
    cmds:
      - task: gen:py
      - task: gen:jsonschema
      - task: gen:shacl
      - task: gen:owl

  gen:py:
    silent: true
    cmds:
      - mkdir -p {{.GEN_PY}}
      - touch {{.GEN_PY}}/__init__.py
      - |
        for s in {{.SCHEMAS}}; do
          echo "gen-pydantic $s"
          uv run gen-pydantic {{.SCHEMA_DIR}}/$s.yaml > {{.GEN_PY}}/$s.py
        done

  gen:jsonschema:
    silent: true
    cmds:
      - mkdir -p {{.GEN_ART}}
      - |
        for s in {{.SCHEMAS}}; do
          echo "gen-json-schema $s"
          uv run gen-json-schema {{.SCHEMA_DIR}}/$s.yaml > {{.GEN_ART}}/$s.schema.json
        done

  gen:shacl:
    silent: true
    cmds:
      - mkdir -p {{.GEN_ART}}
      - |
        for s in {{.SCHEMAS}}; do
          echo "gen-shacl $s"
          uv run gen-shacl {{.SCHEMA_DIR}}/$s.yaml > {{.GEN_ART}}/$s.shacl.ttl
        done
      - task: canon-ttl

  gen:owl:
    silent: true
    cmds:
      - mkdir -p {{.GEN_ART}}
      - |
        for s in {{.SCHEMAS}}; do
          echo "gen-owl $s"
          PYTHONWARNINGS=ignore::DeprecationWarning uv run gen-owl {{.SCHEMA_DIR}}/$s.yaml > {{.GEN_ART}}/$s.owl.ttl
        done
      - task: canon-ttl

  canon-ttl:
    desc: 规范化生成的 TTL（空白节点稳定）
    cmds:
      - uv run python scripts/canon_ttl.py {{.GEN_ART}}/*.ttl

  canon-check:
    desc: 校验生成物是否为规范形式（不落盘）
    cmds:
      - uv run python scripts/canon_ttl.py --check {{.GEN_ART}}/*.ttl
      - echo "全部生成物均为规范形式"

  nightly:
    desc: 慢速全量 TTL 同构检查
    cmds:
      - task: canon-check

  lint:
    desc: ruff check + ruff format check + ty check
    cmds:
      - uv run ruff check src tests scripts
      - uv run ruff format --check src tests scripts
      - uv run ty check src tests scripts

  fmt:
    desc: ruff format + ruff autofix
    cmds:
      - uv run ruff format src tests scripts
      - uv run ruff check --fix src tests scripts

  test:
    desc: pytest（默认跳过 integration）
    cmds:
      - uv run pytest

  test:integration:
    desc: GraphDB 集成测（需 task foundation:up）
    cmds:
      - uv run pytest -m integration

  check:
    desc: lint（ruff + ty）+ test
    cmds:
      - task: lint
      - task: test

  docs:
    desc: mkdocs 严格构建
    cmds:
      - uv run --extra docs mkdocs build --strict

  docs:serve:
    desc: mkdocs 本地预览
    cmds:
      - uv run --extra docs mkdocs serve

  milvus:up:
    desc: 启动必选 Milvus（hmd-foundation 子集：etcd/minio/standalone）
    cmds:
      - docker compose -f {{.FOUNDATION_COMPOSE}} up -d {{.MILVUS_SERVICES}}
      - 'echo "Milvus: http://localhost:19530 (project hmd-foundation)"'

  lake:up:
    desc: 启动 MinIO + Iceberg REST + Trino（湖表 / OM connector）
    cmds:
      - docker compose -f {{.FOUNDATION_COMPOSE}} up -d minio iceberg-rest trino
      - 'echo "MinIO :9000  Iceberg REST :8181  Trino :8080"'

  milvus:down:
    desc: 仅停止 Milvus 三服务（不拆 GraphDB/OM）
    cmds:
      - docker compose -f {{.FOUNDATION_COMPOSE}} stop {{.MILVUS_SERVICES}}
      - docker compose -f {{.FOUNDATION_COMPOSE}} rm -f {{.MILVUS_SERVICES}}

  milvus:logs:
    cmds:
      - docker compose -f {{.FOUNDATION_COMPOSE}} logs -f standalone

  foundation:preflight:
    desc: 检查 GraphDB license 挂载陷阱（空目录会让 Workbench 404）
    cmds:
      - |
        lic=docker/secrets/graphdb.license
        if [ -d "$lic" ]; then
          echo "错误：$lic 是目录（Docker 在缺文件时误建）。"
          echo "请：rm -rf $lic"
          echo "GraphDB 10 Free 无需 license；SE/EE 再放真实 license 文件。"
          exit 2
        fi

  foundation:up:
    desc: 启动 Foundation 全栈（含 Milvus）；BIOS 仅首次 init（已有 .initialized 则跳过）
    cmds:
      - task: foundation:preflight
      - docker compose -f {{.FOUNDATION_COMPOSE}} up -d
      - task: foundation:smoke
      - task: foundation:init

  foundation:bern2:fetch:
    desc: 克隆 BERN2 源码并从 Google Drive 下载 ~70GB resources（gdown 断点续传）
    cmds:
      - |
        set -euo pipefail
        ROOT=docker/bern2
        mkdir -p "$ROOT"
        if [ ! -f "$ROOT/upstream/server.py" ]; then
          rm -rf "$ROOT/upstream"
          git clone --depth 1 --branch v1.1.0 https://github.com/dmis-lab/BERN2.git "$ROOT/upstream"
        fi
        mkdir -p "$ROOT/resources"
        if [ ! -f "$ROOT/resources/.fetched" ]; then
          ARCHIVE="$ROOT/resources_v1.1.b.tar.gz"
          GDRIVE_ID="${BERN2_GDRIVE_ID:-147b3OhU4IdQi121ZBUSqO1XKdKoXE5DK}"
          EXPECT_MD5="c0db4e303d1ccf6bf56b42eda2fe05d0"
          need_download=1
          if [ -f "$ARCHIVE" ]; then
            got="$(md5 -q "$ARCHIVE" 2>/dev/null || md5sum "$ARCHIVE" | awk '{print $1}')"
            if [ "$got" = "$EXPECT_MD5" ]; then
              need_download=0
              echo "Archive OK (md5=$got)，跳过下载"
            else
              echo "Archive md5 不匹配 ($got ≠ $EXPECT_MD5)，重新下载（断点续传）"
              rm -f "$ARCHIVE"
            fi
          fi
          if [ "$need_download" -eq 1 ]; then
            echo "Downloading BERN2 resources (~70GB) ← Google Drive ($GDRIVE_ID)"
            echo "  → $ARCHIVE"
            echo "提示：配额满时会报 Too many users；可等 24h、换账号，或海外机下完后放到 $ARCHIVE。"
            uv run --with gdown python -c "import gdown; gdown.download(id='$GDRIVE_ID', output='$ARCHIVE', quiet=False, resume=True)"
            got="$(md5 -q "$ARCHIVE" 2>/dev/null || md5sum "$ARCHIVE" | awk '{print $1}')"
            if [ "$got" != "$EXPECT_MD5" ]; then
              echo "ERROR: md5 $got ≠ $EXPECT_MD5（文件不完整或损坏）" >&2
              exit 1
            fi
          fi
          echo "Extracting…"
          tar -zxvf "$ARCHIVE" -C "$ROOT"
          test -d "$ROOT/resources" || { echo "解压后未找到 $ROOT/resources"; exit 1; }
          if [ -f "$ROOT/resources/GNormPlusJava/CRF++-0.58.tar.gz" ] && [ ! -d "$ROOT/resources/GNormPlusJava/CRF" ]; then
            (cd "$ROOT/resources/GNormPlusJava" && tar -zxvf CRF++-0.58.tar.gz && mv CRF++-0.58 CRF)
          fi
          # GNormPlus / gene normalizer 调用 ./CRF/crf_test；资源包通常只有源码
          if [ -d "$ROOT/resources/GNormPlusJava/CRF" ] && [ ! -x "$ROOT/resources/GNormPlusJava/CRF/.libs/crf_test" ]; then
            echo "Building CRF++ for GNormPlus…"
            (cd "$ROOT/resources/GNormPlusJava/CRF" && ./configure --prefix="$HOME" && make -j"$(sysctl -n hw.ncpu 2>/dev/null || nproc 2>/dev/null || echo 2)" && make install)
          fi
          GENE_CRF="$ROOT/resources/normalization/normalizers/gene/CRF"
          if [ -x "$ROOT/resources/GNormPlusJava/CRF/.libs/crf_test" ] && [ -d "$GENE_CRF" ]; then
            if ! file "$GENE_CRF/.libs/crf_test" 2>/dev/null | grep -q 'Mach-O\|ELF.*aarch64\|ELF.*x86-64'; then
              :
            fi
            # Linux 预编译二进制在 macOS 不可用：复用本机编好的 GNorm CRF
            if file "$GENE_CRF/.libs/crf_test" 2>/dev/null | grep -q 'ELF.*x86-64' || [ ! -x "$GENE_CRF/.libs/crf_test" ]; then
              echo "Installing macOS CRF++ into gene normalizer…"
              mkdir -p "$GENE_CRF/.libs"
              cp -f "$ROOT/resources/GNormPlusJava/CRF/.libs/"* "$GENE_CRF/.libs/"
              cp -f "$ROOT/resources/GNormPlusJava/CRF/crf_test" "$ROOT/resources/GNormPlusJava/CRF/crf_learn" "$GENE_CRF/" 2>/dev/null || true
            fi
          fi
          touch "$ROOT/resources/.fetched"
          touch "$ROOT/resources/.crf_built"
          echo "BERN2 resources ready"
        else
          echo "BERN2 resources already fetched"
        fi

  foundation:bern2:detect:
    desc: 探测 BERN2 加速后端（写入 .bern2.env：ACCEL/RUNTIME；默认本机 native）
    cmds:
      - |
        set -euo pipefail
        # 覆盖：BERN2_ACCEL=cuda|mps|cpu  BERN2_RUNTIME=docker|native
        # 默认本机（native）；Docker 需显式 BERN2_RUNTIME=docker 或 task bern2:up:docker
        OS="$(uname -s)"
        ARCH="$(uname -m)"
        RUNTIME="${BERN2_RUNTIME:-native}"
        ACCEL="${BERN2_ACCEL:-}"
        if [ -z "$ACCEL" ]; then
          if [ "$RUNTIME" = "native" ] && [ "$OS" = "Darwin" ]; then
            ACCEL=mps
          elif [ "$OS" = "Linux" ] && command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi -L >/dev/null 2>&1; then
            ACCEL=cuda
          else
            ACCEL=cpu
          fi
        fi
        # Darwin + docker 强制 cpu（Linux VM 无 MPS / 通常无 NVIDIA）
        if [ "$RUNTIME" = "docker" ] && [ "$OS" = "Darwin" ] && [ "$ACCEL" != "cpu" ]; then
          echo "WARN: macOS Docker 无法使用 CUDA/MPS，改用 BERN2_ACCEL=cpu（或 BERN2_RUNTIME=native 启用 MPS）"
          ACCEL=cpu
        fi
        MEM="${BERN2_MEM_LIMIT:-}"
        if [ -z "$MEM" ]; then
          if [ "$ACCEL" = "cuda" ]; then MEM=56g; else MEM=24g; fi
        fi
        {
          echo "BERN2_RUNTIME=$RUNTIME"
          echo "BERN2_ACCEL=$ACCEL"
          echo "BERN2_DEVICE=${BERN2_DEVICE:-auto}"
          echo "BERN2_MEM_LIMIT=$MEM"
          echo "BERN2_HOST_OS=$OS"
          echo "BERN2_HOST_ARCH=$ARCH"
        } > docker/bern2/.bern2.env
        echo "BERN2 detect → runtime=$RUNTIME accel=$ACCEL mem=$MEM ($OS/$ARCH)"
        cat docker/bern2/.bern2.env

  foundation:up:bern2:
    desc: 构建并启动 BERN2（默认本机 native；BERN2_RUNTIME=docker 走容器）
    deps: [foundation:bern2:detect]
    cmds:
      - |
        set -euo pipefail
        if curl -sS -m 2 -o /dev/null -X POST http://127.0.0.1:8888/plain \
            -H 'Content-Type: application/json' -d '{"text":"EGFR"}' 2>/dev/null; then
          echo "BERN2 already up → http://127.0.0.1:8888（跳过启动）"
          exit 0
        fi
        if [ ! -f docker/bern2/resources/.fetched ] && [ -z "$(ls -A "${BERN2_RESOURCES:-docker/bern2/resources}" 2>/dev/null || true)" ]; then
          echo "缺少 BERN2 resources。请先：task foundation:bern2:fetch"
          exit 2
        fi
        if [ ! -f docker/bern2/upstream/server.py ]; then
          echo "缺少 BERN2 源码。请先：task foundation:bern2:fetch"
          exit 2
        fi
        # shellcheck disable=SC1091
        set -a; . docker/bern2/.bern2.env; set +a
        if [ "${BERN2_RUNTIME}" = "native" ]; then
          chmod +x docker/bern2/run_native.sh docker/bern2/start_native_bg.sh
          mkdir -p docker/bern2/upstream/logs
          echo "Starting BERN2 native (device auto → MPS on Apple Silicon)…"
          echo "日志：docker/bern2/upstream/logs/  端口：http://127.0.0.1:8888"
          BERN2_PYTHON="${BERN2_PYTHON:-python3.11}" docker/bern2/start_native_bg.sh
          echo "BERN2 native pid=$(cat docker/bern2/.bern2.pid)"
        else
          COMPOSE=(-f {{.FOUNDATION_COMPOSE}})
          if [ "${BERN2_ACCEL}" = "cuda" ]; then
            COMPOSE+=(-f docker/docker-compose.bern2-cuda.yml)
          fi
          export BERN2_ACCEL BERN2_DEVICE BERN2_MEM_LIMIT
          docker compose "${COMPOSE[@]}" --profile bern2 build --build-arg "BERN2_ACCEL=${BERN2_ACCEL}" bern2
          docker compose "${COMPOSE[@]}" --profile bern2 up -d bern2
          echo "BERN2 docker (${BERN2_ACCEL}): http://localhost:8888  （首次就绪可能需数十分钟）"
        fi

  foundation:down:bern2:
    desc: 停止 BERN2（docker profile 或 native pid）
    cmds:
      - |
        set -euo pipefail
        if [ -f docker/bern2/.bern2.pid ]; then
          pid="$(cat docker/bern2/.bern2.pid || true)"
          if [ -n "${pid:-}" ] && kill -0 "$pid" 2>/dev/null; then
            kill "$pid" 2>/dev/null || true
          fi
          pkill -f 'multi_ner/ner_server.py' 2>/dev/null || true
          pkill -f 'GNormPlusServer.main.jar' 2>/dev/null || true
          pkill -f 'tmVar2Server.main.jar' 2>/dev/null || true
          pkill -f 'python -u server.py' 2>/dev/null || true
          pkill -f 'disease_normalizer' 2>/dev/null || true
          pkill -f 'gnormplus-normalization' 2>/dev/null || true
          rm -f docker/bern2/.bern2.pid
          echo "BERN2 native stopped"
        fi
        docker compose -f {{.FOUNDATION_COMPOSE}} -f docker/docker-compose.bern2-cuda.yml --profile bern2 stop bern2 2>/dev/null || \
          docker compose -f {{.FOUNDATION_COMPOSE}} --profile bern2 stop bern2 2>/dev/null || true

  # --- BERN2 快捷入口（默认本机；已有 foundation:*:bern2 仍保留）------------
  bern2:up:
    desc: 本机启动 BERN2（默认；已在 :8888 则跳过）
    cmds:
      - BERN2_RUNTIME=native task foundation:up:bern2

  bern2:up:docker:
    desc: Docker 启动 BERN2（macOS 强制 CPU）
    cmds:
      - BERN2_RUNTIME=docker task foundation:up:bern2

  bern2:down:
    desc: 停止 BERN2（native + docker profile）
    cmds:
      - task: foundation:down:bern2

  bern2:status:
    desc: 查看 BERN2 是否在 :8888 就绪
    cmds:
      - |
        set -euo pipefail
        code="$(curl -sS -m 5 -o /tmp/bern2_status.json -w "%{http_code}" -X POST http://127.0.0.1:8888/plain \
          -H 'Content-Type: application/json' -d '{"text":"EGFR"}' || echo 000)"
        if [ "$code" = "200" ]; then
          echo "BERN2 UP → http://127.0.0.1:8888"
          python3 -c 'import json;d=json.load(open("/tmp/bern2_status.json"));anns=d.get("annotations") or [];print("annotations",len(anns));[print(" ",a.get("mention"),a.get("obj"),a.get("id")) for a in anns[:5]]'
          if [ -f docker/bern2/.bern2.pid ]; then echo "native pid=$(cat docker/bern2/.bern2.pid)"; fi
          if [ -f docker/bern2/.bern2.env ]; then echo "---"; cat docker/bern2/.bern2.env; fi
        else
          echo "BERN2 DOWN（:8888 无响应，http=$code）"
          echo "启动：task bern2:up  或  task bern2:up:docker"
          exit 1
        fi

  bern2:wait:
    desc: 等待 BERN2 /plain 就绪（最长约 15 分钟）
    cmds:
      - |
        set -euo pipefail
        for i in $(seq 1 180); do
          if curl -sS -m 5 -o /dev/null -X POST http://127.0.0.1:8888/plain \
              -H 'Content-Type: application/json' -d '{"text":"EGFR"}' 2>/dev/null; then
            echo "BERN2 ready (attempt $i)"
            task bern2:status
            exit 0
          fi
          if [ $((i % 6)) -eq 0 ]; then
            echo "waiting… $i ($(date +%H:%M:%S))"
          fi
          sleep 5
        done
        echo "TIMEOUT waiting for BERN2" >&2
        exit 1

  foundation:down:
    desc: 拆除 hmd-foundation 全栈（含 Milvus + BERN2 profile）
    cmds:
      - task: foundation:down:bern2
      - docker compose -f {{.FOUNDATION_COMPOSE}} --profile bern2 down

  obs:up:
    desc: 启动 Redpanda + Iceberg Connect worker（需 foundation/lake 已起）
    cmds:
      - docker compose -f {{.FOUNDATION_COMPOSE}} -f docker/docker-compose.obs.yml --profile obs up -d --build redpanda kafka-connect-iceberg

  obs:register:
    desc: 注册 Iceberg Sink connectors（Connect REST :8083）
    cmds:
      - bash docker/obs/scripts/register_connectors.sh

  obs:down:
    cmds:
      - docker compose -f {{.FOUNDATION_COMPOSE}} -f docker/docker-compose.obs.yml --profile obs down

  zingg:materialize:
    desc: 物化 Zingg parquet（源/窗口默认 HMD_ZINGG_OBSERVATIONS 等）
    cmds:
      - uv run hmd foundation zingg-run --mode materialize-only

  zingg:run:
    desc: stub-link + export（本地无镜像；真 Zingg 用 zingg:docker）
    cmds:
      - uv run hmd foundation zingg-run --mode stub-link --observations bootstrap --skip-docker

  zingg:docker:
    desc: 官方 zingg/zingg train→link（需先 materialize）
    cmds:
      - docker compose -f docker/zingg/docker-compose.yml --profile zingg run --rm zingg-link

  foundation:ps:
    cmds:
      - docker compose -f {{.FOUNDATION_COMPOSE}} ps

  foundation:smoke:
    desc: 健康检查 GraphDB / OM / Milvus
    cmds:
      - uv run python scripts/foundation_smoke.py

  foundation:init:
    desc: BIOS init（幂等跳过）+ sync；强制重灌 HMD_BIOS_FORCE=1
    cmds:
      - |
        set -euo pipefail
        MARKER=data/cache/bios_v3/.initialized
        if [ -f "$MARKER" ]; then
          echo "BIOS marker → $MARKER"
          # 是否跳过由 bios-load 判定（防 subset marker 误导；GraphDB 已有全量也会跳过）
          python3 -c "import json; m=json.load(open('$MARKER')); print(f\"  source={m.get('source')} concepts={m.get('concepts')}\")" 2>/dev/null || true
        fi
        if [ "${HMD_BIOS_INIT:-full}" = "subset" ]; then
          uv run hmd foundation bios-load --subset
        else
          if [ -z "${HMD_BIOS_LICENSE_ACK:-}" ]; then
            # 已初始化过则无需 ACK 也能跳过；仅首次/强制重灌才要求
            if [ ! -f "$MARKER" ] || [ "${HMD_BIOS_FORCE:-}" = "1" ]; then
              echo "需要 HMD_BIOS_LICENSE_ACK=poc|evaluation|licensed"
              echo "见 data/foundation/NOTICE_BIOS.md"
              echo "仅子集联调：HMD_BIOS_INIT=subset task foundation:init"
              exit 2
            fi
          fi
          export HMD_BIOS_MAX_CONCEPTS="${HMD_BIOS_MAX_CONCEPTS:-0}"
          echo "BIOS load max_concepts=${HMD_BIOS_MAX_CONCEPTS} (0=full; 强制重灌 HMD_BIOS_FORCE=1)"
          uv run hmd foundation bios-load --full
        fi
      - uv run hmd foundation sync

  evolve:run:
    desc: evolve-mine（默认含湖）→ evolve-enrich（默认 LLM）
    cmds:
      - uv run hmd foundation evolve-mine --json
      - uv run hmd foundation evolve-enrich

  evolve:apply-approved:
    desc: 对已 approve 提案 dry-run apply（加 WRITE=1 才真正写 dictionary/zingg）
    cmds:
      - |
        if [ "${WRITE:-}" = "1" ]; then
          uv run hmd foundation evolve-apply --write
        else
          uv run hmd foundation evolve-apply
        fi

  evolve:verify:
    desc: 对 approved/applied 提案再 resolve 断言
    cmds:
      - uv run hmd foundation evolve-verify

  evolve:e2e:
    desc: 合成 fixture 跑 enrich→approve→apply(sandbox)→pytest（含 LLM filter 假 provider）
    cmds:
      - uv run pytest tests/test_evolve_propose.py tests/test_evolve_llm_filter.py -q

  ontology:validate:
    desc: Ontology-as-Code 校验（目录 / 映射 / Golden Path / 种子一致性）
    cmds:
      - uv run python scripts/ontology_validate.py

  ontology:refresh-literature:
    desc: validate 后文献面增量 index（catalog retag；不改 validate 语义）
    cmds:
      - task ontology:validate
      - uv run hmd index --incremental

  foundation:golden-eval:
    desc: 多 Golden Path JSON 评估（GraphDB+BIOS / Milvus / OM，禁止 YAML）
    cmds:
      - uv run hmd foundation golden-eval

  ontology:sync-artifacts:
    desc: 将 generated OWL/SHACL 复制到 ontology/ 供 Protégé 离线打开（非 SSOT）
    cmds:
      - mkdir -p ontology/owl ontology/shapes
      - cp -f schema/generated/*.owl.ttl ontology/owl/
      - cp -f schema/generated/*.shacl.ttl ontology/shapes/
      - cp -f schema/shapes/projection.shacl.ttl ontology/shapes/
      - echo "Synced to ontology/owl and ontology/shapes (review-only; SSOT remains schema/)"

  corpus:
    cmds:
      - uv run python scripts/fetch_corpus.py

  clean:
    cmds:
      - rm -rf {{.GEN_ART}} {{.GEN_PY}} .pytest_cache .ruff_cache .ty_cache
