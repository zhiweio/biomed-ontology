[project]
name = "hmd-access"
version = "0.1.0"
description = "tools / service / CLI / eval"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "hmd-contracts",
    "hmd-core",
    "hmd-nlu",
    "hmd-kg",
    "hmd-index",
    "hmd-ingest",
    "typer>=0.12.5",
    "fastapi>=0.115.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hmd_access"]
