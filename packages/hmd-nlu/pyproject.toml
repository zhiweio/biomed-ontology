[project]
name = "hmd-nlu"
version = "0.1.0"
description = "normalize / BERN2 / extract / IdentityService"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "hmd-contracts",
    "hmd-core",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hmd_nlu"]
