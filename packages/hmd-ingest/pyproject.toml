[project]
name = "hmd-ingest"
version = "0.1.0"
description = "parse / tree / lake steps"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "hmd-contracts",
    "hmd-core",
    "httpx>=0.27.0",
    "pillow>=10.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hmd_ingest"]
