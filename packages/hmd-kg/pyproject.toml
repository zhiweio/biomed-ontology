[project]
name = "hmd-kg"
version = "0.1.0"
description = "GraphDB / sync / world / biomedical sources"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "hmd-contracts",
    "hmd-core",
    "rdflib>=7.1.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hmd_kg"]
