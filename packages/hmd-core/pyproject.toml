[project]
name = "hmd-core"
version = "0.1.0"
description = "Settings / observability / registry"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hmd_core"]
