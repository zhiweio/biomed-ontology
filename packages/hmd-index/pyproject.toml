[project]
name = "hmd-index"
version = "0.1.0"
description = "embed / search / rerank / Evidence Index"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "hmd-contracts",
    "hmd-core",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hmd_index"]
