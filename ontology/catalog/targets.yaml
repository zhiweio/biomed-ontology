# 靶点种子切片。
#
# 基因符号本身就是稳定键，loader 按 symbol 直接对 HGNC 快照解析，
# 因此这里的 xref_hints 可信度高于药物那份。

seed_version: "0.1.0"
entity_type: TARGET

concepts:
  - key: MET
    preferred_label_en: MET proto-oncogene, receptor tyrosine kinase
    preferred_label_zh: MET 原癌基因受体酪氨酸激酶
    verified: false
    xref_hints:
      HGNC: { by: symbol, value: MET }
      UNIPROT: { by: gene_name, value: MET, organism: "9606" }
      NCBIGENE: { by: symbol, value: MET }
    aliases:
      - { raw: MET,     lang: en, scope: EXACT,   type: SYMBOL, source: HGNC }
      - { raw: c-Met,   lang: en, scope: EXACT,   type: SYMBOL, source: HGNC }
      - { raw: c-MET,   lang: en, scope: EXACT,   type: SYMBOL, source: HGNC }
      - { raw: HGFR,    lang: en, scope: EXACT,   type: ABBREV, source: HGNC }
      - { raw: AUTS9,   lang: en, scope: EXACT,   type: LEGACY, source: HGNC }
      - { raw: RCCP2,   lang: en, scope: EXACT,   type: LEGACY, source: HGNC }
      - { raw: 间质上皮转化因子, lang: zh, scope: EXACT, type: TRANSLATION, source: SEED_INTERNAL }
      - { raw: 肝细胞生长因子受体, lang: zh, scope: EXACT, type: TRANSLATION, source: SEED_INTERNAL }
      # 通路名比基因更宽 —— 标 BROAD，默认不参与扩展。
      - { raw: HGF/MET pathway, lang: en, scope: BROAD, type: ABBREV, source: SEED_INTERNAL }

