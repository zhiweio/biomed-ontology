      # ambiguity.yaml 早就把 PI3K 登记成四个亚基的歧义别名，但此前只有 PIK3CD 真实存在，
      # 「歧义」在构建产物里是空的。补上 α 之后 PI3K 才真正成为跨概念碰撞，
      # 登记表描述的情形与构建结果第一次对上。β/γ 仍未收录（语料里没有）。
