  - key: PIK3CD
    preferred_label_en: phosphatidylinositol-4,5-bisphosphate 3-kinase catalytic subunit delta
    preferred_label_zh: 磷脂酰肌醇 3-激酶催化亚基 δ
    verified: false
    xref_hints:
      HGNC: { by: symbol, value: PIK3CD }
    aliases:
      # 希腊字母写法必须与英文转写归一到同一个键，靠 normalize_alias 保证。
      - { raw: PIK3CD,      lang: en, scope: EXACT, type: SYMBOL, source: HGNC }
      - { raw: PI3Kδ,       lang: en, scope: EXACT, type: ABBREV, source: SEED_INTERNAL }
      - { raw: PI3K-delta,  lang: en, scope: EXACT, type: ABBREV, source: SEED_INTERNAL }
      - { raw: PI3Kdelta,   lang: en, scope: EXACT, type: ABBREV, source: SEED_INTERNAL }
      - { raw: p110delta,   lang: en, scope: EXACT, type: ABBREV, source: HGNC }
      - { raw: 磷脂酰肌醇3激酶δ, lang: zh, scope: EXACT, type: TRANSLATION, source: SEED_INTERNAL }
      # PI3K 是家族，比 PIK3CD 宽。标 EXACT 会让查 PI3Kδ 抑制剂召回全部 PI3K 文献。
      - { raw: PI3K,        lang: en, scope: BROAD, type: ABBREV, source: SEED_INTERNAL }

  # ============================================================ 语料同步批次
  #
  # 以下靶点全部取自 data/corpus/parsed/ 里 9 篇 CC-BY 文献的正文，
  # 每条都能在语料中数出出现次数，不是"将来可能用得上"的预备清单。
  #
  # 收录口径是「正文里的主要实体」而不是「评测 query 问得到的实体」：
  # 后者等于让本体去迁就当前这一版 gold —— gold 换一批，本体就得跟着改一遍，
  # 而未收录的实体在检索里的表现是"grounding 静默缺失"，从结果上看不出来。
  #
  # verified: false —— 这批没有经过真实 HGNC 快照核对，xref_hints 只是检索线索。

  - key: EGFR
    preferred_label_en: epidermal growth factor receptor
    preferred_label_zh: 表皮生长因子受体
    verified: false
    xref_hints:
      HGNC: { by: symbol, value: EGFR }
      UNIPROT: { by: gene_name, value: EGFR, organism: "9606" }
      NCBIGENE: { by: symbol, value: EGFR }
    aliases:
      - { raw: EGFR,   lang: en, scope: EXACT, type: SYMBOL, source: HGNC }
      - { raw: ERBB1,  lang: en, scope: EXACT, type: LEGACY, source: HGNC }
      - { raw: HER1,   lang: en, scope: EXACT, type: ABBREV, source: HGNC }
      - { raw: epidermal growth factor receptor, lang: en, scope: EXACT, type: CHEMICAL_NAME, source: HGNC }
      - { raw: 表皮生长因子受体, lang: zh, scope: EXACT, type: TRANSLATION, source: SEED_INTERNAL }
      # EGFR-TKI 指的是一类药，不是这个靶点的另一种写法。
      # 标 EXACT 会让"EGFR-TKI 耐药"被归一成靶点本身，丢掉"药物类别"这一层语义。
      - { raw: EGFR-TKI, lang: en, scope: RELATED, type: ABBREV, source: SEED_INTERNAL }

  - key: ERBB2
    preferred_label_en: erb-b2 receptor tyrosine kinase 2
    preferred_label_zh: 人表皮生长因子受体 2
    verified: false
    xref_hints:
      HGNC: { by: symbol, value: ERBB2 }
      UNIPROT: { by: gene_name, value: ERBB2, organism: "9606" }
    aliases:
      # 语料里 ERBB2 只出现 2 次而 HER2 出现 50 次 —— 首选标签仍用 HGNC 符号，
      # 但别名侧必须覆盖临床写法，否则语料里的主流写法反而查不到。
      - { raw: ERBB2,    lang: en, scope: EXACT, type: SYMBOL, source: HGNC }
      - { raw: HER2,     lang: en, scope: EXACT, type: ABBREV, source: HGNC }
      - { raw: HER-2,    lang: en, scope: EXACT, type: ABBREV, source: SEED_INTERNAL }
      - { raw: HER2/neu, lang: en, scope: EXACT, type: LEGACY, source: SEED_INTERNAL }
      - { raw: NEU,      lang: en, scope: EXACT, type: LEGACY, source: HGNC }
      - { raw: CD340,    lang: en, scope: EXACT, type: ABBREV, source: HGNC }
      - { raw: 人表皮生长因子受体2, lang: zh, scope: EXACT, type: TRANSLATION, source: SEED_INTERNAL }

  - key: ALK
