# 歧义别名登记表（设计决策 D3）。
#
# 这些别名映射到多个概念，禁止直接单选。归一化服务命中此表时必须走消歧路径，
# 无把握则返回 top-k + 置信度，由 agent 决定是否追问。
#
# 静默选一个是最糟的处理方式 —— 错误会被下游当成事实，且在返回体里看不出来。
#
# context_cues 是消歧的第一道（也是最便宜的一道）证据：
# 命中即可在向量与 LLM 之前定结果。cue 由领域同事维护，不靠模型生成。

registry_version: "0.1.0"

ambiguous_aliases:
  - alias: MET
    note: 本切片中歧义风险最高的一条 —— 阿斯利华核心靶点，误判直接影响主场景
    senses:
      - concept_key: MET
        entity_type: TARGET
        prior: 0.85
        context_cues:
          [inhibitor, 抑制剂, exon 14, ex14, skipping, amplification, 扩增,
           kinase, 激酶, HGF, receptor, 受体, fusion, 融合, savolitinib, capmatinib]
      - concept_key: methionine
        entity_type: SUBSTANCE
        prior: 0.10
        context_cues:
          [amino acid, 氨基酸, restriction, 限制, residue, 残基, methylation,
           dietary, 膳食, homocysteine]
      - concept_key: metabolic_equivalent
        entity_type: BIOMARKER
        prior: 0.05
        context_cues: [metabolic equivalent, MET-hours, physical activity, 运动强度, exercise]

  - alias: CD
    senses:
      - concept_key: crohn_disease
        entity_type: DISEASE
        prior: 0.5
        context_cues: [Crohn, 克罗恩, IBD, 炎症性肠病, ileum, colitis, 肠道]
      - concept_key: cluster_of_differentiation
        entity_type: BIOMARKER
        prior: 0.5
        context_cues: [CD3, CD4, CD8, CD20, marker, 分化簇, flow cytometry, 流式, antigen]

  - alias: ITP
    note: 阿斯利华 sovleplenib 的主适应症，与核苷酸缩写冲突
    senses:
      - concept_key: itp
        entity_type: DISEASE
        prior: 0.9
        context_cues:
          [thrombocytopenia, 血小板, platelet, purpura, 紫癜, splenectomy,
           eltrombopag, sovleplenib, 免疫性]
      - concept_key: inosine_triphosphate
        entity_type: SUBSTANCE
        prior: 0.1
        context_cues: [inosine, nucleotide, 核苷酸, ITPA, pyrophosphatase, 肌苷]

  - alias: PD
    note: 三义并存且三者都常见于临床文献，必须走上下文
    senses:
      - concept_key: progressive_disease
        entity_type: BIOMARKER
        prior: 0.4
        context_cues:
          [RECIST, response, 疗效评价, best overall response, ORR, stable disease,
           partial response, 疾病进展]
      - concept_key: pharmacodynamics
        entity_type: MECHANISM
        prior: 0.35
        context_cues: [pharmacokinetics, PK, 药效学, 药代, exposure, target engagement, biomarker modulation]
      - concept_key: parkinson_disease
        entity_type: DISEASE
        prior: 0.25
        context_cues: [Parkinson, 帕金森, dopamine, levodopa, neurodegenerative, 神经退行]

  - alias: NET
    senses:
      - concept_key: net
        entity_type: DISEASE
        prior: 0.7
        context_cues:
          [neuroendocrine, 神经内分泌, pancreatic, 胰腺, carcinoid, 类癌,
           surufatinib, 索凡替尼, Ki-67, chromogranin]
      - concept_key: norepinephrine_transporter
        entity_type: TARGET
        prior: 0.2
        context_cues: [norepinephrine, 去甲肾上腺素, SLC6A2, transporter, 转运体, reuptake]
      - concept_key: neutrophil_extracellular_trap
        entity_type: MECHANISM
        prior: 0.1
        context_cues: [neutrophil, 中性粒细胞, extracellular trap, NETosis, 胞外诱捕网]

  - alias: PI3K
    note: >-
      家族名而非具体亚基。在 targets.yaml 中已标 BROAD 不参与扩展，
      此处登记是为了让归一化服务在用户直接查 PI3K 时返回亚基候选而不是静默选一个。
    senses:
      - concept_key: PIK3CD
        entity_type: TARGET
        prior: 0.3
        context_cues: [delta, δ, p110delta, amdizalisib, idelalisib, lymphoma, 淋巴瘤, B cell]
      - concept_key: PIK3CA
        entity_type: TARGET
        prior: 0.5
        context_cues: [alpha, α, p110alpha, H1047R, E545K, breast cancer, 乳腺癌, alpelisib]
      - concept_key: PIK3CB
        entity_type: TARGET
        prior: 0.1
        context_cues: [beta, β, p110beta, PTEN-null]
      - concept_key: PIK3CG
        entity_type: TARGET
        prior: 0.1
        context_cues: [gamma, γ, p110gamma, myeloid, macrophage]

  - alias: AE
    senses:
      - concept_key: adverse_event
        entity_type: ADVERSE_EVENT
        prior: 0.9
        context_cues: [grade, CTCAE, 不良事件, safety, 安全性, serious, treatment-emergent, TEAE]
      - concept_key: allelic_exclusion
        entity_type: MECHANISM
        prior: 0.1
        context_cues: [allelic, 等位基因, immunoglobulin, rearrangement]

  - alias: ORR
    note: 单义，登记在此仅为记录「已评估过、确认无歧义」，避免重复排查
    resolved: true
    senses:
      - concept_key: objective_response_rate
        entity_type: BIOMARKER
        prior: 1.0
        context_cues: []
