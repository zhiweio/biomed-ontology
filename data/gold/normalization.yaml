  - { text: "regorafenib", expect: "HMD:SUB:0000008", entity_type: SUBSTANCE }
  - { text: "瑞戈非尼", expect: "HMD:SUB:0000008", entity_type: SUBSTANCE }
  - { text: "aspirin", expect: null, entity_type: SUBSTANCE }
  - { text: "XYZ-9999", expect: null, entity_type: SUBSTANCE }
  # 语料同步批次（0.2.0）：9 篇真实文献里出现的药。
  # 每条都覆盖一种写法失效模式 —— 通用名 / 研发代号 / 英文商品名 / 中文商品名 /
  # 中文通用名 —— 只测通用名等于只测了最容易的那一种。
  - { text: "osimertinib", expect: "HMD:SUB:0000010", entity_type: SUBSTANCE }
  - { text: "AZD9291", expect: "HMD:SUB:0000010", entity_type: SUBSTANCE }
  - { text: "TAGRISSO", expect: "HMD:SUB:0000010", entity_type: SUBSTANCE }
  - { text: "泰瑞沙", expect: "HMD:SUB:0000010", entity_type: SUBSTANCE }
  - { text: "奥希替尼", expect: "HMD:SUB:0000010", entity_type: SUBSTANCE }
  - { text: "gefitinib", expect: "HMD:SUB:0000011", entity_type: SUBSTANCE }
  - { text: "易瑞沙", expect: "HMD:SUB:0000011", entity_type: SUBSTANCE }
  - { text: "lazertinib", expect: "HMD:SUB:0000015", entity_type: SUBSTANCE }
  - { text: "amivantamab", expect: "HMD:SUB:0000017", entity_type: SUBSTANCE }
  - { text: "crizotinib", expect: "HMD:SUB:0000018", entity_type: SUBSTANCE }
  - { text: "克唑替尼", expect: "HMD:SUB:0000018", entity_type: SUBSTANCE }
  - { text: "lorlatinib", expect: "HMD:SUB:0000022", entity_type: SUBSTANCE }
