# 归一化 gold set：别名 → 期望概念。
#
# 分层抽样而非随机：三类实体的失败模式完全不同（药物靠代号、
# 靶点靠缩写歧义、疾病靠中英文与上下位），混在一个总准确率里看不出是哪层塌了。
#
# expect: null 表示"期望不匹配"——这类负样本是防止召回被调过头的唯一手段。
#
# 0.2.0：随本体同步真实语料一并扩容。新增用例按"一条覆盖一种写法失效模式"挑，
# 而不是按概念数平铺 —— 同一个概念的五种写法比五个概念的通用名更能测出问题。
version: "0.2.0"
cases:
  # ---------------- SUBSTANCE ----------------
  - { text: "savolitinib", expect: "HMD:SUB:0000001", entity_type: SUBSTANCE }
  - { text: "沃利替尼", expect: "HMD:SUB:0000001", entity_type: SUBSTANCE }
  - { text: "AZD6094", expect: "HMD:SUB:0000001", entity_type: SUBSTANCE }
  - { text: "HMPL-504", expect: "HMD:SUB:0000001", entity_type: SUBSTANCE }
  - { text: "沃瑞沙", expect: "HMD:SUB:0000001", entity_type: SUBSTANCE }
