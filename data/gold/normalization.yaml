  - { text: "安维汀", expect: "HMD:SUB:0000028", entity_type: SUBSTANCE }
  # XL092 走的是代号变体生成（XL-092 / XL 092 同归一）。
  - { text: "XL092", expect: "HMD:SUB:0000031", entity_type: SUBSTANCE }
  - { text: "pembrolizumab", expect: "HMD:SUB:0000032", entity_type: SUBSTANCE }
  - { text: "可瑞达", expect: "HMD:SUB:0000032", entity_type: SUBSTANCE }
  - { text: "tislelizumab", expect: "HMD:SUB:0000037", entity_type: SUBSTANCE }
