# 上下文消歧样本单列：它们只有带 context 才有唯一正确答案，
# 混进上面的表会让"无上下文准确率"被污染。
ambiguous_cases:
  - text: "MET"
    context: "MET exon 14 skipping mutation in NSCLC patients"
    expect: "HMD:TGT:0000001"
  - text: "MET"
    context: "8 MET of moderate exercise, metabolic equivalent of task"
    expect: null
  - text: "MET"
    context: "dietary MET intake, methionine amino acid residue homocysteine"
    expect: null
  - text: "NET"
    context: "神经内分泌瘤 neuroendocrine tumor 患者接受索凡替尼治疗"
    expect: "HMD:DIS:0000007"
