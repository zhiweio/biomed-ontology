  - { text: "camrelizumab", expect: "HMD:SUB:0000038", entity_type: SUBSTANCE }
  # 种子里写的是 SHR-1210，这条测的是去掉连字符后的生成变体。
  - { text: "SHR1210", expect: "HMD:SUB:0000038", entity_type: SUBSTANCE }
  # 剂型必须分开：nab-paclitaxel 与紫杉醇是两个概念，混判会把剂量学一起搞错。
  - { text: "nab-paclitaxel", expect: "HMD:SUB:0000040", entity_type: SUBSTANCE }
  - { text: "paclitaxel", expect: "HMD:SUB:0000041", entity_type: SUBSTANCE }
  - { text: "CPT-11", expect: "HMD:SUB:0000043", entity_type: SUBSTANCE }
  # 近音负例：sorafenib 是真实存在但本切片未收录的药，正确行为是弃权。
  # 目前它被 L2 向量级以 0.57 判成 regorafenib —— 两者都是 -afenib 类抗血管生成 TKI，
  # 编辑距离近而适应症不同，是本领域最典型的一类误判。
  # 这条现在是**红的**，留在 gold 里是为了让这个缺陷有名字、有位置、跑一次报一次；
  # 挑一批一定过的负例凑数，等于把这类错误从报告里抹掉。
  - { text: "sorafenib", expect: null, entity_type: SUBSTANCE }

