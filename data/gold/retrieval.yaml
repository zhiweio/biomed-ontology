# 检索 gold set：query → 相关片段的分级判定。
#
# 键用 `doc_id#section` 而不是 chunk_id：chunk_id 是内容哈希，
# 改一个字就全部失效，且人工审校时完全不可读。
#
# 用分级相关（2=高度相关 / 1=部分相关）而不是二值：
# 本体增强的收益主要体现在"把同义与下位表述也召回来"，
# 二值判定会把这部分收益抹平，评测就看不出该不该做本体。
#
# ---------------------------------------------------------------- 0.4.0
#
# 产品定位改为「关键词检索 + 本体桥接（别名/跨语言/层级）」之后，
# 主 KPI 不再是被图像与英文对照 query 稀释的全量 hybrid R@10。
# 每条 query 带 `probe`：
#   bridge_zh / alias  — 本体敏感（T1 主集）
#   hierarchy          — 宽泛上位；测过度扩展，不进 T1
#   control            — 英文词法本应够用
#   license / image    — 凭据闸门 / 视觉臂
#
# Q7 相关集从"只标 PSC 专篇"改为"综述为主 + 专篇为辅"：
# 旧标注下 BM25 与本体臂双双 R@10=0，测不到层级行为。
#
