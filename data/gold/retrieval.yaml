# 检索 gold set：query → 相关片段的分级判定。
#
# 键用 `doc_id#section` 而不是 chunk_id：chunk_id 是内容哈希，
# 改一个字就全部失效，且人工审校时完全不可读。
#
# 用分级相关（2=高度相关 / 1=部分相关）而不是二值：
# 本体增强的收益主要体现在"把同义与下位表述也召回来"，
# 二值判定会把这部分收益抹平，评测就看不出该不该做本体。
#
# ---------------------------------------------------------------- 0.2.0
#
# 判定粒度 = 章节：一个键展开成该节的**全部**切片，同 grade。
# 人工审校面对的是章节而不是内容哈希，让标注去追切片边界，
# 等于每调一次切片参数就要重标一遍。
#
# 这个粒度有个直接后果：一节动辄 5~14 片，|relevant| 常常超过 10，
# 于是 Recall@10 的上限就不是 1.0 了 —— 报表里的"召回上限"一行专门报这个数，
# 不报的话 0.42 会被读成"漏了 58%"，而其中大部分是格子不够放。
# nDCG@10 的理想序已按 top_k 截断，不受此影响，是这份 gold 上更可读的主指标。
#
# 覆盖范围：全部 14 篇（9 篇真实 CC-BY 文献 + 5 篇早期构造样本）。
# 覆盖全语料是为了让 judged@10 回到 1.0 —— 未判定的命中按不相关计入分母，
# 标注跟不上语料时，掉的是标注覆盖率，报表上却显示成检索质量下降。
#
# 十二条图像意图 query（Q26–Q37）带 `modality_intent: IMAGE`，
# 视觉专用臂只在它们上面评分。其中多条指向的图正文只有 "FIGURE1" 三个字，
# 纯文本臂在它们上面必然接近 0 —— 这不是噪声，正是视觉列要补的那个洞。
#
# 图像 query 同样计入全量平均（n=37），所以总表上的每个数都已经把
# "拿文本检索去回答看图的问题"这部分算进去了。报表另出一张按意图拆分的表：
# 文本意图 25 条读检索改造的效果，图像意图 12 条读视觉列的效果，
# 两者混在一个平均里，任何一边的变化都会被另一边稀释掉。
