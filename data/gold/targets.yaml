# 检索指标目标。**这个文件的存在就是为了让"没达成"有地方写。**
#
# 没有豁免机制时，一条达不到的断言只有两条出路：删掉它，或者调低它。
# 两条都会让对外结论慢慢和事实脱节，而且没人记得是什么时候脱的。
# 这里的做法是：目标照写，达不到就填 waiver + waiver_owner，
# 让"未达成"变成一条**署名的、带理由的、可复审的**记录。
#
# 反向绊线同样存在：目标已达成却还挂着豁免，也会让测试失败 ——
# 因为那意味着对外结论仍在引用一条过期的免责说明。
version: "0.1.0"
targets:
  - id: T1
    metric: recall_at_10
    arm: ontology_hybrid
    baseline_arm: bm25_only
    comparison: relative_gain
    threshold: 0.10
    rationale: 本体增强要证明自己值得维护，召回相对提升 10% 是最低门槛。
    waiver: |
      未达成。实测 Recall@10 0.604 → 0.417，相对 -31.0%（门槛 +10%）。
      **这不是"本体层失效"的证据，而是"这套 gold 已经量不动当前语料"的证据。**
      语料从 13 切片扩到 588 切片 / 14 篇文档（9 篇真实 CC-BY 文献），
      gold 仍是 21 条判定、全部落在早期 5 篇手写文档上。
      本体增强臂 judged@10 = 0.238：前十里七成以上的命中从没有人判定过，
      而未判定一律按不相关计入分母 —— 扩展越是把真实文献顶上来，被罚得越狠。
      抽查证实被罚掉的是对题内容：query "MET inhibitor pulmonary sarcomatoid
      carcinoma" 的第 1、2、5 名都是 MET 通路综述里的相关段落，全部计为 miss。
      在 judged@10 回到 0.8 以上之前，这条既不能判为退化，也不能宣称达成。
      **不接受"调低阈值"这种修法** —— 阈值是对产品的要求，不该迁就一把量不准的尺。
    waiver_owner: 检索方向负责人
    waiver_review_by: gold 集扩容至覆盖全部 14 篇文档、judged@10 ≥ 0.8 后重测；在此之前本条数字不得对外引用

  - id: T2
    metric: ndcg_at_10
    arm: ontology_hybrid
    baseline_arm: bm25_only
    comparison: not_worse
    threshold: 0.0
    rationale: 召回涨了但排序变差，等于把噪声推给下游 agent，不算收益。
    waiver: |
      未达成。实测 nDCG@10 0.629 → 0.453，绝对 -0.176。
      **但这个数不是检索质量的测量值，而是标注覆盖崩塌的产物。**
      语料已从 13 切片扩到 588 切片 / 14 篇文档（9 篇真实 CC-BY 文献），
      gold 仍只有 21 条判定、全部落在早期 5 篇手写文档上。
      本体增强臂的 judged@10 = 0.238 —— 前十里超过七成的命中从没有人判定过，
      按"未判定即不相关"计入分母，nDCG 必然塌下来。
      抽查证实塌下来的那部分是真内容：query "MET inhibitor pulmonary sarcomatoid
      carcinoma" 的第 1、2、5 名都是 MET 通路综述里的对题段落，全部计为 miss。
      本体臂的 judged@10 又是三个本地臂里最低的（0.238 vs BM25 0.263），
      说明扩展恰恰更擅长把未标注的真实文献顶上来，于是被这套 gold 罚得最狠。
      结论：在 gold 扩到当前语料之前，这条既不能判定为退化，也不能宣称无害。
      早先在 13 切片语料上定位到的"扩展把 grade-1 顶到 grade-2 前面"的排序缺陷
      （净 -0.002，源自 Q1/Q2）当时是成立的，但那批逐 query 归因已不可复现，
      不得继续引用。
    waiver_owner: 检索方向负责人
    waiver_review_by: gold 集扩容至覆盖全部 14 篇文档后立即重测重写；在此之前本条数字不得对外引用

  - id: T3
    metric: precision_at_5
    arm: ontology_hybrid
    baseline_arm: bm25_only
    comparison: not_worse
    threshold: 0.0
    rationale: 前五条是 agent 实际会读的部分，不能为了召回牺牲它。
    waiver: |
      未达成。实测 P@5 0.275 → 0.175，绝对 -0.100。
      与 T1/T2/T4 同源：judged@10 = 0.238，前五条里未判定的命中同样按不相关计入。
      P@5 的分母固定是 5，对未判定命中的挤占最直接 —— 只要扩展多顶上来一条
      未标注的真实文献，这条指标就掉 0.2，与那条文献本身相不相关无关。
      在标注覆盖补齐前，此数不具备判定力。
    waiver_owner: 检索方向负责人
    waiver_review_by: gold 集扩容至覆盖全部 14 篇文档、judged@10 ≥ 0.8 后重测；在此之前本条数字不得对外引用

  - id: T4
    metric: mrr
    arm: ontology_hybrid
    baseline_arm: bm25_only
    comparison: not_worse
    threshold: 0.0
    rationale: 首条命中位置直接决定 agent 的引用质量。
    waiver: |
      未达成。实测 MRR 0.792 → 0.580，绝对 -0.212。
      与 T2 同源，且同样**不是检索质量的测量值**：本体增强臂的 judged@10 只有 0.238，
      前十里七成以上的命中从未被判定过，一律按不相关计入，首条命中的名次自然被推后。
      MRR 只看第一条命中，对未判定命中的挤占最敏感 —— 语料扩了 45 倍而 gold 没动，
      这条指标是三项里最先失真的。
      早先在 13 切片语料上的精确归因（Q1/Q2 各从第 1 名掉到第 2 名，合计 -0.125）
      当时成立，但已不可复现，不得继续引用。
      样本量仍只有 8 条 query，单条 query 的一次错位就能左右整个均值，
      绝对值在任何语料上都不具备外推性。
    waiver_owner: 检索方向负责人
    waiver_review_by: gold 集扩容至覆盖全部 14 篇文档且 judged@10 ≥ 0.8 后重测；在此之前本条数字不得对外引用

  - id: T5
    metric: citation_fidelity
    arm: ontology_hybrid
    comparison: at_least
    threshold: 1.0
    rationale: |
      引用忠实度是这里唯一一条**不接受豁免**的目标。
      召回差只是找不到，用户会知道自己没拿到答案；
      引用不忠实是把一个看似有据的错误答案递出去，用户没有识别它的手段。
      本体扩展天然放大这个风险：扩展出来的概念很容易被顺手记成"原文说的"。
      因此这里对每条命中都回查语料真值，任何低于 1.000 的取值都必须当作缺陷修掉，
      而不是签一张豁免继续发版。

