# 检索指标目标。**这个文件的存在就是为了让"没达成"有地方写。**
#
# 没有豁免机制时，一条达不到的断言只有两条出路：删掉它，或者调低它。
# 两条都会让对外结论慢慢和事实脱节，而且没人记得是什么时候脱的。
# 这里的做法是：目标照写，达不到就填 waiver + waiver_owner，
# 让"未达成"变成一条**署名的、带理由的、可复审的**记录。
#
# 反向绊线同样存在：目标已达成却还挂着豁免，也会让测试失败 ——
# 因为那意味着对外结论仍在引用一条过期的免责说明。
#
# ---------------------------------------------------------------- 0.5.0
#
# 双面 Scorecard：I1 / B1 由 ``run_dual_eval`` 硬门禁（见 resolve.yaml / bridge.yaml），
# 不走本文件的 arm 比较器。T1–T5 仍为 Literature ARMS 目标。
# World Model 三后端门禁独占 ``hmd foundation golden-eval``（无 W* 于此）。
#
# ---------------------------------------------------------------- 0.4.0
#
# 产品定位为 World Model + Ontology Semantic Layer 之后，T1 不再用被图像意图（12/37）
# 与英文对照 query 稀释的全量 hybrid Recall@10 相对提升 ≥10%。
# 那条口径在 n=37 上配对检验长期不显著，且与身份桥接要验收的机制错位。
#
# 0.4.0 起 T1 读 **本体敏感探针**（probe ∈ {bridge_zh, alias}）上的 nDCG@10
# 绝对增益 —— 这才是别名归一与中文→英文桥接该交付的排序收益。
# hierarchy / control / image / license 仍进全量诊断表，但不进 T1。
#
# T2–T5 仍守全量口径的不劣化 / 引用忠实度（回归哨兵）。
#
# 读数前提：判定粒度是章节，|relevant| 常常大于 10，
# Recall@10 天花板约 0.848；主指标取 nDCG@10。
version: "0.5.0"

# Suite 硬门禁（文档化；实现见 DualEvalReport.ok）
# I1: resolve.yaml gate cases accuracy = 1.0
# B1: bridge.yaml alias + literature + entitlement
suite_gates:
  - id: I1
    suite: identity
    rule: gate_accuracy == 1.0
    rationale: 金标别名必须落到期望 HMD:ENT:*（Foundation resolve）
  - id: B1
    suite: bridge
    rule: alias_ok ∧ literature_ok ∧ entitlement_ok
    rationale: KB normalize 与 WM resolve 同 ENT；resolve 后文献可检索；许可还原不泄漏

targets:
  # T1：本体敏感探针上的 nDCG 绝对增益。
  #
  # 旧 T1（全量 R@10 相对 +10%）已退役：那条目标衡量的是"总体 hybrid 赢 BM25"，
  # 不是"别名/跨语言桥接是否工作"。图像 query 上两臂逐位相同，对照英文 query
  # 上 BM25 本就够用 —— 两者把差值往零压，再叠 n=37 的统计无力，只会永久挂豁免。
  #
  # 新口径：bridge_zh + alias（约 9 条）上 ontology_hybrid − bm25_only 的 nDCG@10
  # 绝对增益 ≥ +0.05。相对提升不用 —— 基线低时会被放大。
  - id: T1
    metric: ndcg_at_10
    arm: ontology_hybrid
    baseline_arm: bm25_only
    comparison: absolute_gain
    threshold: 0.05
    probes: [bridge_zh, alias]
    rationale: |
      企业实体身份桥接（别名归一与跨语言）要改善排序，
      不是在被图像/对照稀释的全量平均上赢 BM25 10%。
    waiver: |
      未达成：重解析 + multimodal-bio 全量重建后，探针 nDCG 绝对增益 −0.043
      （ontology_hybrid 0.749 vs bm25_only 0.792，阈值 +0.05）。
      句子级切片让图扩展 / 稠密通道更容易把同节噪声推到前排，别名桥接的排序净值被稀释。
      复审前不得把「本体敏感探针 +0.05」写成已交付。
    waiver_owner: 检索方向负责人
    waiver_review_by: |
      search-around 与通道融合在句子级语料上重调参（或章节聚合检索）后重测；
      增益稳定 ≥ +0.05 再撤豁免

  # T2（nDCG not_worse）：全量口径作回归哨兵：本体不得把总体排序弄坏。
  - id: T2
    metric: ndcg_at_10
    arm: ontology_hybrid
    baseline_arm: bm25_only
    comparison: not_worse
    threshold: 0.0
    rationale: 召回涨了但排序变差，等于把噪声推给下游，不算收益。

  # T3（P@5 not_worse）：前五是调用方实际会读的部分。
  #
  # Q7（lung cancer targeted therapy / hierarchy）相关集以综述为主，
  # 是故意留下的过度扩展探针，不是噪声。不接受为了转绿而删掉 Q7。
  - id: T3
    metric: precision_at_5
    arm: ontology_hybrid
    baseline_arm: bm25_only
    comparison: not_worse
    threshold: 0.0
    rationale: 前五条是调用方实际会读的部分，不能为了召回牺牲它。

  # T4（MRR not_worse）：首条命中位置直接决定引用质量。
  - id: T4
    metric: mrr
    arm: ontology_hybrid
    baseline_arm: bm25_only
    comparison: not_worse
    threshold: 0.0
    rationale: 首条命中位置直接决定引用质量。

  - id: T5
    metric: citation_fidelity
    arm: ontology_hybrid
    comparison: at_least
    threshold: 1.0
    rationale: |
      引用忠实度是这里唯一一条**不接受豁免**的目标。
      召回差只是找不到，用户会知道自己没拿到答案；
      引用不忠实是把一个看似有据的错误答案递出去，用户没有识别它的手段。
      本体扩展天然放大这个风险：扩展出来的概念很容易被顺手记成"原文说的"。
      因此这里对每条命中都回查语料真值，任何低于 1.000 的取值都必须当作缺陷修掉，
      而不是签一张豁免继续发版。
