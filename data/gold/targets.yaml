# 检索指标目标。**这个文件的存在就是为了让"没达成"有地方写。**
#
# 没有豁免机制时，一条达不到的断言只有两条出路：删掉它，或者调低它。
# 两条都会让对外结论慢慢和事实脱节，而且没人记得是什么时候脱的。
# 这里的做法是：目标照写，达不到就填 waiver + waiver_owner，
# 让"未达成"变成一条**署名的、带理由的、可复审的**记录。
#
# 反向绊线同样存在：目标已达成却还挂着豁免，也会让测试失败 ——
# 因为那意味着对外结论仍在引用一条过期的免责说明。
#
# ---------------------------------------------------------------- 0.2.0
#
# 上一版 T1–T4 的豁免理由全部是同一句话：gold 只覆盖早期 5 篇、judged@10=0.238，
# 数字不可信。gold 现已扩到全部 14 篇 / 28 条 query，**judged@10 = 1.000** ——
# 那个理由到此作废，不能再用。
#
# 重测后的实情是：本体增强臂在真实文献子集上确实赢了（+5.4%），
# 但总均值仍然输给纯 BM25（-5.2%），差额几乎全部来自 5 篇早期构造文档。
# 下面四条豁免按这个新事实重写；T4 已达成，豁免整条删除。
#
# 读数前提：判定粒度是章节，|relevant| 常常大于 10，
# 因此这份 gold 上 Recall@10 的天花板是 **0.800** 而不是 1.0（报表里有这一行）。
# 下面所有 Recall 数字都要按这个上限读。
version: "0.2.0"
targets:
  - id: T1
    metric: recall_at_10
    arm: ontology_hybrid
    baseline_arm: bm25_only
    comparison: relative_gain
    threshold: 0.10
    rationale: 本体增强要证明自己值得维护，召回相对提升 10% 是最低门槛。
    waiver: |
      未达成。实测 Recall@10 0.335 → 0.317，相对 -5.2%（门槛 +10%）。
      **这一版不再拿标注覆盖当理由** —— judged@10 已经是 1.000，
      前十里每一条命中都被判定过，这个数字是测量值，不是下界。

      逐通道消融（同一份 gold，只改通道组合）把差额拆开了：
        纯 BM25                     R@10 0.335 / nDCG 0.402
        BM25+DENSE（无图、无扩展）  R@10 0.333 / nDCG 0.411
        BM25+DENSE（开层级扩展）    R@10 0.333 / nDCG 0.411   ← 与上一行**逐位相同**
        +GRAPH（无扩展）            R@10 0.315 / nDCG 0.386
        本体增强混合（现行配置）    R@10 0.317 / nDCG 0.387
      三条结论：
      (a) 本体今天只经由 GRAPH 一个通道起作用，而这个通道净值为 **-0.018**；
      (b) `expand`（层级扩展）对总分的贡献是 **+0.002**，四舍五入等于没有 ——
          它只在 GRAPH 内部展开下位概念，从不改写 BM25/DENSE 的查询串，
          所以"本体增强"这个臂名今天名不副实；
      (c) 剩下的差额来自 DENSE 通道本身，与本体无关。

      按子集拆：真实文献 20 条 0.240 → 0.253（**+5.4%**），
      早期构造 8 条 0.573 → 0.479（-16.4%）。总均值为负全部由后者贡献。
      构造文档每篇只有 1–5 个单切片章节，|relevant| 是 1–4，
      挤掉一个名次就掉 0.25–0.50；而那些 query 本来就是照着文档正文写的，
      BM25 第一名命中，任何重排都只会让它变差。
      逐条看：Q6「晶型 专利 MET 抑制剂」1.00 → 0.50，掉在加入 DENSE 那一步；
      Q1「沃利替尼 治疗 肺癌 疗效」0.75 → 0.50，掉在加入 GRAPH 那一步。

      **不接受"调低阈值"或"删掉构造样本"这两种修法。** 前者是让要求迁就实现；
      后者是删掉唯一一批本体臂打不过 BM25 的证据 —— 那 8 条恰恰是最该留的。
      真正的修法在检索侧：GRAPH 通道在 84 个概念下几乎每个切片都能挂上，
      判别力已经稀释掉了，却仍以整通道权重参与 RRF；
      并且要让层级扩展真的作用到词法/向量通道上，而不是只在图里打转。
      这两项都属于检索器调优，本轮（本体与 gold 同步）明确不做，
      以免把"扩了本体"和"调了融合"两件事的效果搅在一起。
    waiver_owner: 检索方向负责人
    waiver_review_by: 检索侧完成 GRAPH 通道权重与查询改写两项改造后重测；在此之前对外只可引用"真实文献子集 +5.4%"，不可引用总均值

  - id: T2
    metric: ndcg_at_10
    arm: ontology_hybrid
    baseline_arm: bm25_only
    comparison: not_worse
    threshold: 0.0
    rationale: 召回涨了但排序变差，等于把噪声推给下游 agent，不算收益。
    waiver: |
      未达成。实测 nDCG@10 0.402 → 0.387，绝对 -0.015。
      与 T1 同源，归因见 T1 的消融表。这里补一条 T1 看不到的：
      **BM25+DENSE 的 nDCG 是 0.411，高于纯 BM25 的 0.402；
      一旦接上 GRAPH 就掉到 0.386。** 也就是说排序上的损失完全由图通道造成，
      而不是"混合检索本身排不好"。

      nDCG 是这份 gold 上最该看的一项：它的理想序按 K 截断，
      不受"|relevant| 大于 10"的天花板影响（Recall@10 的上限只有 0.800）。
      因此这条 -0.015 是干净的排序退化，不能像上一版那样推给标注覆盖。
      幅度不大，但方向明确，且在 en / zh 两个子集上一致。
    waiver_owner: 检索方向负责人
    waiver_review_by: 与 T1 同一批改造后重测

  - id: T3
    metric: precision_at_5
    arm: ontology_hybrid
    baseline_arm: bm25_only
    comparison: not_worse
    threshold: 0.0
    rationale: 前五条是 agent 实际会读的部分，不能为了召回牺牲它。
    waiver: |
      未达成。实测 P@5 0.314 → 0.286，绝对 -0.029。
      上一版把这条记在"未判定命中挤占前五"名下 —— judged@10 已回到 1.000，
      那条解释作废：前五里现在每一条都判过，掉下去的就是真的不相关。

      P@5 的分母固定是 5，一条 query 顶错一个位就掉 0.2，
      28 条 query 上的 -0.029 大致相当于"四条 query 各错位一格"。
      与 T1/T2 同源于 GRAPH 通道的判别力稀释。
    waiver_owner: 检索方向负责人
    waiver_review_by: 与 T1 同一批改造后重测

  # T4（MRR not_worse）已达成：0.626 → 0.643，+0.017。豁免整条删除 ——
  # 目标达成却还挂着免责说明，等于对外继续引用一条过期的理由，
  # 这个文件的反向绊线就是为了拦这种情况。
  #
  # 但达成的成色要说清楚：MRR 只看第一条命中，本体臂赢在"更早命中一条对题的"，
  # 而 T3 显示它在第 2–5 名上更差。两条并读才是完整图景：
  # 图通道把某些 query 的首条命中提前了，代价是前五里的其余名次变脏。
  - id: T4
    metric: mrr
    arm: ontology_hybrid
    baseline_arm: bm25_only
    comparison: not_worse
    threshold: 0.0
    rationale: 首条命中位置直接决定 agent 的引用质量。

  - id: T5
    metric: citation_fidelity
    arm: ontology_hybrid
    comparison: at_least
    threshold: 1.0
    rationale: |
      引用忠实度是这里唯一一条**不接受豁免**的目标。
      召回差只是找不到，用户会知道自己没拿到答案；
      引用不忠实是把一个看似有据的错误答案递出去，用户没有识别它的手段。
      本体扩展天然放大这个风险：扩展出来的概念很容易被顺手记成"原文说的"。
      因此这里对每条命中都回查语料真值，任何低于 1.000 的取值都必须当作缺陷修掉，
      而不是签一张豁免继续发版。
