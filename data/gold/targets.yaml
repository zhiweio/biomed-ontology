# 检索指标目标。**这个文件的存在就是为了让"没达成"有地方写。**
#
# 没有豁免机制时，一条达不到的断言只有两条出路：删掉它，或者调低它。
# 两条都会让对外结论慢慢和事实脱节，而且没人记得是什么时候脱的。
# 这里的做法是：目标照写，达不到就填 waiver + waiver_owner，
# 让"未达成"变成一条**署名的、带理由的、可复审的**记录。
#
# 反向绊线同样存在：目标已达成却还挂着豁免，也会让测试失败 ——
# 因为那意味着对外结论仍在引用一条过期的免责说明。
#
# ---------------------------------------------------------------- 0.3.0
#
# 0.2.0 的四条豁免记录的是同一件事：本体只经由 GRAPH 一个通道参与融合，
# 而那个通道往 RRF 里注入的是一个按 chunk_id（SHA-1 前缀）排序的随机采样。
# 那一版明确写下了修法（"GRAPH 通道权重与查询改写"）并把它列为复审时点。
# 检索侧改造已完成，本版按重测结果重写。
#
# 改造做了四件事，每一件都能单独关掉重测（`ARMS` 里的 ①→③ 阶梯）：
#   1. 种子里的 targets / indications 不再在 ingest 阶段被丢弃，
#      成为运行时可遍历的类型化链接（药↔靶点、药↔适应症，双向）；
#   2. GRAPH 通道从"三档离散值取 max"改成概念空间的 IDF 加权余弦
#      （概念 IDF 区分「肺癌」与「肾病综合征」，文档模长区分"讲这个"与"提一句"）；
#   3. RRF 带通道权重，GRAPH 先验固定 0.5；
#   4. `Normalizer.expand()` 的输出真正下发给词法与向量通道。
#
# 结果：T2 / T3 转绿，豁免整条删除；T1 仍未达成，理由重写。
#
# 同期还做了两件会改变读数口径的事，必须在读任何数字之前知道：
#   - 接上 bge-reranker-v2-m3 交叉编码器精排（`⑤`/`⑥` 两臂，需 `--reranker`）。
#     **下面 T1–T5 的判定一律取不开精排的 `ontology_hybrid`** —— 目标衡量的是
#     本体本身值不值得维护，把精排的增益记在本体账上就失去了这个意义。
#   - 图像意图 gold 从 3 条扩到 12 条，gold 总量 28 → 37。
#     所以本版所有绝对值都**不能**与 0.2.0 的数字直接相比：分母换了。
#
# 读数前提一：判定粒度是章节，|relevant| 常常大于 10，
# 因此这份 gold 上 Recall@10 的天花板是 **0.848** 而不是 1.0（报表里有这一行）。
# 下面所有 Recall 数字都要按这个上限读。
#
# 读数前提二：报表已给出配对自助 95% CI 与置换检验 p 值。
# **下面每一个差值，无论正负，都落在 CI 跨零的区间里。**
# 这句话对本体臂赢的那几项和输的那几项同样适用 —— 转绿的 T2/T3 说明的是
# "退化已经修掉了"，不是"本体被证明有增益"。后者需要更大的 gold。
#
# 读数前提三（本版新增）：37 条里有 12 条是图像意图，而**本体臂与无本体臂
# 在这 12 条上逐位相同**（概念挂不到图切片）。它们往总平均里灌 12 个恒等于零的
# 差值，把区间往零压。因此下面同时给出总均值与仅文本意图（n=25）两个口径 ——
# 前者是对外必须报的数，后者才是这轮检索侧改造真正作用的那批 query。
version: "0.3.0"
targets:
  - id: T1
    metric: recall_at_10
    arm: ontology_hybrid
    baseline_arm: bm25_only
    comparison: relative_gain
    threshold: 0.10
    rationale: 本体增强要证明自己值得维护，召回相对提升 10% 是最低门槛。
    waiver: |
      未达成，但方向已翻转。实测 Recall@10 0.262 → 0.264，相对 **+0.8%**（门槛 +10%）。
      上一版是 -5.2%；退化修掉了，增益没做出来。这两句话都要说。
      （绝对值比 0.2.0 低是因为 gold 从 28 条扩到 37 条，多出来的 9 条是图像意图，
      纯文本检索在它们上面本来就接近 0 —— 不是检索质量退了。）

      逐机制消融（同一份 gold，只改一处，nDCG@10 是主指标 ——
      它的理想序按 K 截断，不受 Recall@10 那个 0.848 天花板的影响）：
        ① BM25+DENSE 无本体            R@10 0.261 / nDCG 0.317 / P@5 0.249
        ② +图通道（仅种子概念）        R@10 0.255 / nDCG 0.325 / P@5 0.249
        ③ +search-around（类型化链接）  R@10 0.259 / nDCG 0.328 / P@5 0.254
        ④ 仅查询改写（无图通道）        R@10 0.263 / nDCG 0.318 / P@5 0.249
           本体增强混合（②+③+④ 全开）  R@10 0.264 / nDCG 0.325 / P@5 0.243
        对照：纯 BM25                   R@10 0.262 / nDCG 0.319 / P@5 0.243

      **配对显著性是这张表唯一诚实的读法**（本体增强 − 纯 BM25）：
        全部 n=37      nDCG +0.006  95% CI [-0.041, +0.055]  p=0.817
                       R@10 +0.002  95% CI [-0.037, +0.036]  p=0.915
        仅文本 n=25    nDCG +0.014  95% CI [-0.051, +0.080]  p=0.683
                       R@10 -0.010  95% CI [-0.063, +0.032]  p=0.762
      全部不显著，且换到文本口径后 Recall 的符号会翻负。这就是 n=37 上能拿到的
      全部信息 —— **不得把其中任何一项写成"本体带来 X% 提升"。**

      分语种仍是给出方向性结论的切分（en 26 条 / zh 11 条）：
        zh  nDCG 0.311 → 0.375（+0.064）   en  nDCG 0.322 → 0.303（-0.019）
      符号相反，与跨语言别名桥接的机制预期一致：中文 query 要命中英文文献，
      本体是唯一的桥；英文 query 上 BM25 本来就能直接命中，扩展只会摊薄。
      这条分表结论比总均值更该被引用（但 n=11，同样不可当成定论）。

      本版另有一条**与本目标口径无关、但必须一并记录**的证据。接上交叉编码器精排后
      （`⑤`/`⑥` 两臂，`--reranker bge-reranker-v2-m3`），文本意图 n=25 上：
        精排单独的贡献（⑤ − BM25）      nDCG +0.017  95% CI [-0.056, +0.089]  p=0.657
        本体在精排之上多给的（⑥ − ⑤）  nDCG +0.020  95% CI [-0.016, +0.061]  p=0.362
        两者合计（⑥ − BM25）            nDCG +0.037  95% CI [-0.055, +0.129]  p=0.449
      仍不显著，但**本体那一笔不比精排那一笔小，且区间更窄**。机制上说得通：
      精排只能在候选池内重排，而本体把 Recall@50 从 0.395 抬到 0.423 ——
      相关项没进池子，交叉编码器再准也够不着。`⑤` 这一臂存在的唯一理由就是
      让这个减法成立；没有它，`⑥` 的涨幅归谁全凭主张。

      **不接受"调低阈值"或"删掉构造样本"这两种修法。** 前者是让要求迁就实现；
      后者是删掉唯一一批本体臂打不过 BM25 的证据 —— 那 8 条恰恰是最该留的。
      真正的下一步有两条，都不在检索器调参上：
      (a) gold 从 37 条扩到能分辨 ±0.02 的规模（粗算需 150+ 条），
          否则这条目标在统计上根本无法被达成或证伪；
      (b) 种子概念从 84 个扩到覆盖语料主要实体 —— 目前 588 个切片里
          相当一部分挂不上任何概念，图通道对它们永远沉默；
          图像切片更是一片都挂不上，这正是那 12 条图像 query 上
          本体臂与无本体臂逐位相同的原因。
    waiver_owner: 检索方向负责人
    waiver_review_by: gold 扩到 150+ 条、且概念覆盖率达到可测水平（含图像切片挂概念）后重测；在此之前对外只可引用"中文 query 上 nDCG +0.064"这一条分语种结论，不可引用总均值，且必须同时给出 CI 与 p 值

  # T2（nDCG not_worse）已达成：0.319 → 0.325，+0.006。豁免整条删除。
  #
  # 0.2.0 时这条是 -0.015，理由写的是"排序上的损失完全由图通道造成"。
  # 那个诊断是对的：图通道当时只有三档离散分值，几百个候选并列同分，
  # 次级排序键落在 chunk_id（SHA-1 前缀）上 —— 进入 RRF 的前 30 名
  # 实际上是按哈希抽的随机样本，却带着与 BM25 相同的融合权重。
  # 改成概念空间的 IDF 加权余弦（概念 IDF + 文档模长归一）之后，
  # 同一个通道（① → ②）从 -0.016 变成 +0.008。
  #
  # 达成的成色：+0.006 的 95% CI 是 [-0.041, +0.055]，p=0.817 —— 跨零。
  # 这条转绿说明的是"退化修掉了"，**不是**"本体被证明能提升排序"。
  # 换成文本意图口径（n=25）是 +0.014，同样跨零；这条目标随时可能因为
  # 无关改动翻红，那是它该有的敏感度。
  - id: T2
    metric: ndcg_at_10
    arm: ontology_hybrid
    baseline_arm: bm25_only
    comparison: not_worse
    threshold: 0.0
    rationale: 召回涨了但排序变差，等于把噪声推给下游 agent，不算收益。

  # T3（P@5 not_worse）已达成：0.243 → 0.243，绝对 +0.000。豁免整条删除。
  #
  # 这是全表最勉强的一条：**恰好持平，不是赢**。0.2.0 时是 -0.029，
  # 相当于"四条 query 各错位一格"；那部分噪声来自图通道的哈希并列，已经消掉。
  # 但本体也没能在前五名上多带来任何一条相关项。
  #
  # 消融阶梯里 P@5 唯一为正的一步是 ③（search-around）：0.249 → 0.254。
  # 全开的本体臂反而回落到 0.243 —— 查询改写在英文上摊薄词频，
  # 前五名是最先受影响的位置。这个权衡目前没有解，只是被如实记着。
  #
  # 恰好持平意味着这条目标随时可能因为无关改动翻红。那是它该有的敏感度 ——
  # 前五条是 agent 实际会读的部分，这里退一步就该有人知道。
  - id: T3
    metric: precision_at_5
    arm: ontology_hybrid
    baseline_arm: bm25_only
    comparison: not_worse
    threshold: 0.0
    rationale: 前五条是 agent 实际会读的部分，不能为了召回牺牲它。

  # T4（MRR not_worse）已达成：0.501 → 0.505，+0.004。豁免早在 0.2.0 就删了 ——
  # 目标达成却还挂着免责说明，等于对外继续引用一条过期的理由，
  # 这个文件的反向绊线就是为了拦这种情况。
  #
  # 0.2.0 时这条的成色是"赢在首条、输在第 2–5 名"（当时 T3 是 -0.029）。
  # 本版 T3 已回到持平，那个权衡不再成立 —— 现在 MRR 与 P@5 同向。
  # 单看消融阶梯，MRR 的增益几乎全部集中在 ②（图通道）那一步：0.500 → 0.565，
  # 而全开的本体臂只剩 +0.004 —— 查询改写把首条位置又让了回去（④ 是 0.484）。
  # 图通道能把真命中顶到第一，这一条是它最清楚的证据。
  - id: T4
    metric: mrr
    arm: ontology_hybrid
    baseline_arm: bm25_only
    comparison: not_worse
    threshold: 0.0
    rationale: 首条命中位置直接决定 agent 的引用质量。

  - id: T5
    metric: citation_fidelity
    arm: ontology_hybrid
    comparison: at_least
    threshold: 1.0
    rationale: |
      引用忠实度是这里唯一一条**不接受豁免**的目标。
      召回差只是找不到，用户会知道自己没拿到答案；
      引用不忠实是把一个看似有据的错误答案递出去，用户没有识别它的手段。
      本体扩展天然放大这个风险：扩展出来的概念很容易被顺手记成"原文说的"。
      因此这里对每条命中都回查语料真值，任何低于 1.000 的取值都必须当作缺陷修掉，
      而不是签一张豁免继续发版。
