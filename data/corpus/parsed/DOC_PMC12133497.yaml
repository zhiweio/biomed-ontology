  title: 'Surufatinib related nephrotic syndrome in a pancreatic neuroendocrine tumor:
    a case report and review of literature.'
  doc_type: JOURNAL_ARTICLE
  language: en
  license_tier: TIER_0
  sections:
  - name: reportandreviewofliterature / Introduction / ChengqianShi1,JinglianLin1,XiadanXiang1,WenlongBao2
    text: '1Departmentof Nephrology,The SecondAfﬁliatedHospital ofZhejiangChinese
      MedicalUniversity,

      Hangzhou,China,2Department ofTraditionalChinese Medicine,The CancerHospitalof
      Universityof

      Chinese Academyof Sciences(ZhejiangCancerHospital),Hangzhou, China

      Pancreaticneuroendocrinetumors(pNETs)arerare,heterogenousneoplasms

      originatingfrompancreaticneuroendocrinecells,whichregulatehormone

      secretionandmetabolichomeostasis.Surgeryistheprimarymethodof

      controlandpotentialcureforpNETsandtargetedtherapieshavealsobeen

      investigated for low-grade inoperable or distant metastatic pNETs. Surufatinib,
      an

      oralangio-immunokinaseinhibitor,isapprovedfortreatinginoperableorlate-

      stage,low-grade(G1andG2),well-differentiatedpNETsandextrapancreatic

      neuroendocrine tumors. This study describes a case of nephrotic syndrome in
      a

      middle-aged woman with pNETs. This patient showed nephrotic syndrome after

      surufatinib treatment 3 months and renal pathology suggested IgA nephropathy

      with moderatepodocyte injury. However, the nephrotic syndromewas relieved

      after2weeksofdiscontinuationofsurufatinib.Afterresumingtreatmentwith

      low-dosesurufatinibfor2weeks,therandomproteinuriaquantiﬁcationwas

      increased and the proteinuria turned negative after discontinuation of surufatinib

      again.Itprovidesareferenceforsurufatinibrelatednephroticsyndromein

      patientswithpNETsandthepotentialmechanismbetweensurufatiniband

      podocyteinjuryin IgAnephropathy needstobeinvestigated.

      KEYWORDS

      pancreaticneuroendocrinetumors,IgAnephropathy,nephroticsyndrome,

      surufatinib,podocyte

      Pancreaticneuroendocrinetumors(pNETs)arerelativelyraremalignancieswith

      highlyheterogeneousbiologicalbehavioranddiverseclinicalmanifestations(1).The

      annualincidenceofpNETsfrom2000–2012was0.48per100000personsandthe

      medianoverallsurvival(OS)was3.6years(2).Surgeryistheprimarytreatmentfor

      improvingtheprognosisofpNETs,butthecombinationofsystemicdrugtherapy

      combinedwithlocaltreatmentshouldbeadopted,forpatientswithdistantmetastases

