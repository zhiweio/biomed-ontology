  sections:
  - name: KEYWORDS / Introduction
    text: 'EDITED BY Kanjoormana Aryan Manu, Amala Cancer Research Centre, India REVIEWED
      BY Natale Calomino, University of Siena, Italy Yanshuo Cao, Peking University,
      China *CORRESPONDENCE Jie Yang bianfangyangjie@163.com RECEIVED 16 December
      2024 ACCEPTED 28 April 2025 PUBLISHED 21 May 2025 CITATION Shi C, Lin J, Xiang
      X, Bao W and Yang J (2025) Surufatinib related nephrotic syndrome in a pancreatic
      neuroendocrine tumor: a case report and review of literature. Front. Oncol.
      15:1546217. doi: 10.3389/fonc.2025.1546217

      © 2025 Shi, Lin, Xiang, Bao and Yang. This is an open-access article distributed
