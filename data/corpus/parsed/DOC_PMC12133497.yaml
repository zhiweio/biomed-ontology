  - name: 10.3389/fonc.2025.1546217 / Case presentation
    text: 'orlocallyadvancedthatcannotbesurgicallyremovedatlowto

      intermediategrade (Grade1orGrade2, G1 orG2).

      Surufatinibisanoralangio-immunokinaseinhibitorthat

      selectivelytargetsvascularendothelialgrowthfactor(VEGF)

      receptors1-3,ﬁbroblastgrowthfactorreceptortype1(FGFR1),

      and colony stimulating factor-1 receptor (CSF-1R) (3). Surufatinib

      showedpromisingantitumoractivityandimprovedprogression-

      freesurvivalwithanacceptablesafetyproﬁleinChinesepatients

      withprogressive,advancedpNETsinthephaseIIISANET-ptrial

      (NCT02589821)(4).Currently,surufatinibhasbeenapprovedfor

      treatingpNETsandextrapancreaticneuroendocrinetumors

      (epNETs)inChina(5).

      In this study, we report a case of a 47-year-old woman suffering

      frompNETs,withthetreatmentofsurufatinibfor3months.The

      patient clinically showed nephrotic syndrome and Immunoglobulin

      A(IgA)nephropathywithmoderatepodocyteinjuryin

      renalpathology.

      In2016,a47-year-oldwomanfoundpancreaticabnormalities

      during a physical examination without any clinical manifestations.

      Abdominalcomputedtomography(CT)showedthattheshapeof

      the body and tail of the pancreas was thickened, with a huge mass of

      about12*4cmandunevendensitywithCTvalueof41Hu

      (Figure1A).AbdominalenhancedCTshowedcontinuous

      enhancementofpancreaticmass,withmultipleenlargedlymph

      nodesvisibleintheleftadrenalandspleenareas(Figures1B,C).

      The rest of the patient’s examination and laboratory indicators were

      normal.Combinedwithherimagingcharacteristics,laboratory

      indicatorsandclinicalmanifestations,itwasconsideredthatthe

      huge mass might be a pancreatic malignant tumor. In May 2016, the

      patientunderwentsurgicalresectionofahugepancreaticmass,

      splenectomy,andunilateraladrenalectomy.Postoperative

      pathology(PathologicalID:201612356)suggestedapancreatic

      neuroendocrinetumor(G2,8*7*6cm)(Figures2A,B).Basedon

      theabovemedicaldata,thepatientwasdiagnosedwithanon-

      functionalpancreaticneuroendocrinetumor (pNET).

      In February 2023, the patient returned to the hospital for a re-

      examination and an abdominal CT revealed multiple nodules in the

      liver.Liverenhancedmagneticresonanceimagingindicated

      multipleabnormalsignalsintheliverand,incombinationwith

      medicalhistory,metastatictumorsareconsidered(Figures3A-C).

      Subsequently,the5th, 6th,7th,and 8thsegmentsof theliver were

      surgicallyremoved.Postoperativepathology(PathologicalID:

      202307422)showedneuroendocrinetumorswerefoundinliver

      tissue and the pancreas origin was ﬁrst considered (Figures 2C, D).

      Then, in April of the same year, ultrasound-guided liver microwave

      ablationwas performed.

      Giventheriskofmultiplemetastasesandmalignancies,the

      surufatinib300mgorallyoncedailywasinitiatedinthethird

      weekaftercytoreductivesurgery.Previously,thepatienthad

      hypertensionformorethansevenyearsanddiabetesformore

      than four. At present, oral nifedipine controlled-release tablets of 30

      mg once daily and metformin hydrochloride tablets of 200 mg once

      dailywereused,thebloodpressureandbloodglucosewere

      generallyundercontrol.

      After3monthsoftreatment,thepatientgraduallydeveloped

      edemainbothlowerlimbs,sometimesaccompaniedbyfacial

      edema,withoutchesttightness,shortnessofbreath,nausea,

      vomiting,orothersymptoms.Weconductedapreliminary

      examinationandfoundthatproteinuriawaspositive(++)inthe

      urine routine. Further evaluation found severe proteinuria (Urinary

      microalbumin, UMa 1873.2 mg/L, 24-hour total protein 3184.5mg/

      24handurinarymicroalbumin/creatinineratios,ACR264.3mg/

      gCr), hypoproteinemia (albumin, Alb 26.4g/L) and hyperlipidemia

      (triglyceride 2.25mmol/L). We diagnosed the patient with nephrotic

      syndromebasedonclinicalmanifestationsandlaboratory

      indicators.Toclarifythepatient’srenallesionsandpossible

      causes,wearrangedanultrasound-guidedrenalbiopsy.Renal

      pathologysuggestsIgAnephropathy(KM55negative)with

      moderatepodocyteinjury(Figures4A-H).Consideringthe

      atypicaldepositionofIgAantibodiesinrenalpathology,themore

      signiﬁcantpodocytelesions,andthepatient’smedicalhistory,we

      considerthistobetumorordrugrelatednephropathy.Therefore,

      wediscontinuedsurufatinibandadjustedtheantihypertensive

      drugs(sacubitrilvalsartansodiumtablets100mgtwicedaily)and

