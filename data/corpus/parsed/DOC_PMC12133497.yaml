  - name: '10.3389/fonc.2025.1546217 #2 / Discussion'
    text: 'hypoglycemicdrugs(empagliﬂozintablets10mgoncedaily)after

      communicating with the patient. After two weeks of treatment, the

      patient’sedemasymptomsandproteinuriaurinalysiswere

      signiﬁcantlyrelieved(UMa168.1mg/L,ACR103.1mg/gCr)

      accompaniedbyanincreaseinserumalbumin(Alb32.7g/L).

      BasedontheconsiderationofpNET,theoncologydepartment

      recommendedthatthedosebereducedandthepatientre-started

      surufatinib(200mgoncedaily)treatment,every4weeksasa

      course.Regularmonitoringofpatienturinalysisshoweda

      signiﬁcantincreaseinrandomproteinuriaquantiﬁcation(UMa

      738.7mg/L)afterhalfacourseoftreatment.Finally,thepatient

      discontinuedthesurufatinibtreatmentonourrecommendation,

      andtheurineproteinwasnegativeaftermultipleexaminations

      (UMa86.8mg/L,ACR21.8mg/gCr,SupplementaryFigure1).

      Antitumortherapywastemporarilysuspendedbasedon

      multidisciplinaryteamconsensusandpatientpreference,with

      rigorousmonitoringoftumorstatusandhepatic/renalfunction

      parameters.Apredeﬁnedescalationprotocolwasestablishedto

      initiatealternativetargetedagents(e.g.,everolimus)or

      chemotherapeuticregimensshoulddiseaseprogressionoccur.

      WereportacaseofapNETpatienttreatedwithsurufatinib.

      Nephroticsyndromeonsetoccurred3monthsafterthesurufatinib

      treatment and ameliorated after surufatinib cessation. Unexpectedly,

      renal biopsy revealed IgA nephropathy without TMA.

      pNETs can be divided into functional or nonfunctional pNETs,

      basedontheabilitytoelaborateactivehormones,whichcause

      variousclinicalsymptoms,suchashypoglycemia,waterydiarrhea,

      andsevereulcerdiathesis(1,6).Theincidenceofnonfunctioning

      pNETsisincreasing,butpatientswithresectedfunctionalpNETs

      have a better OS compared to patients with nonfunctional pNETs,

      and a considerable proportion of functional pNETs may be detected

      at earlier stages because of obvious clinical symptoms (1). However,

      nonfunctionalpNETscanalsobeassociatedwithnonspeciﬁc

      clinicalsymptoms,suchasobstructionofthedigestivetract,

      jaundice,andpancreatitis,causedbytumorcompressionofthe

      pancreaticobiliary duct or invasion of peripancreatic organs. pNETs

      arecharacterizedbymultipleclinicalbehaviors,whichcanrange

      fromsmallbenignlesionsorslow-growingindolenttumorsto

      invasivelesionsorwidespreadmetastases(6).

      Actually,manysolidandhematologicmalignanciesare

      associatedwithkidneydisease,suchasmembranousnephropathy

      (MN),Minimalchangedisease(MCD),IgAnephropathy,focal

      segmentalglomerulosclerosis(FSGS),andother pathologicaltypes

      of glomerular diseases (7, 8). MN is the most common pathological

      typeinpatientswithsolidtumors,particularlyinlungandgastric

      cancers, sometimes in renal cell carcinoma (RCC), prostate cancer,

      andthymoma(9).Incomparison,MCDhasbeenreportedin

      associationwithlungcancer,classicHodgkinlymphoma,

      colorectalcancer,RCC,andthymomaandIgAnephropathycan

      beassociatedwithRCC,andtumorsoftherespiratorytract,

      nasopharynx,andbuccalmucosa(8,10).However,theexact

      pathogenesisinmostcasesremainsuncertain.Severalstudies

      havereportedtheassociationbetweenpancreaticcancerand

      kidneydiseasessuchasMN,MCD,andIgAnephropathy(7,8),

      butfewstudieshavereportedtheassociationbetweenpNETsand

      glomerular diseases or the related pathological mechanisms, it may

      manifest with RCC and pNETs in patients with von Hippel - Lindau

      (VHL) disease(11, 12).

      FIGURE2

      (A, B) Pancreatic neuroendocrine tumors, immunohistochemistry and oncogene detection:
      CAM5.2(+), PR(++,80%), AAT(+), Vim(-), CD10(-), Catenin\

      b-Catenin(+)、CD117\c-kit(-), Ki-67(+, 2%). (C, D) Neuroendocrine tumor found
      in liver tissue and considering pancreatic origin based on medical

      history, immunohistochemistry: Hepa(-), AFP(-), CK19(-), CK20(+), CgA(+), Sy(+),
      CD56(+), Ki-67(+, 5%), P53(+), SSTR2(+), CD10(-), b-Catenin(+).

      Shietal.

