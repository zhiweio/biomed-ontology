    page: 3
  - name: '10.3389/fonc.2025.1546217 #3'
    text: 'Signiﬁcantly,notonlythetumorsitselfcancausekidney

      disease,butthenewlydevelopedorconventionalanticancer

      chemotherapeuticagentsarenephrotoxicandcandamagethe

      kidneydirectlyorindirectly,whichcanaffectmorbidityand

      mortalityinpatientswithcancer(7).Anticancerchemotherapeutic

      agents can injure all nephron segments and the degree of damage is

      alwaysrelatedtodoseandduration.Forexample,cisplatinisan

      effectiveconventionalanticancerchemotherapeuticagentthatis

      widelyusedagainstavarietyofsolidtumors,butitsclinicaluseis

      often limited due to nephrotoxicity, especially in the proximal tubular

      epithelial cells (PTECs), which the pathological mechanisms include

      DNAdamage,mitochondrialpathology,oxidativestressandother

      stress responses (13).

      SurufatinibwasﬁrstapprovedinChinaforthetreatmentof

      late-stage,well-differentiated,epNETson30December2020and

      pNETs later (3). Previous trials and systematic reviews had reported

      theefﬁcacyofsurufatinibonepNETsandpNETs,signiﬁcantly

      improvingprogression-freesurvivalinpatients(4,5,14,15).

      However,thesafetyofnewlydevelopedanticanceragentsisalso

      thekeypointaffectingclinicaluse.Mostparticipantshadnotless

      thanonetreatment-relatedadverseeventduringthestudy[96%

      [108/113]inthesurufatinibgroupvs.92%[54/59]intheplacebo

      FIGURE3

      (A)In the arterialphase,multiplenodulesin the liver.(B,C)On a magneticresonanceimaginganddiffusionweightedimaging,multiple
      abnormal

      signalsaredetectedin theliver.

      Shietal.

