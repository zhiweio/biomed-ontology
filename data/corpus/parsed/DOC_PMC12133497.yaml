  - name: '10.3389/fonc.2025.1546217 #5 / Data availability statement'
    text: 'surufatinib group vs. 1% [1/68] in the placebo group in SANET-ep

      study (5)] and hypertension (14% [16/113] in the surufatinib group

      vs. 2% [1/59] in the placebo group in SANET-p study (4), and 16%

      [20/129] in the surufatinib group vs. 1% [1/68] in the placebo group

      inSANET-epstudy(5)).Toacertainextent,proteinuriahas

      becomeoneoftheimportantadverseeventsaffectingtheclinical

      applicationof drugsand theprognosisof patientswithNETs.

      It is well known that proteinuria is one of the key biomarkers of

      kidneyinjury,indicatingdisruptionordysfunctionofthe

      glomerularﬁltrationbarrier(GFB).ThebreakdownofGFBmay

      presentwithnephroticsyndrome(proteinuria,edema,

      hypoalbuminemia,andhyperlipidemia),proteinuriawith

      hypertension,orisolatedproteinuriainclinical.Inthe

      mechanism,GFBbreakdownresultsinabnormalactivationof

      glomerularcells,formationoflocalscartissue,glomerular

      capillariesocclusion,nephronperfusionchanges,and

      glomerulosclerosisinﬁnal,andmeanwhile,thepersistentserum

      proteinleakagedamagestherenaltubularepithelium,eventually

      leadingtotubulardysfunctionandtubulointerstitialﬁbrosis(16,

      17). Until now, a considerable number of patients with proteinuria

      duringtreatmenthadbeenreportedinnumeroussurufatinib

      clinicaltrials(4,5, 18–20),butthemechanismofGFB breakdown

      remainstobe furtherinvestigated.

      Severalstudieshavereportednephrotoxicityassociatedwith

      surufatinibfollowingitsapprovalfortreatment.Zhuetal.(21)

      reportedacaseofnephroticsyndromeaftersurufatinibtreatment

      and the renal biopsy conﬁrmed thrombotic microangiopathy (TMA).

      Similarly,sunitinib,anoralkinaseinhibitorthattargetsVEGF

      receptors1–3andplatelet-derivedgrowthfactor(PDGF)receptors,

      hadbeenapprovedforpatientswithadvancedprogressivepNETs

      over a decade (22, 23). Azar et al. (24) report a case of a patient with

      persistenthematuriaaftersunitinib(50mgdailyatbedtime)

      treatmentfortwoweeksandtherenalbiopsydemonstratedacute

      interstitialnephritis(AIN).Bolleeetal.(25)reportacaseof

      proteinuriaandhighbloodpressureaftersunitinib(37.5mgdaily

      ona4/2schedule)treatmentforsixmonthsandtherenalbiopsy

      showedtypicalfeaturesofTMA.Koetal.(26)reportacaseof

      proteinuriaaftersunitinib(25–50mgdailyona3/1schedule)

      treatmentforﬁvemonthsinapatientwithrenaltransplantation

      andtheallograftrenal biopsyshowed FSGS,AIN, andacute tubular

      injury. Takahashi et al. (27) report a case of nephrotic syndrome and

      renal dysfunction after sunitinib (25–50 mg daily on a 4/2 schedule)

      treatment for six months and the renal biopsy showed endothelial cell

      injuryandFSGS.Zonoozietal.(28)reportacaseofnephrotic

      syndromeaftersunitinibtreatmenttwoyearsandtherenalbiopsy

      showedmembranousnephropathywithPLA2R-positive

      immunoﬂuorescence.Thesereportshavedocumentedthe

      nephrotoxicity with the varying clinical manifestations of surufatinib

      or sunitinib, which target VEGF and related signaling pathways.

      Thiscaseisuniqueinthattheameliorationofnephrotic

      syndromeisassociatedwiththediscontinuationofsurufatinib

      andtherenalbiopsyresults.Basedonknownstudies,pNET-

      inducedIgAnephropathyandrelatedmanifestationsareunlikely.

      Notably,theclinicalmanifestationsofthiscase,particularly

      proteinuria,aresocloselyrelatedtosurufatinibtreatmentthat

      drug-related nephrotic syndrome needs to be considered. However,

      therenalbiopsyrevealedIgAnephropathywithmesangialcell

      proliferation,moderatepodocyteinjury,mildrenaltubule,and

      interstitial lesions, but no ﬁbrosis or TMA. Nephrotic syndrome is

      an infrequent manifestation of IgA nephropathy, occurring in only

      5% of cases (29, 30). We also detected KM55 antibody in renal tissue

      buttheresultwasnegative.Basedonthetemporalcorrelation

      betweensurufatinibadministrationandnephropathyonset,

      coupledwithrenalbiopsyﬁndingsdemonstratingatypicalIgA

      nephropathy,drug-inducedrenalinjurywasprioritizedinthe

      etiologicalassessmentafterexcludingtumor-associated

      nephropathyfeatures.Therefore,weconsiderthiscasetobe

      secondaryasymptomaticIgAnephropathyandthattreatment

      withsurufatinibadvanceskidneydiseaseanddamagesthe

      podocytes.GiventhehistopathologicaldiagnosisofatypicalIgA

      nephropathy with type 2 diabetes mellitus, the therapeutic strategy

      encompassedsurufatinibdiscontinuationcoupledwithrenin-

      angiotensinsysteminhibitorsandsodium-glucosecotransporter2

      inhibitorsasﬁrst-lineintervention.Forpatientsexhibiting

      suboptimalresponse,corticosteroids(e.g.,prednisone0.5mg/kg/

      day)wererecommended,emergingadjunctivetherapiesincluding

      mineralocorticoidreceptorantagonists(ﬁnerenone),endothelin

      receptorantagonists(sparsentan),andtargeted-release

      budesonide(Nefecon®)couldbeconsideredasindividualized

      options(30).Inspiredbythis,furtherstudiesarerequiredto

      conﬁrmNET-relatedorsurufatinib-relatedIgAnephropathy.

      Inconclusion,surufatinibrepresentsanefﬁcaciousadditionin

      patientswithwell-differentiatedNETs,regardlessofprevious

      antitumortherapiesortumororigin.However,safetyshouldbe

      consideredduringtreatment,suchasinthekidney,andthe

      mechanismofsurufatinib-inducedproteinuriashouldbe

      investigatedfurther.

