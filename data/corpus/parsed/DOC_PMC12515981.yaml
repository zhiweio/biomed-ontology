      widely used for gastrointestinalcancers in this population.16–20Its

      efﬁcacy in PDAC among East Asians is well established. According

      totheJASPAC01trial,S-1demonstratedgreaterefﬁcacythan

      gemcitabineintheadjuvantcontext,andresultsfromtheGEST

      trial

