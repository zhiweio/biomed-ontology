    text: 'group, 45 patients (100%) experienced TEAEs, compared to 43 patients (95.6%)
      receiving nab-paclitaxel and gemcitabine. Hematologic AEs, particularly declines
      in white blood cell, neutrophil, and lymphocyte counts, were the predominant
      TEAEs in patients treated with NASCA. For those receiving nab-paclitaxel and
      gemcitabine, decreased white blood cell count, anemia, and dcreased neutrophil
      count were most frequently reported. In the NASCA group, the most prevalent
      Grade 3 and 4 TEAEs were declines in white blood cell, neutrophil, and lymphocyte
      counts, whereas decreased white blood cell and neutrophil counts were prominent
      in the nab-paclitaxel and gemcitabine group (Table 3). Additionally, immune-related
      adverse events (irAEs) were documented in ten (22.2%) patients in the NASCA
      group, including three cases of Grade 2 hepatitis, one case of Grade 3 hepatitis,
      one case of Grade 2 colitis, two cases of Grade 2 hypothyroidism, two cases
      of Grade 2 hypophysitis, and one case of Grade 3 rash. Dose reductions due to
      TEAEs were required in seven patients (15.6%) in the NASCA and nine (20.0%)
      in the nab-paclitaxel and gemcitabine groups. Treatment discontinuation of any
      medication occurred in 15 patients (33.3%) receiving NASCA and 10 patients (22.2%)
      receiving nab-paclitaxel and gemcitabine. Two deaths occurred in the NASCA group,
      one due to liver failure not related to treatment and one from unspeci fi ed
      causes. For treatment with nab-paclitaxel and gemcitabine, one death was attributed
      to a non-treatment-related infection and one from unspeci fi ed causes. NASCA
      treatment was associated with manageable TEAEs, with no new safety signals.

      Subgroup and biomarker analyses . Subgroup analyses for both PFS and OS demonstrated
      consistent patterns with the results observed in the primary analyses (Supplementary
      Figs. 2 -4). In both the NASCA and nab-paclitaxel and gemcitabine groups, patients
      with a CA19-9 decrease at week 6 or week 12 had longer median PFS compared to
      those without a decrease (Supplementary Table 3).

      Multiplex immunohistochemistry (mIHC) was performed on baseline tissue samples
      of 26 patients who received NASCA treatment. The proportion of M1 to M2 macrophages
      within the stroma was markedly elevated in individuals achieving PR relative
      to those with SD and progressive disease (PD) ( p = 0.04) (Fig. 3a). Using an
      M1/M2 cutoff of 10, patients with higher M1/M2 ratios exhibited greater tumor
      shrinkage compared to those with lower ratios (Fig. 3b). Additionally, stromal
      M1/M2 cell percentages showed a correlation with the magnitude of tumor shrinkage.
      (r = -0.39, p = 0.051) (Fig. 3c). Using the median as a cutoff, patients with
      higher levels of M1/M2 ( p = 0.048), CD8 + ( p = 0.03), and CD8 + PD-1 + cells
      ( p = 0.0035) in stroma had longer PFS compared to those with lower levels (Fig.
      3d -f). Immune microenvironment features, including M1/M2 ratio and CD8 + in
      fi ltration, may serve as predictive biomarkers for NASCA bene fi t.

      Management of advanced pancreatic cancer continues to be challenging, largely
      owing to scarce treatment choices and dismal outcomes. Our study evaluates a
      new fi rst-line regimen, combining surufatinib, camrelizumab, nab-paclitaxel,
      and S-1, and con fi rms its ef fi cacy and safety in patients with metastatic
      pancreatic adenocarcinoma. The NASCA group achieved an ORR of 51.1%, signi fi
      cantly exceeding that of the standard nabpaclitaxel and gemcitabine regimen
      (24.4%), thereby meeting the primary endpoint. Additionally, the NASCA group
      showed a longer median PFS (7.9 months) relative to the nab-paclitaxel and gemcitabine
      group (5.3 months). Notably, this study represents the fi rst randomized trial
      comparing anti-PD-1 therapy combined with anti-angiogenic therapy and chemotherapy
      versus chemotherapy alone in this setting. Our fi ndings align with those from
      a similar phase II study evaluating anti-PD-1 therapy and angiogenesis inhibitors
      with chemotherapy in metastatic pancreatic cancer. Penpulimab with anlotinib
      and gemcitabine and nab-paclitaxel achieved an ORR of 50.0%, with a median PFS
      and OS of 8.8 and 13.7 months, respectively. 15 Additionally, our ORR and PFS
      values were numerically higher than those observed with nivolumab and modi fi
      ed FOLFIRINOX according to phase II trial data, which reported an ORR of 32.3%
      and a median PFS of 7.4 months. 9 The NASCA group also showed higher ORR and
      PFS compared to the gemcitabine and nab-paclitaxel in the MPACT and NAPOLI-3
      studies, which reported ORRs of 23% and 36%, with a median PFS of 5.5 and 5.6
      months, respectively. 4,6 Nonetheless, it is essential to approach these cross-study
      comparisons cautiously, as differences in study designs and patient populations
      limit direct comparisons.

      Fig. 1 Trial pro fi le. Two deaths occurred in the NASCA group, one due to liver
      failure and the other due to unspeci fi ed causes. In the nabpaclitaxel and
      gemcitabine group, one death was attributed to an infection and one due to unspeci
      fi ed causes

      Mechanistically, these results of surufatinib may be attributed to its ability
      to improve tumor vasculature normalization at a relatively low dose. 13,14 This
      improvement facilitates better drug delivery and mitigates hypoxia-induced chemotherapy
      resistance. 11,36 Surufatinib, a VEGFR tyrosine kinase inhibitor, also targets
      CSF1R. Blocking CSF1R signaling decreases the in fi ltration of tumor-associated
      macrophages and limits their polarization toward the M2 phenotype. 37 Notably,
      in vitro studies have shown that surufatinib plus an anti-PD-1 antibody and
      nab-paclitaxel and gemcitabine downregulates CSF1R, CD163 (an M2 macrophage
      marker), and PD-L1. 38 Through its in fl uence on the CSF-1/CSF-1R signaling
      axis, surufatinib could contribute to reshaping the immune contexture within
      tumors, which may improve responses to combination therapies. This study found
      that a higher baseline M1/M2 macrophage ratio was signi fi cantly associated
      with a higher response rate, deeper responses, as well as improved PFS. Moreover,
      CA19-9 has been recognized as a biomarker for predicting treatment response
      in several large phase III trials. 39 In this trial, patients with any decrease
      in CA19-9 at weeks 6 and 12 had a better PFS than those with no decrease, regardless
      of whether they received the NASCA or nab-paclitaxel and gemcitabine.

      In the MPACT and NAPOLI-3 phase III trials, median OS for patients treated with
      nab-paclitaxel and gemcitabine was 8.5 and 9.2 months, respectively, 4,6 while
      this study demonstrated a median OS of 11.0 months. The longer OS observed in
      this study may be attributed to the availability of subsequent therapies. Speci
      fi cally, 86.0% of patients treated with the nab-paclitaxel and gemcitabine
      group and 66.7% treated with NASCA received subsequent therapy. At our center,
      we improved the availability of irinotecan-based regimens for second-line therapy,
      guided by fi ndings from the phase III HR-IRI-APC trial in which liposomal irinotecan
      plus 5- fl uorouracil and leucovorin as second-line treatment yielded a median
      OS of 7.39 months. 40 Safety pro fi le of the nab-paclitaxel and gemcitabine
      in this study aligned with data from the MPACT and NAPOLI-3 trials. 4,6 Moreover,
      the addition of surufatinib and camrelizumab to the nab-paclitaxel and S-1 backbone
      reported a controllable safety pro fi le. The administration of two oral drugs
      led to more pronounced gastrointestinal discomfort in the NASCA group. Furthermore,
      the incidences of Grade 3 increased aspartate aminotransferase and elevated
      bilirubin were higher in the NASCA group, which may be attributable to surufatinib
      and camrelizumab. Notably, around 11.1% of patients receiving NASCA developed
      Grade 3 or 4 peripheral neuropathy, an adverse effect that was not reported
      in those given nab-paclitaxel and gemcitabine. Although this

