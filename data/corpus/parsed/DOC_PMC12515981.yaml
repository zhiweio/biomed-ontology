      value of 10. c Correlation between the ratio of M1/M2 macrophage percentages
      in the stroma and tumor shrinkage. d Progression-free survival was analyzed
      according to the ratio of M1 to M2 macrophage percentages, with patients divided
      into high and low groups based on the median value. e Progression-free survival
      was analyzed based on the levels of CD8 + cells, using the median as the cutoff
      to de fi ne high and low groups. f Progression-free survival was analyzed in
      relation to the levels of CD8 + PD-1 + cells, strati fi ed by the median value.
      HR Hazard Ratio, NA not available 2

      Randomization was performed immediately prior to treatment initiation, and once
      assigned, randomization numbers were irrevocable and not reassigned.

      Patients in the NASCA group received surufatinib at the RP2D in conjunction
      with camrelizumab, nab-paclitaxel, and S-1 (same regimens as phase Ib) for eight
      cycles. Patients demonstrating a complete response (CR), PR, or SD then received
      maintenance therapy consisting of surufatinib (RP2D), S-1, and camrelizumab
      (same regimens as phase Ib). In the nab-paclitaxel and gemcitabine cohort, treatment
      involved nab-paclitaxel at 125 mg/m 2 IV on days 1 and 8, together with gemcitabine
      at 1000 mg/m 2 IV over 30 min on the same days, repeated every 21 days. Therapy
      in both study arms continued until radiographic progression, unacceptable toxicity,
      consent withdrawal, or patient death. Tumor evaluations were performed every
      6 weeks according to RECIST version 1.1 guidelines. AEs were categorized based
      on the National Cancer Institute Common Terminology Criteria for Adverse Events
      (NCI-CTCAE), version 5.0. Survival status was monitored every three months in
      the fi rst year after study drug discontinuation, and followed thereafter until
      death, loss to follow-up, or withdrawal of consent. Methodological details regarding
      fl uorescent multiplex immunohistochemistry and imaging techniques are provided
      in the supplementary appendix.

      The primary endpoints were DLTs and the RP2D of surufatinib in phase Ib, and
      ORR in phase II. Secondary endpoints included DCR, DOR, TTR, PFS, OS, and safety.
      Ef fi cacy was analyzed in the intention-to-treat population, which encompassed
      all patients who were randomized. For the safety analysis, all individuals who
      were randomized and received at least one dose of a study medication were included.
      As per RECIST version 1.1 criteria, ORR was de fi ned as the percentage of subjects
      with either CR or PR, while DCR included those with CR, PR, or SD. DOR represented
      the interval from the initial CR or PR documentation until disease progression
      or death. TTR was measured from randomization to the earliest achievement of
      CR or PR. PFS was calculated from randomization to the point of disease progression
      or death, and OS was measured from randomization until death due to any cause.

      Sample size estimation was based on an anticipated ORR of 0.49 for the NASCA
      group and 0.23 for the nab-paclitaxel and gemcitabine group, with a superiority
      margin set at 0. The calculation assumed a one-sided alpha level of 0.05 and
      a beta of 0.2. With equal randomization (1:1 ratio) between the two treatment
      groups, 40 participants per group were needed, equating to a total of 80 subjects.
      Accounting for a projected dropout rate of 10%, the fi nal required sample size
      was determined to be 90 patients.

      The median duration of follow-up was estimated using the reverse Kaplan -Meier
      approach. For the calculation of 95% CIs for ORR and DCR, the Clopper -Pearson
      exact method was applied. To determine the difference in rates between the experimental
      and control arms, along with associated two-sided 90% CIs, the Newcombe-Wilson
      method was used. Superiority was concluded if the lower limit of the 90% CI
      for the rate difference was greater than zero. OR was calculated by univariate
      logistic regression analysis. Median PFS and OS were estimated using the Kaplan
      -Meier technique, while survival differences between groups were assessed with
      the log-rank test. HRs and their 95% CIs were calculated using the Cox proportional
      hazards regression model. To identify the optimal threshold of serum CA 19-9
      for predicting 6-month survival, a time-dependent ROC curve analysis was conducted.
      A 6-week decrease or a 12-week decrease of CA19-9 levels were analyzed according
      to the optimal cutoff values. Subgroup analyses were conducted based on baseline
      variables and CA19-9 levels (by decrease using the optimal cutoff value). The
      evaluations employed the Cox proportional hazards method and were summarized
      graphically using forest plots. Differences in immune cell populations among
      patients showing PR versus those with SD or PD were assessed using the Wilcoxon
      rank-sum test. The Spearman correlation was assessed between immune cell subsets
      and the best tumor shrinkage. All statistical analyses were conducted utilizing
      R software (version 4.4.1).'
