  - image_id: IMG:0003
    caption: 'Fig. 3 Fluorescent multiplex immunohistochemistry analysis of baseline
      tissue samples from 26 patients who received NASCA treatment. a Comparison of
      the ratio of M1/M2 macrophage percentages in the stroma between patients with
      partial response (PR) and those with stable disease (SD) or progressive disease
      (PD). b Tumor shrinkage in patients with a higher ratio of M1/M2 macrophage
      percentages in the stroma compared to those with a lower ratio, using a cutoff
      value of 10. c Correlation between the ratio of M1/M2 macrophage percentages
      in the stroma and tumor shrinkage. d Progression-free survival was analyzed
      according to the ratio of M1 to M2 macrophage percentages, with patients divided
      into high and low groups based on the median value. e Progression-free survival
      was analyzed based on the levels of CD8 + cells, using the median as the cutoff
      to de fi ne high and low groups. f Progression-free survival was analyzed in
      relation to the levels of CD8 + PD-1 + cells, strati fi ed by the median value.
