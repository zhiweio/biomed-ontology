      to

      gemcitabineasinitialtreatmentforadvancedPDAC.21,22These

      conclusions were further backed by a network meta-analysis from

      Japan, which demonstrated that ﬁrst-line treatment with S-1 yields

      survivaloutcomescomparabletothosewithgemcitabinein

      metastatic PDAC.23Both trials also reported lower rates of adverse

      events (AEs), especially hematologic toxicity, with S-1 compared to

      gemcitabine.21,22Apreclinicalstudyinpancreaticcancersuggest

      thatS-1plusnab-paclitaxelmayexertsynergisticantitumor

      effects,potentiallythroughstromaldepletionandimproved

      vascularization.24Thisdoubletregimenofferssimilarefﬁcacyto

