  title: 'First-line treatment with chemotherapy, surufatinib (an angio-immuno kinase
    inhibitor), and camrelizumab (an anti-PD-1 antibody) for locally advanced or metastatic
    pancreatic ductal adenocarcinoma: a phase Ib/II randomized study.'
  doc_type: JOURNAL_ARTICLE
  language: en
  license_tier: TIER_0
  sections:
  - name: adenocarcinoma:aphaseIb/IIrandomizedstudy / Signal Transduction and Targeted
      Therapy / OPEN
    text: 'RuJia1,Hai-YanSi1,Meng-JiaoFan1,NanZhang1,Guo-ChaoDeng1,Fang-FangLiu1,LuHan1,Miao-MiaoGou1,Zhao-LiTan1,

      XiaZhang1,Yan-RongWang1,YueShi1,Yao-YueZhang1,Yu-ShanJia1,Yu-QiWang2,Quan-LiHan1✉,Zhi-KuanWang1✉and

      Guang-HaiDai1✉

      Pancreaticductaladenocarcinoma(PDAC)hasapoorprognosisandlimitedﬁrst-linetreatments.ThisphaseIb/IIrandomizedtrial

      (NCT05218889)investigatedtheefﬁcacyandsafetyofsurufatinibpluscamrelizumabandnab-paclitaxel/S-1(NASCA)versusnab-

      paclitaxelandgemcitabineinpatientswithlocallyadvancedormetastaticPDAC.Theprimaryendpointsweredose-limiting

      toxicities and the recommended phase II dose (RP2D) of surufatinib in phase
      Ib, and the objective response rate (ORR) in phase II.

      Phase Ib used a 3 + 3 dose-escalation design to determine the RP2D of surufatinib
      in six patients, which was established at 200 mg.

      In phase II, patients were randomized 1:1 to receive the NASCA (45 patients)
      or nab-paclitaxel and gemcitabine (45 patients). NASCA

      groupshowedanORRof51.1%(23/45)versus24.4%(11/45)inthenab-paclitaxelandgemcitabinegroup(oddsratio3.2,95%CI

      1.3–8.2,p = 0.01).Themedianprogression-freesurvival(PFS)was7.9vs.5.3months(HR0.63,95%CI0.40–0.99,p
      = 0.045).The

      medianoverallsurvivalwas13.0vs.11.0months(HR0.77,95%CI0.47–1.28,p = 0.318).ThemostcommonGrade≥3treatment-

      related adverse event was decreased neutrophil count (33.3% vs. 35.6%). In the
      NASCA group, enrichment of CD8+and CD8+PD-1+

      cells, a high baseline M1/M2 macrophage ratio, and a reduction in CA19-9 levels
      at weeks 6 and 12 were associated with improved

      PFS comparedtopatientswithoutthese features.The NASCA regimenshowed promisingefﬁcacywithtolerablesafetyrelativeto

      nab-paclitaxelandgemcitabineforlocallyadvancedormetastaticPDAC.

      SignalTransductionandTargetedTherapy (2025) 10:339

      ;https://doi.org/10.1038/s41392-025-02441-2

      INTRODUCTION

      Theprognosisforpancreaticductaladenocarcinoma(PDAC)

      remainspoor,makingitaparticularlydifﬁcultdiseasetomanage.

      DatafromtheGlobalCancerStatistics2022indicatethatthere

      were511,000newlydiagnosedcasesand467,000deaths,

      placingthiscancer12thintermsofincidenceand6thfor

      cancer-relateddeathsglobally.1,2Asmostindividualsreceive

      theirdiagnosisatalatestage,justapproximately12%are

      anticipated

      to

      survive

      for

      more

      than

      5

      years.3

      First-line

      management

      of

      metastatic

      PDAC

      predominantly

      involves

      systemic

      chemotherapy,

      with

      regimens

      like

      nab-paclitaxel

