  - name: OPEN / Materials and methods / Study design and participants
    text: '6

      camrelizumab. Moreover, the fi ndings remain preliminary and are not de fi nitive.
      Nevertheless, this exploratory study provides an early signal that the addition
      of a PD-1 inhibitor and an antiangiogenic agent to chemotherapy may offer therapeutic
      bene fi t in PDAC, in contrast to the limited ef fi cacy reported in prior studies
      of chemoimmunotherapy. A phase II/III randomized controlled trial is currently
      being conducted to examine the combined use of surufatinib, camrelizumab, nab-paclitaxel,
      and gemcitabine for additional validation of these fi ndings.

      In conclusion, the NASCA regimen demonstrated superior outcomes compared to
      the nab-paclitaxel and gemcitabine regimen regarding ORR, TTR, and PFS, while
      maintaining an acceptable safety pro fi le in the management of PDAC. Enrichment
      of CD8 + and CD8 + PD-1 + cells, a high M1/M2 macrophage ratio at baseline,
      and an early reduction in CA19-9 levels served as valuable predictive biomarkers
      for PFS, underscoring their potential utility in clinical practice.

      Ethical approval for the protocol was granted by the Ethics Committee of the
      Chinese PLA General Hospital (S2021-228-03), and the study is registered on
      ClinicalTrials.gov (NCT05218889). Written informed consent was obtained from
      all subjects prior to participation. The trial was conducted in accordance with
      the Declaration of Helsinki and Good Clinical Practice recommendations.

      This investigation was designed as a phase Ib/II randomized clinical trial.
      Eligible individuals ranged from 18 to 75 years old and had pathologically or
      cytologically con fi rmed unresectable, locally advanced, or metastatic PDAC
      without previous systemic treatment for advanced disease. Principal inclusion
      criteria involved an Eastern Cooperative Oncology Group (ECOG) performance status
      between 0 and 1, at least one target lesion assessable by RECIST version 1.1,
      suf fi cient function of vital organs, and a projected life expectancy of at
      least 3 months. Exclusion parameters encompassed a history of treatment with
      VEGFR inhibitors or prior administration of immune checkpoint blockade.

      During the phase Ib, dose-escalation portion of the study, surufatinib was given
      orally once daily at increasing dose levels of 200, 250, or 300 mg. This agent
      was administered in combination with camrelizumab, nab-paclitaxel, and S-1.
      Camrelizumab was dosed intravenously (IV) at 200 mg on day 1 of each 21-day
      treatment cycle. Nab-paclitaxel was infused IV at 125 mg/ m 2 on days 1 and
      8, while S-1 was taken orally at 40 mg twice daily from days 1 to 14 of each
      three-week cycle.

      Dose escalation followed a 3 + 3 design based on DLTs observed in the fi rst
      treatment cycle. Non-hematologic DLTs were de fi ned as Grade ≥ 3 toxicities,
      except for certain conditions that were excluded: Grade 3 nausea, vomiting,
      diarrhea, or constipation resolving within one week after supportive care; Grade
      3 fatigue lasting ≤ 7 days; Grade 3 hypertension controllable within one week;
      alopecia, fever, or alkaline phosphatase elevation attributable to tumor or
      infection; and Grade ≥ 3 decrease in ventricular ejection fraction. Hematologic
      DLTs included Grade 4 neutropenia, thrombocytopenia, or hemoglobin decrease
      confi rmed by at least two tests within 2 days; Grade 3 thrombocytopenia with
      bleeding tendency con fi rmed by at least 2 tests within 2 days; and Grade 3
      dcreased neutrophil count with fever (ANC < 1.0 × 10 9 /L and body temperature
      ≥ 38.5 °C), con fi rmed at least twice within 2 days despite supportive care.

      In the phase II segment, participants were allocated in a 1:1 ratio to receive
      either the NASCA regimen or nab-paclitaxel in combination with gemcitabine,
      utilizing block randomization with a block size of four and no strati fi cation
      parameters. The random allocation sequence was generated by an independent biostatistician
      using R software (v4.4.1), and both the randomization sequence and block size
      were concealed from investigators to ensure allocation concealment until intervention
      assignment.'
