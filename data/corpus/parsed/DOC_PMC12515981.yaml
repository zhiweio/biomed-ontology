- doc_id: DOC:PMC12515981
  source_id: PMC
  title: 'First-line treatment with chemotherapy, surufatinib (an angio-immuno kinase
    inhibitor), and camrelizumab (an anti-PD-1 antibody) for locally advanced or metastatic
    pancreatic ductal adenocarcinoma: a phase Ib/II randomized study.'
  doc_type: JOURNAL_ARTICLE
  language: en
  license_tier: TIER_0
  sections:
  - name: OPEN / Introduction
    text: '1234567890();,:

      First-line treatment with chemotherapy, surufatinib (an angioimmuno kinase inhibitor),
      and camrelizumab (an anti-PD-1 antibody) for locally advanced or metastatic
      pancreatic ductal adenocarcinoma: a phase Ib/II randomized study

      Ru Jia 1 , Hai-Yan Si 1 , Meng-Jiao Fan 1 , Nan Zhang 1 , Guo-Chao Deng 1 ,
      Fang-Fang Liu 1 , Lu Han 1 , Miao-Miao Gou 1 , Zhao-Li Tan 1 , Xia Zhang 1 ,
      Yan-Rong Wang 1 , Yue Shi 1 , Yao-Yue Zhang 1 , Yu-Shan Jia 1 , Yu-Qi Wang 2
      , Quan-Li Han 1 ✉ , Zhi-Kuan Wang 1 ✉ and Guang-Hai Dai 1 ✉

      Pancreatic ductal adenocarcinoma (PDAC) has a poor prognosis and limited fi
      rst-line treatments. This phase Ib/II randomized trial (NCT05218889) investigated
      the ef fi cacy and safety of surufatinib plus camrelizumab and nab-paclitaxel/S-1
      (NASCA) versus nabpaclitaxel and gemcitabine in patients with locally advanced
      or metastatic PDAC. The primary endpoints were dose-limiting toxicities and
      the recommended phase II dose (RP2D) of surufatinib in phase Ib, and the objective
      response rate (ORR) in phase II. Phase Ib used a 3 + 3 dose-escalation design
      to determine the RP2D of surufatinib in six patients, which was established
      at 200 mg. In phase II, patients were randomized 1:1 to receive the NASCA (45
      patients) or nab-paclitaxel and gemcitabine (45 patients). NASCA group showed
      an ORR of 51.1% (23/45) versus 24.4% (11/45) in the nab-paclitaxel and gemcitabine
      group (odds ratio 3.2, 95% CI 1.3 -8.2, p = 0.01). The median progression-free
      survival (PFS) was 7.9 vs. 5.3 months (HR 0.63, 95% CI 0.40 -0.99, p = 0.045).
      The median overall survival was 13.0 vs. 11.0 months (HR 0.77, 95% CI 0.47 -1.28,
      p = 0.318). The most common Grade ≥ 3 treatmentrelated adverse event was decreased
      neutrophil count (33.3% vs. 35.6%). In the NASCA group, enrichment of CD8 +
      and CD8 + PD-1 + cells, a high baseline M1/M2 macrophage ratio, and a reduction
      in CA19-9 levels at weeks 6 and 12 were associated with improved PFS compared
      to patients without these features. The NASCA regimen showed promising ef fi
      cacy with tolerable safety relative to nab-paclitaxel and gemcitabine for locally
      advanced or metastatic PDAC.

      Signal Transduction and Targeted Therapy (2025) 10:339

      The prognosis for pancreatic ductal adenocarcinoma (PDAC) remains poor, making
      it a particularly dif fi cult disease to manage. Data from the Global Cancer
      Statistics 2022 indicate that there were 511,000 newly diagnosed cases and 467,000
      deaths, placing this cancer 12th in terms of incidence and 6th for cancer-related
      deaths globally. 1,2 As most individuals receive their diagnosis at a late stage,
      just approximately 12% are anticipated to survive for more than 5 years. 3 First-line
      management of metastatic PDAC predominantly involves systemic chemotherapy,
      with regimens like nab-paclitaxel combined with gemcitabine, FOLFIRINOX (irinotecan,
      leucovorin, fl uorouracil, and oxaliplatin), and NALIRIFOX (folinic acid, liposomal
      irinotecan, fl uorouracil, and oxaliplatin) reporting median overall survival
      (OS) durations of 8.5, 11.1, and 11.1 months, accordingly. 4 -6 Furthermore,
      immunotherapy ef fi cacy remains unsatisfactory for most patients, except for
      a small subgroup (~1%) with MSI-high/dMMR. 7 For example, treatments involving
      durvalumab alone or in combination with tremelimumab, as well as nivolumab combined
      with chemotherapy, have shown only limited responses. 8,9

      ; https://doi.org/10.1038/s41392-025-02441-2

      Immunotherapy approaches showed limited ef fi cacy in PDAC, potentially owing
      to the particular properties of the tumor and tumor microenvironment (TME).
      10 The hallmarks of PDAC TME include desmoplastic fi brotic stroma and hypovascularity
      resulting in increased interstitial pressure, poor tumor perfusion, intratumoral
      hypoxia, immune suppression, and inadequate delivery of systemic drugs. 10,11
      Addressing the poor vascularization characterized by immature and inef fi cient
      blood vessels may offer a novel avenue for PDAC therapy. Vascular normalization
      with increased pericyte coverage of vessels and improved tumor perfusion in
      an orthotopic PDAC mouse model resulted in decreased tumor hypoxia and enhanced
      chemotherapy delivery. 12 Moreover, normalizing blood vessels with anti-angiogenic
      drugs with low doses can reduce immunosuppression by restricting the functions
      of regulatory T (Treg) cells and myeloid-derived suppressor cells (MDSCs). This
      approach improves T cell activation and in fi ltration into tumors. 13,14 Therefore,
      we hypothesize that using anti-angiogenic agents to promote vascular normalization
      may enhance chemotherapy delivery, alleviate immune suppression, and improve
      tumor sensitivity to immunotherapy. Promising fi ndings were reported in a phase
      II study assessing penpulimab

      1 Senior Department of Oncology, Chinese PLA General Hospital, Beijing, China
      and 2 Geneseeq Research Institute, Nanjing Geneseeq Technology Inc, Nanjing,
      China Correspondence: Quan-Li Han (hanquanli@aliyun.com) or Zhi-Kuan Wang (wangzkme@sohu.com)
      or Guang-Hai Dai (daigh301@vip.sina.com) These authors contributed equally:
      Ru Jia, Hai-Yan Si, Meng-Jiao Fan, Nan Zhang'
    page: 1
  - name: 'OPEN / Results / Phase II randomized study: efficacy and safety / Baseline
      characteristics'
    text: '(an anti-PD-1 antibody) plus anlotinib (an inhibitor of angiogenesis),
      nab-paclitaxel, and gemcitabine, as fi rst-line treatment for metastatic pancreatic
      cancer. The regimen achieved a 50.0% objective response rate (ORR), 95.5% disease
      control rate (DCR), and median progression-free survival (PFS) and OS of 8.8
      months and 13.7 months, respectively. 15

      S-1, an oral fl uoropyrimidine, is better tolerated in East Asian patients due
      to ethnic differences in drug metabolism and is widely used for gastrointestinal
      cancers in this population. 16 -20 Its ef fi cacy in PDAC among East Asians
      is well established. According to the JASPAC01 trial, S-1 demonstrated greater
      ef fi cacy than gemcitabine in the adjuvant context, and results from the GEST
      trial indicated that S-1 offers comparable effectiveness to gemcitabine as initial
      treatment for advanced PDAC. 21,22 These conclusions were further backed by
      a network meta-analysis from Japan, which demonstrated that fi rst-line treatment
      with S-1 yields survival outcomes comparable to those with gemcitabine in metastatic
      PDAC. 23 Both trials also reported lower rates of adverse events (AEs), especially
      hematologic toxicity, with S-1 compared to gemcitabine. 21,22 A preclinical
      study in pancreatic cancer suggest that S-1 plus nab-paclitaxel may exert synergistic
      antitumor effects, potentially through stromal depletion and improved vascularization.
      24 This doublet regimen offers similar ef fi cacy to nab-paclitaxel plus gemcitabine,
      with better tolerability, and has recently been explored in China, especially
      at our center. 25 -29 A retrospective study showed that adding PD-1 blockade
      to this combination did not increase Grade ≥ 3 AEs, indicating a manageable
      safety pro fi le. 30

      Building on this rationale, we developed an exploratory multimodal regimen combining
      chemotherapy, anti-angiogenic therapy, and immunotherapy to improve antitumor
      ef fi cacy while maintaining acceptable safety. Given its favorable tolerability
      pro fi le, S-1 plus nab-paclitaxel was selected as the chemotherapy backbone.
      To further in fl uence the tumor microenvironment, we introduced surufatinib
      -a novel small-molecule agent that acts on tumor angiogenesis by inhibiting
      VEGFRs and FGFR1, and on immune escape mechanisms through CSF1R blockade. 31
      Two randomized phase III trials found that surufatinib provided a signi fi cant
      improvement in PFS for patients with advanced pancreatic and extra-pancreatic
      neuroendocrine tumors compared relative to placebo. 32,33 Initial results from
      a phase I trial evaluating surufatinib in combination with PD-1 inhibition in
      advanced solid tumors showed anti-tumor activity and good tolerability. 34 Camrelizumab,
      a PD-1 blocking antibody, showed clinical bene fi t at a 200 mg dose when administered
      alongside chemotherapy and radiotherapy in patients with locally advanced pancreatic
      adenocarcinoma. 35 Drawing upon this evidence, we initiated a phase Ib/II randomized
      study investigating the combination of surufatinib, camrelizumab, nab-paclitaxel,
      and S-1 as a fi rst-line treatment for patients with locally advanced or metastatic
      PDAC.

      Phase Ib study: dose determination

      The phase Ib study aimed to identify the recommended phase II dose (RP2D) of
      surufatinib in combination with camrelizumab, nab-paclitaxel, and S-1. Surufatinib
      at 200 mg was initially administered to three patients alongside camrelizumab,
      nabpaclitaxel, and S-1. After one individual developed a dose-limiting toxicity
      (DLT) with Grade 3 diarrhea, three further patients were treated using the same
      dose regimen. The following three patients did not develop any DLTs. Among the
      six patients, AEs observed during the study also included Grade 2 dcreased neutrophil
      count(n = 3), Grade 3 dcreased neutrophil count(n = 1), Grade 4 dcreased neutrophil
      count (n = 1; noted as a single-day event and thus not meeting DLT criteria),
      Grade 3 immune-related hepatitis (n = 2; occurring at Weeks 8 and 18, respectively,
      both beyond Cycle 1), and Grade 2 nausea (n = 1). The ORR was 66.7% (4/6), with
      a DCR of 100%. Considering the high antitumor activity and the tolerable safety
      pro fi le observed at this dose level, it was decided that no further dose escalation
      would be conducted. On this basis, surufatinib 200 mg was determined to be the
      RP2D. Surufatinib 200 mg showed manageable safety and high antitumor activity.

      Phase II randomized study: ef fi cacy and safety

      Baseline characteristics . During the phase II trial period from December 2021
      to June 2024, 90 patients were randomly assigned: 45 to receive surufatinib
      in combination with camrelizumab, nab-paclitaxel, and S-1 (the NASCA group),
      and 45 to the group treated with nab-paclitaxel and gemcitabine. All randomized
      subjects were administered their allocated regimens (Fig. 1). Additionally,
      35.6% of NASCA and 35.6% of nab-paclitaxel and gemcitabine patients had one
      metastatic site, and 35.6% and 31.1% had two, respectively. Biliary drainage
      was performed prior to treatment in seven individuals (15.6%) from the NASCA
      group and four (8.9%) from the nab-paclitaxel and gemcitabine group. In addition,
      one patient in the latter group required biliary drainage while on therapy (Table
      1). Baseline demographics and clinical features were balanced between groups.

      Ef fi cacy . At data cutoff on March 3, 2025, patients had been followed for
      a median of 21.5 months (95% con fi dence interval [CI]: 17.5 -25.9). The ORR
      was 51.1% (23/45) (95% CI 35.8 -66.3) in the NASCA and 24.4% (11/45) (95% CI
      12.9 -39.5) in the nabpaclitaxel and gemcitabine groups (rate difference: 26.7%,
      90% CI 9.9 -41.5 and 95% CI 6.6 -43.9; odds ratio [OR]: 3.2, 95% CI 1.3 -8.2,
      p = 0.01). The DCR reached 91.1% (95% CI 78.8 -97.5) and 88.9% (95% CI 75.9
      -96.3), respectively. Partial response (PR) was achieved by 23 patients and
      11, while stable disease (SD) was observed in 18 and 29 patients in the two
      groups, respectively (Table 2 and supplementary Fig. 1). Patients receiving
      NASCA had a median duration of response (DOR) of 8.1 months (95% CI: 5.8 -13.3),
      while those treated with nab-paclitaxel and gemcitabine had a median DOR of
      6.0 months (95% CI: 2.3 -13.0). The median time to response (TTR) for NASCA
      was 1.6 months (95% CI: 1.5 -2.7), notably shorter than the 2.5 months (95%
      CI: 1.4 -3.8) observed in the comparator group (Table 2).

      Patients in the NASCA group experienced a median PFS of 7.9 months (95% CI:
      5.9 -9.4), as opposed to 5.3 months (95% CI: 3.4 -6.4) for those receiving nab-paclitaxel
      and gemcitabine. The calculated hazard ratio (HR) was 0.63 (95% CI: 0.40 -0.99;
      p = 0.045). The 6-month and 12-month PFS rates were 61.4% (95% CI 45.4 -74.0)
      versus 43.7% (95% CI 28.9 -57.6) and 19.1% (95% CI 8.7 -32.6) versus 13.5% (95%
      CI 5.0 -26.3), respectively. Furthermore, the median OS reached 13.0 months
      (95% CI: 10.5 -16.1) for the NASCA and 11.0 months (95% CI: 8.4 -15.3) for the
      nab-paclitaxel and gemcitabine (HR: 0.77; 95% CI: 0.47 -1.28; p = 0.318). Sixand
      12-month OS rates were 95.6% (95% CI: 83.4 -98.9) and 56.5% (95% CI: 40.6 -69.7)
      for NASCA, versus 86.7% (95% CI: 72.7 -93.8) and 45.4% (95% CI: 30.2 -59.4)
      for the comparator group (Fig. 2). The NASCA regimen achieved a higher ORR and
      prolonged PFS compared to nab-paclitaxel and gemcitabine group, with a trend
      toward improved OS.

      At the data cutoff, 42 (93.3%) patients in the NASCA group and 43 (95.6%) in
      the nab-paclitaxel and gemcitabine group had discontinued study treatments.
      Subsequent therapy was received by 28 (66.7%) and 37 (86.0%) patients, respectively.
      The most common treatments were chemotherapy, mainly irinotecan (17 [60.7%]
      vs. 14 [37.8%]) or liposomal irinotecan (10 [35.7%] vs. 16 [43.2%]) and oxaliplatin
      (19 [67.9%] vs. 27 [73.0%]). Details of other therapies are provided in Supplementary
      Tables 1 and 2.

      Safety . To evaluate tolerability, treatment-emergent adverse events (TEAEs)
      were assessed in both groups. In the NASCA'
    page: 2
