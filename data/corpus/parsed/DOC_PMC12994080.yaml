    - - More specifc subject<br>area
      - Third-line and beyond therapy of mCRC
    - - Name of your trial in<br>progress
      - QUINTIS trial
    - - Reagents/tools
      - Patients in the experimental arm will receive<br>fruquintinib 5 mg orally
        once daily on days 1-21<br>of each 28-day cycle (q4w), in combination with<br>tislelizumab
        400 mg intravenously on day 1 of<br>each 42-day cycle (q6w) (Figure 1). Patients
        in<br>the control arm will receive trifuridine/tipiracil<br>35 mg/m 2 orally
        twice daily on days 1-5 and 8-<br>12 of each 28-day cycle (q4w), in combination<br>with
        bevacizumab 5 mg/kg intravenously on<br>day 1 of each 14-day cycle (q2w).
    - - Trial design
      - Randomized controlled phase ll trial
    - - Trial registration
      - 2024-519929-38-00; NCT06856837
    - - Ethics
      - This clinical trial has been designed and is being<br>conducted and reported
        in accordance with the<br>study protocol, the International Council for<br>Harmonisation
        Harmonized Tripartite Guideline<br>for Good Clinical Practice, applicable
        local<br>regulatory requirements for the sponsor<br>[including Regulation
        (EU) No. 536/2014], and<br>the ethical principles outlined in the current<br>version
        of the Declaration of Helsinki. The trial<br>is registered in the EU Clinical
        Trials Information<br>System (CTIS) and has obtained authorization<br>and
        ethical approval in compliance with<br>Regulation (EU) No. 536/2014. The trial<br>commenced
        in November 2025.
    - - Value of the Trial in<br>Progress
      - This trial assesses whether combined VEGFR<br>and PD-1 blockade improves outcomes<br>compared
        with current standard therapy in<br>refractory metastatic colorectal cancer
        (mCRC)<br>without active liver metastases. It also<br>evaluates the feasibility
        of selecting patients for<br>third-line and beyond treatment based on the<br>absence
        of active liver metastases.
