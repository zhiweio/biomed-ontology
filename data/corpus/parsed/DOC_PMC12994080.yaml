  - name: Table 3. Inclusion and exclusion criteria for the QUINTIS study
    text: 'Patient provided signed informed consent form.

      Patient is ≥ 18 years of age at the time of given informed consent.

      Patient has been diagnosed with histologically or cytologically proven microsatellite
      stable (MSS)/mismatch repair-proficient (pMMR) metastatic adenocarcinoma of
      the colon or rectum, which is not amenable to potentially curative resection.

      Known RAS ( KRAS or NRAS ) and BRAF V600E mutational status.

      Note: These mutations are mutually exclusive. Therefore, if one of the factors
      is mutated, it is not required to determine the mutation status of the others,
      as they are then assumed to be wild type.

      Patient without liver metastases defined as subjects without active liver metastases
      at screening as determined on baseline imaging of the liver as carried out by
      CT scan with contrast or MRI. Definitively treated liver metastases (which includes
      surgical resection, microwave or radiofrequency ablation, or stereotactic body
      radiotherapy, but not yttrium-90 or chemoembolization alone) that were treated
      at least 3 months before enrolment with no evidence of radiologic progression
      on subsequent imaging are considered to be non-active liver metastases.

      Patient received at least one line of previous treatment with a fl uoropyrimidine,
      oxaliplatin, irinotecan, VEGF(R) and if indicated EGFR and/or BRAF inhibitors
      in the advanced setting, or the patient has been intolerable or ineligible to
      those treatments.

      Patient has an ECOG performance status ≤ 1.

      Patient has a life expectancy > 16 weeks.

      Patient has adequate hematological, hepatic, and renal function.

      Absolute number of neutrophils (ANC) ≥ 1.5 × 10 9 /l.

      Platelets ≥ 100 × 10 9 /l.

      Total bilirubin ≤ 1.5 times the upper limit of normal (ULN) (or < 2 × ULN in
      case of prior liver involvement or Gilbert disease).

      AST and ALT ≤ 2.5 × ULN, AP ≤ 5 × ULN.

      Serum creatinine ≤ 1.5 × ULN or creatinine clearance (measured by 24 h urine)
      ≥ 30 ml/min (i.e. if serum creatinine level is > 1.5 × ULN, then a 24-h urine
      test must be carried out to check the creatinine clearance to be determined).

      Urinary protein ≤ 2 + on dipstick or routine urinalysis (UA; if urine dipstick
      or routine analysis is ≥ 3 + , a 24-h urine collection for protein must demonstrate
      < 2000 mg of protein in 24 h to allow participation in this protocol).

      Adequate coagulation function as defined by international normalized ratio (INR)
      ≤ 1.5, and a partial thromboplastin time (PTT) ≤ 5 s above the ULN (unless receiving
      anticoagulation therapy).

      Patients of childbearing potential must agree to remain abstinent (abstain from
      heterosexual intercourse) or use a very reliable method of contraception (methods
      with a failure rate of < 1%) during treatment and for up to 6 months after treatment
      ends. Patients using hormonal contraception must be willing to use an additional
      barrier method (actual adherence only required if randomly assigned to arm B).
      Non-sterilized male patients with a partner of childbearing potential must be
      willing to remain abstinent or use reliable methods of contraception during
      treatment and for up to 6 months after treatment ends (actual adherence only
      required if randomly assigned to arm B). Male patients with a pregnant partner
      must be willing to remain abstinent or use condoms for the duration of the pregnancy
      (actual adherence only required if randomly assigned to arm B). Female patients
      of childbearing potential must have a negative pregnancy test within the last
      7 days before the start of trial therapy.

      Patient is willing and able to comply with the protocol (including contraceptive
      measures) for the duration of the study including undergoing treatment and scheduled
      visits and examinations including follow-up.

      Patient has known allergic/hypersensitive reactions to at least one of the treatment
      components.

      Patient had previous malignancy other than that under study within 3 years or
      concomitant malignancy, except: those with a 5-year overall survival rate of
      > 90%, e.g. non-melanomatous skin cancer or adequately treated in situ cervical
      cancer.

      Patient received previous treatment with fruquintinib, trifluridine/tipiracil,
      regorafenib, or an anti-PD-(L)1 antibody.

      Patient receives current treatment with any anticancer therapy, such as systemic
      immunotherapy, chemotherapy, or hormone therapy within ≤ 2 weeks before study
      treatment start.

      Patient receives simultaneous treatment with a different anticancer therapy
      other than that provided for in the trial (excluding palliative radiotherapy
      for symptom control).

      Patient has known untreated or symptomatic CNS or leptomeningeal metastases.

      Patient has impaired cardiac function or clinically significant cardiac disease
      including unstable angina within 6 months before the fi rst dose of study treatment,
      acute myocardial infarction < 6 months before the fi rst dose of study treatment,
      New York Heart Association (NYHA) class II-IV congestive heart failure, uncontrolled
      hypertension (defined as an average systolic blood pressure > 160 mmHg or diastolic
      blood pressure > 100 mmHg) despite optimal treatment, uncontrolled cardiac arrhythmias
      requiring antiarrhythmic therapy other than ß -blockers or digoxin, active coronary
      artery disease, or corrected QT interval (QTc) ≥ 470.

      Patient has a history of uncontrolled infection with human deficiency virus
      (HIV) or chronic infection with hepatitis B or C virus (HBV, HCV).

      Patient has evidence of bleeding diathesis.

      Patient has grade 3-4 gastrointestinal bleeding within 3 months before the fi
      rst dose of trial therapy.

      Patient has a history of gastrointestinal perforation or fi stulae in the past
      6 months or risk factors for perforation.

      Use of strong inducers or inhibitors of CYP3A4 within 2 weeks (or 5 half-lives,
      whichever is longer) before the fi rst dose of study drug.

      Patient had a major surgery within 2 weeks before the fi rst dose of trial therapy.

      Patient experienced severe, life-threatening, or recurrent (grade ≥ 2) immune-mediated
      adverse events (AEs) or infusion-related reactions including those that led
      to permanent discontinuation while on treatment with immune-oncology agents.

      Patient received prior immunosuppressive therapy: immunosuppressive doses of
      systemic medications of > 10 mg/day of prednisone or equivalent must be discontinued
      ≥ 2 weeks before the fi rst dose of study treatment. Short courses of high-dose
      corticosteroids and/or continuous low dose of prednisone ( < 10 mg/day) are
      permitted. In addition, inhaled, intranasal, intraocular, and/or joint injections
      of corticosteroids are allowed.

      Patient has active autoimmune disease that has required systemic treatment (except
      replacement therapy) within the past 2 years or any other diseases requiring
      immunosuppressive therapy while on study.

      Patient has a history of solid organ transplantation.

      Patient has a history of thromboembolic events (including deep vein thrombosis
      and pulmonary embolism) within the past 6 months or history of stroke and/or
      transient ischemic attack within the last 12 months.

      Patient has a history of or current interstitial pneumonitis.

      Patient has evidence of any other serious concomitant or medical condition that,
      in the opinion of the investigator, presents a high risk of complications to
      the patient or reduces the likelihood of clinical effect.

      Female patient is pregnant or breast feeding or planning to become pregnant
      within and up to 6 months after end of treatment.

      ALT, alanine aminotransferase; AP, alkaline phosphatase; AST, aspartate aminotransferase;
      CNS, central nervous system; CT, computed tomography; ECOG, Eastern Cooperative
      Oncology Group; EGFR, epidermal growth factor receptor; MRI, magnetic resonance
      imaging; PD-(L)1, programmed death-(ligand) 1; VEGF(R), vascular endothelial
      growth factor (receptor).'
