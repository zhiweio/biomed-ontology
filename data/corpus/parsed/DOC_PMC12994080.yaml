  - name: Exclusion criteria / Acknowledgements / Sample size estimation
    text: 'Figure 1. Study schedule overview.

      5-FU, 5-fluorouracil; CT, computed tomography; EGFR, epidermal growth factor
      receptor; i.v., intravenous; LPI, last patient in; MSS, microsatellite stable;
      pMMR, mismatch repair-proficient.

      predefined futility boundary indicating a lack of efficacy. The study will continue
      if the observed HR ≤ 1.0; if the HR > 1.0, the trial will be stopped for futility.
      Forty events are considered sufficient for this analysis, as the probability
      of observing HR > 1.0 by chance is ∼ 1.4% assuming a true HR of 0.5, and 5%-15%
      assuming a true HR between 0.6 and 0.7 (as per sample size assumptions).

      This randomized phase II trial aims to estimate the therapeutic efficacy of
      fruquintinib in combination with tislelizumab in patients with mCRC. The primary
      endpoint is PFS, defined as the time from randomization to disease progression
      per RECIST v1.1 or death from any cause. The expected median PFS is 6 months
      in the control arm and 9 months in the experimental arm, corresponding to an
      assumed HR of 0.67, which is considered clinically meaningful. Using a one-sided
      significance level of 10% and 80% power, a total of 111 events are required
      to detect this difference using a log-rank test. Assuming a 2-year enrolment
      period, a 1.5-year follow-up period, and an annual dropout rate of 20%, a total
      of 140 patients (70 per arm) will be randomized. Sample size assumptions are
      based on historical data. 3,26 All statistical computations were carried out
      using SAS software, Version 9.4 (SAS Institute, Cary, NC).

      Considering prior safety and efficacy data from PD-1 + TKI combinations, including
      the phase III LEAP-017 trial and phase II studies of fruquintinib + tislelizumab,
      the regimen has shown favorable tolerability and clinically meaningful activity
      -particularly in non-liver-metastatic CRC. The QUINTIS trial therefore represents
      a rational next step to confirm these fi ndings in a randomized, controlled
      setting using an established standard-of-care comparator. The potential clinical
      benefits are expected to outweigh the manageable safety risks, especially as
      both agents are already approved and well characterized in this disease context.
      Patients without a history of liver metastases as well as patients with previously
      treated liver metastases are included and used for stratification in order to
      balance any potential negative impact of prior, but treated, liver metastases.

      JT is the coordinating investigator for the translational part and contributed
      to the writing of the protocol and this article. JG recruits patients and contributed
      to the writing of this article. SEA and TG are representatives of the sponsor.
      DA, ARS, SK, and GP are members of the steering committee. FD recruits patients
      and contributed to the writing of this article. MSC and RB contributed to the
      translational sample collection. AS is the coordinating investigator for the
      trial and contributed to the writing of the protocol and this article.

      We thank all patients who participated in the trial, the IKF team for their
      excellent support in conducting the study, Takeda for providing funding and
      the study drug, BeOne for providing the study drug, and all participating sites
      for their contribution.'
