- doc_id: DOC:PMC12994080
  source_id: PMC
  title: Fruquintinib in combination with tislelizumab versus trifluridine/tipiracil
    and bevacizumab in third-line and beyond MSS mCRC without active liver metastases-the
    IKF-080/AIO-QUINTIS trial.
  doc_type: JOURNAL_ARTICLE
  language: en
  license_tier: TIER_0
  sections:
  - name: TRIALS IN PROGRESS / Key questions addressed by the QUINTIS trial
    text: 'ESMO

      Fruquintinib in combination with tislelizumab versus trifluridine/tipiracil
      and bevacizumab in third-line and beyond MSS mCRC without active liver metastases
      -the IKF-080/AIO-QUINTIS trial

      J. Tintelnot 1 ∗ , J. Gorgulho 1 , S.-E. Al-Batran 2 , D. Arnold 3 , A. Reinacher-Schick
      4 , S. Kasper 5 , G. Prager 6 , T. Goetze 2 , R. Boston 1 , M. S. Cruz 1 , F.
      Dierks 1 & A. Stein 7 ∗

      1 ll. Department of Medicine, University Medical Center Hamburg-Eppendorf, Hamburg;
      2 The Frankfurt Institute of Clinical Cancer Research (IKF) and Krankenhaus
      Nordwest, UCT-University Cancer Center, Frankfurt; 3 Asklepios Tumorzentrum
      Hamburg, Department of Oncology and Hematology, AK Altona, Hamburg; 4 St. JosefHospital,
      Department of Hematology and Oncology with Palliative Care, Ruhr University
      Bochum, Bochum; 5 West German Cancer Center, Department of Medical Oncology,
      University Hospital Essen, Essen, Germany; 6 Division of Oncology, Department
      of Medicine I, Medical University of Vienna, Vienna, Austria; 7 HematologyOncology
      Practice Eppendorf (HOPE), University Cancer Center Hamburg (UCCH), University
      Medical Center Hamburg-Eppendorf, Hamburg, Germany

      Available online 10 March 2026

      Background: Patients with metastatic colorectal cancer (mCRC) who have progressed
      on fl uoropyrimidines, oxaliplatin, irinotecan, anti-angiogenic agents, and
      anti-epidermal growth factor receptor (EGFR) therapies have limited treatment
      options and poor prognosis, with a median overall survival (mOS) of ∼ 6 months
      on singleagent regorafenib or trifluridine/tipiracil. The addition of bevacizumab
      to trifluridine/tipiracil improved mOS to 10.8 months, and fruquintinib, a selective
      vascular endothelial growth factor receptor (VEGFR) 1-3 inhibitor, improved
      mOS to 7.4 months versus 4.8 months with placebo in refractory mCRC. However,
      combinations of tyrosine kinase inhibitors and immune checkpoint inhibitors
      have shown benefit primarily in patients without liver metastases in microsatellite
      stable mCRC, likely due to liver-associated immunosuppression. The QUINTIS trial
      evaluates whether fruquintinib plus tislelizumab can improve outcomes to the
      standard of care with trifluridine/tipiracil and bevacizumab in third-line and
      beyond mCRC.

      Methods/design: QUINTIS is a prospective, randomized, open-label, multicenter,
      phase II trial enrolling patients with advanced or metastatic colorectal adenocarcinoma
      without active liver metastases who have been previously treated with fl uoropyrimidines,
      oxaliplatin, irinotecan, bevacizumab, and, if indicated, an EGFR inhibitor.
      Participants are randomly assigned 1 : 1 to one of the following treatment arms:
      arm A (experimental): fruquintinib 5 mg orally once daily on days 1-21 of a
      4-week cycle (q4w) plus tislelizumab 400 mg intravenously on day 1 every 6 weeks
      (q6w); or arm B (control): trifluridine/tipiracil 35 mg/m 2 orally twice daily
      on days 1-5 and 8-12 of a 4-week cycle (q4w) plus bevacizumab 5 mg/kg intravenously
      on day 1 every 2 weeks (q2w). Randomization is stratified by prior anti-angiogenic
      therapy ( < 12 versus ≥ 12 months ago), BRAF / RAS mutation status, and history
      of liver metastases (never versus treated). Tumor assessments occur every 8
      weeks; follow-up continues for up to 18 months after enrolment. Optional translational
      research includes tumor, blood, and stool sampling to explore biomarkers of
      response and resistance.

      Key

      words: MSS mCRC, non-liver-metastases, checkpoint inhibition, fruquintinib,
      tislelizumab

      * Correspondence to: Dr Joseph Tintelnot, University Medical Center Hamburg-Eppendorf,
      Martinistraße 52, 20251 Hamburg, Germany. Tel: + 4940-7410-0

      E-mail: j.tintelnot@uke.de (J. Tintelnot).

      *Prof. Alexander Stein, Hematology-Oncology Practice Eppendorf (HOPE), University
      Cancer Center Hamburg (UCCH), University Medical Center Hamburg-Eppendorf, Eppendorfer
      Landstraße 42, 20249 Hamburg, Germany. Tel: + 49-40-360352222

      E-mail: stein@hope-hamburg.de (A. Stein).

      2949-8198/© 2026 The Author(s). Published by Elsevier Ltd on behalf of European
      Society for Medical Oncology. This is an open access article under the CC BY
      license (http://creativecommons.org/licenses/by/4.0/).

      Does combined VEGFR and PD-1 blockade improve outcomes over current standard
      therapy in refractory mCRC without active liver metastases?

      Is guided patient selection based on the absence of active liver metastases
      clinically feasible?

      Which subgroups benefit most from the combination of VEGFR and PD-1 blockade?'
    page: 1
  - name: GRAPHICAL ABSTRACT / Description of Protocol / Background
    text: 'Patients with metastatic colorectal cancer (mCRC) who have progressed on
      or after, or are intolerant to, fl uoropyrimidines, oxaliplatin, irinotecan,
      anti-angiogenic agents, and anti-epidermal growth factor receptor (EGFR) therapies
      have limited therapeutic options and a poor prognosis, with a median overall
      survival (mOS) of ∼ 6 months on single-agent regorafenib or trifluridine/tipiracil.
      1,2 The addition of bevacizumab to trifluridine/tipiracil improved mOS to 10.8
      months compared with trifluridine/ tipiracil alone [hazard ratio (HR) 0.61,
      95% confidence interval (CI) 0.49-0.77, P < 0.001]. 3 In addition, fruquintinib,
      a highly selective and potent oral inhibitor of vascular endothelial growth
      factor receptors (VEGFR) 1, 2, and 3, significantly improved mOS (7.4 versus
      4.8 months, P < 0.001) compared with placebo in refractory mCRC after a median
      of four prior lines of treatment. 4 Despite these advances, effective new treatment
      options are still needed for this heavily pretreated population.

      Combination regimens including programmed cell death protein 1 (PD-1)/programmed
      death-ligand 1 and/or cytotoxic T lymphocyte-associated antigen 4 inhibitors
      with or without tyrosine kinase inhibitors (TKIs) or anti-angiogenic agents
      have not demonstrated significant benefit in unselected microsatellite stable
      (MSS) mCRC populations, as shown in several trials -such as LEAP-017 (pembrolizumab
      + lenvatinib), IMblaze 370 (atezolizumab ± cobimetinib versus regorafenib),
      CCTG CO.26 (durvalumab + tremelimumab), BACCI (capecitabine +

      bevacizumab ± atezolizumab), and KEYFORM-007 (pembrolizumab + favezelimab).
      5-10 However, both preclinical and clinical analyses indicate that the presence
      of liver metastases negatively predicts response to immunotherapybased combinations.
      In multiple trials (Table 1), the nonliver-metastatic subgroups showed numerically
      greater benefit, though patient numbers were limited. The recently reported
      phase III STELLAR-303 trial (zanzalintinib + atezolizumab versus regorafenib)
      demonstrated the fi rst statistically significant improvement in OS (10.9 versus
      9.4 months; HR 0.80, 95% CI 0.69-0.93) in a non-microsatellite instabilityselected
      refractory mCRC population. 11 Notably, OS was numerically longer in patients
      without liver metastases (mOS 15.9 versus 12.7 months; HR 0.79, 95% CI 0.61-1.03),
      although this difference has not yet reached statistical significance, reflecting
      the generally better prognosis and therefore not yet mature follow-up in this
      subgroup. The fi nal data have to be awaited before fi nal conclusions can be
      made regarding the role of non-liver metastases in STELLAR 303. To fi nally
      clarify the hypothesis that hepatic metastases confer resistance to immunotherapy,
      dedicated studies in non-liver-metastatic patients are needed. Mechanistically,
      liver metastases can sequester and delete tumor-reactive T cells via hepatic
      macrophage-mediated immune tolerance, thereby impairing systemic antitumor immunity.
      12 These fi ndings provide a strong biological rationale to test immunotherapy
      combinations specifically in mCRC patients without liver involvement.

      The safety of combining PD-1 inhibitors with TKIs is supported by prior studies
      such as LEAP-017, where pembrolizumab and lenvatinib demonstrated manageable'
