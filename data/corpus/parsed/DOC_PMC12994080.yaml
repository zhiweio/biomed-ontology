  - name: J. Tintelnot et al. / Methods/design / Assessments
    text: 'PD-1, programmed cell death protein 1; VEGFR, vascular endothelial growth
      factor receptor.

      Patients will receive study treatment for up to 15 months. Tumor response will
      be assessed every 8 weeks (q8w ± 7 days) during treatment and every 12 weeks
      (q12w ± 14 days) during follow-up until disease progression. Overall, patients
      will be followed up for a maximum of 18 months after the last patient is enrolled,
      or until death, withdrawal of consent, or loss to follow-up, whichever occurs
      fi rst. Patients who provide additional consent for participation in the accompanying
      translational research program will contribute tumor tissue samples (at baseline
      and, if feasible, at disease progression), blood samples (at baseline, week
      4, and month 6 or at disease progression, whichever occurs fi rst), and stool
      samples (at baseline). These materials will be used for exploratory translational
      analyses to identify molecular biomarkers, assess their correlation with clinical
      outcomes, and explore mechanisms of resistance as outlined below.

      An optional translational research program will accompany the trial to identify
      biomarkers of response and resistance to

      4

      immunotherapy in mCRC. Archival tumor tissue, longitudinal blood samples, and
      baseline stool samples will be collected for integrated analyses of circulating
      tumor DNA (ctDNA), immune phenotypes, microbiota composition, and microbiotaderived
      metabolite. 18-21 Dietary patterns will be assessed longitudinally, and all
      routine computed tomography scans will be centrally collected for correlative
      radiologic analyses. 22

      Given the heterogeneity of immunotherapy responses in mCRC, these analyses aim
      to refine patient stratification beyond clinical features and to elucidate mechanisms
      underlying treatment response and resistance. The program focuses on three complementary
      domains: ctDNA dynamics as a molecular biomarker of response, 23 the diet -microbiota
      -metabolite axis as a modulator of antitumor immunity, 24 and systemic and intratumoral
      T cells as modulators of immunotherapy response in mCRC. 25

      Primary efficacy will be assessed in the intention-to-treat (ITT) population
      by comparing PFS between treatment arms using a log-rank test, Kaplan -Meier
      estimates, and Cox proportional hazards models to derive HRs and 95% CIs. Sensitivity
      analyses will be conducted in the perprotocol population. The same methodology
      will be applied to secondary time-to-event endpoints, including OS and duration
      of response. Binary endpoints (ORR, disease control rate) will be summarized
      with frequencies and 95% CIs and compared between arms using stratified Cochran
      -Mantel -Haenszel tests. HRQoL will be analyzed descriptively using the European
      Organisation for Research and Treatment of Cancer (EORTC) Quality of Life QuestionnaireCore
      30 (QLQ-C30) and EuroQol 5-dimension 5-level (EQ5D-5L) scores. Safety analyses
      will include all patients receiving at least one dose of study treatment and
      will summarize adverse events by severity, seriousness, and relationship to
      study treatment according to Common Terminology Criteria for Adverse Events
      (CTCAE). Baseline characteristics, treatment exposure, and concomitant medications
      will be summarized descriptively. Betweengroup comparisons will use appropriate
      non-parametric or categorical tests. All statistical tests will be two-sided
      with a significance level of 5%, without adjustment for multiple testing; exploratory
      analyses will be descriptive.

      The ITT population will be used for primary analyses, the per-protocol population
      for sensitivity analyses, and the safety population according to treatment received.
      Data will be reviewed before database lock to fi nalize analysis sets. Data
      management will be carried out using an International Council for Harmonisation-Good
      Clinical Practice (ICH-GCP)-compliant electronic data capture system by the
      Frankfurt Institute of Clinical Cancer Research, with data archived for at least
      25 years in accordance with regulatory requirements.

      A futility interim analysis for the primary endpoint (PFS) will be carried out
      after 40 events have occurred, based on a'
