  - name: J. Tintelnot et al. / Methods/design / Treatment / Arm A (experimental arm)
    text: 'Significant differences are bold.

      CI, confidence interval; HR, hazard ratio; LM, liver metastases; mCRC, metastatic
      colorectal cancer; MSI, microsatellite instability; MSS, microsatellite stable;
      OS, overall survival.

      toxicity. Grade ≥ 3 adverse events were more common with the combination (77%
      versus 59%), driven mainly by hypertension (28% versus 9%), proteinuria (11%
      versus 1%), and diarrhea (9% versus 4%). Immune-related events were also more
      frequent (48% versus 10%), notably hypothyroidism (38% versus 7%) and hyperthyroidism
      (5% versus 1%), though grade ≥ 3 immune events were infrequent (8% versus 2%).
      8 After adjustment for treatment duration, exposure-adjusted rates of severe
      events were comparable between arms. The combination of fruquintinib and PD-1
      inhibitors has shown feasibility and activity in several small retrospective
      and real-world studies 13,14 and in two single-arm phase II trials combining
      fruquintinib + tislelizumab with radiotherapy ( n = 24) or fecal microbiota
      transplantation ( n = 20). 15,16 Across these studies, treatment-related adverse
      events occurred in > 90% of patients, which were mostly grade 1-2, and grade
      ≥ 3 toxicities were reported in ≤ 30%. A recent meta-analysis including 716
      patients treated with fruquintinib ± PD-1 inhibitors across nine retrospective
      cohorts and one randomized trial confirmed that the safety profile of the combination
      was consistent with expected anti-VEGFR and PD-1-related toxicities, without
      unexpected signals. 17 Efficacy outcomes favored the combination, with higher
      objective response rates (ORR 2.45, 95% CI 1.83-3.56) and improved progression-free
      survival (PFS) (HR 0.64, 95% CI 0.49-0.84) compared with fruquintinib monotherapy.
      The presence of liver metastases remained a strong independent negative prognostic
      factor for both OS and PFS. 17

      Collectively, these data provide a strong biological and clinical rationale
      to evaluate the efficacy and safety of fruquintinib and tislelizumab compared
      with trifluridine/ tipiracil and bevacizumab in patients with refractory mCRC
      without active liver metastases, aiming to improve OS in this biologically defined
      patient population.

      The primary objective of this trial is to evaluate the efficacy of fruquintinib
      in combination with the PD-1 inhibitor tislelizumab in patients with mCRC (EudraCT:
      2024-51992938-00). The secondary objectives are to further assess the efficacy
      of the combination regimen, including additional measures of clinical benefit,
      and to evaluate patientreported health-related quality of life (HRQoL) during
      treatment. The safety objectives are to assess the safety profile and tolerability
      of fruquintinib combined with tislelizumab in this patient population. The exploratory
      (translational) objectives are to correlate molecular, serum, and stool biomarkers
      with radiographic and clinical outcomes, with the goal of identifying molecular
      markers predictive of tumor response and survival.

      The QUINTS trial is a prospective, randomized, open-label, multicenter, multinational
      phase II study conducted across 30 sites in Germany and Austria (Table 2, Supplementary
      Table S1, available at https://doi.org/10.1016/j.esmorw. 2026.100688). Eligible
      patients must have histologically confirmed advanced or metastatic adenocarcinoma
      of the colon or rectum and must have received prior treatment including fl uoropyrimidines
      (5-fluorouracil), oxaliplatin, irinotecan, and bevacizumab, as well as EGFR
      inhibitors if indicated.

      Participants meeting all eligibility criteria (Table 3) will be randomly assigned
      in a 1 : 1 ratio to arm A or arm B, stratified by (i) the time from anti-angiogenic
      therapy ( < 12 months versus ≥ 12 months), (ii) BRAF / RAS mutation status (wild
      type versus mutant), and (iii) history of liver metastases (never versus prior
      but treated).

      Arm A (experimental arm). Patients in the experimental arm will receive fruquintinib
      5 mg orally once daily on days 1-21 of each 28-day cycle (q4w), in combination
      with tislelizumab 400 mg intravenously on day 1 of each 42-day cycle (q6w) (Figure
      1).

      Arm B (control arm). Patients in the control arm will receive trifluridine/tipiracil
      35 mg/m 2 orally twice daily on days 1-5 and 8-12 of each 28-day cycle (q4w),
      in combination with bevacizumab 5 mg/kg intravenously on day 1 of each 14-day
      cycle (q2w).'
