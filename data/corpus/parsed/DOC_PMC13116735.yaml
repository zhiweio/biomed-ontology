      Abstract

      Objectives:Toevaluateandindirectlycompareoverallsurvival(OS)andsafetyofre-

      gorafenib,fruquintinib,andtrifluridine/tipiracil(TAS-102)monotherapyinrefractory

      metastatic colorectal cancer (mCRC) beyond the third line.Methods:A systematic
      review

      and meta-analysis of phase II/III randomized controlled trials was conducted
      according

      toPRISMAguidelines.PubMed/MEDLINE,Embase,andCochraneCENTRALwere

      searched from inception.Eligible studies included patients with mCRC previously
      treated

      with standard chemotherapy and biologic agents, receiving regorafenib, fruquintinib,
      or

      TAS-102asmonotherapyinthefourthlineorlater.OSdatawerereconstructedfrom

      publishedKaplan–Meiercurves.PooledmedianandmeanOSwereestimatedusinga

      random-effects model, and heterogeneity was assessed using the I2statistic.Safety
      out-

      comes were descriptively summarized.Results:Four RCTs were included.The pooled

      median OS was 7.83 months (95% CI: 6.98–8.80), and the pooled mean OS was 8.90
      months

      (95% CI: 8.00–9.81), with no heterogeneity (I2= 0%).Survival gains versus placebo
      ranged

      from 1.4 to 2.6 months.Survival curves largely overlapped, with differences
      below one

      month.Safety was consistent with known profiles.Conclusions:These agents provide

      comparable efficacy with modest survival benefit in late-line mCRC, highlighting
      the need

      for improved strategies and better treatment sequencing.

      Keywords:metastatic colorectal cancer; late-line therapy; trifluridine/tipiracil;
      regorafenib;

      fruquintinib; overall survival; systematic review

      1.Introduction

      Metastatic colorectal cancer (mCRC) remains a major cause of cancer-related
      mortality

      worldwidedespiteimprovementsinsystemictherapies.Inselectedpatients,tailored

      multidisciplinary approaches, including surgical resection of metastatic lesions,
      may offer

      long-termsurvivalbenefits,particularlyinoligometastaticdisease.Standardfirst-and

      second-line treatments typically consist of combination chemotherapy (fluoropyrimidine,

      oxaliplatin, irinotecan) with targeted agents such as anti-VEGF or anti-EGFR
      antibodies,

      achieving median overall survival (OS) approaching 30 months in selected populations.

      However, most patients eventually experience disease progression, and treatment
      options

      beyond the second line are limited and associated with modest benefit, underscoring
      an

      unmet clinical need in this refractory setting.

