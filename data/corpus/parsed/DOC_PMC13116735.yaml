      comparisonofsurvivaldynamicsacrossapprovedlate-linetherapiesintheabsenceof

      head-to-head trials.

      By focusing exclusively on treatment beyond the third line and excluding combination

      strategies such as TAS-102 plus bevacizumab administered in third line, this
      meta-analysis

      aims to clarify the comparative benefit-risk profiles of currently available
      oral agents in

      the late-line setting.The results are expected to provide clinically meaningful
      evidence

      to guide sequencing strategies in heavily pretreated mCRC patients and to identify
      areas

      where prospective comparative trials are urgently needed.

      2.1.Study Design

      This study was designed as a systematic review and quantitative meta-analysis
      [7,8]

      conducted in accordance with the Preferred Reporting Items for Systematic Reviews
      and

      Meta-Analyses (PRISMA) guidelines [9,10].In the Supplementary Material, you
      can find

      the PRISMA checklist [10].

      In addition to OS, qualitative information on study characteristics, including
      inclusion

      and exclusion criteria, patient populations, and sample size assumptions, was
      collected to

      improve contextual interpretation of results.

      Studies were included if they met the following criteria:

      1.

      Population:adult patients (≥18 years) with histologically confirmed metastatic
      col-

      orectaladenocarcinomapreviouslytreatedwithatleastthreepriorsystemiclines,

      including fluoropyrimidine, oxaliplatin, irinotecan, and anti-VEGF therapy (and
      anti-

      EGFR therapy for RAS wild-type tumors when applicable).

      2.

      Intervention:regorafenib, fruquintinib, or TAS-102 administered as monotherapy
      in

      the fourth line or later.

      3.

      Comparator:placebo or best supportive care.

      4.

      Outcomes:reporting OS with available Kaplan–Meier survival curves.

      Retrospective studies, single-arm trials, non-randomized studies, third-line
      combina-

      tion regimens, and non-English publications were excluded.

      The primary and sole quantitative endpoint of this meta-analysis was OS, defined
      as

      the time from randomization to death from any cause.

      Studies evaluating TAS-102 in combination with bevacizumab as third-line therapy

      were excluded, as the objective of the present analysis was to focus exclusively
      on treatments

      administeredbeyondthethirdline.Retrospectivestudies,single-armtrialswithouta

      comparator arm, case reports, and non-English publications were excluded.

      Exclusion criteria were consolidated into a single section to avoid redundancy
      and

      improve clarity.

      No time restrictions were applied in the literature search.

      2.2.Search Strategy and Data Extraction

      A comprehensive literature search was conducted in PubMed/MEDLINE, Embase,

      and the Cochrane Central Register of Controlled Trials (CENTRAL) from database
      inception

      to the most recent date prior to analysis.Major oncology conference proceedings
      were

      also screened.The search strategy combined terms related to metastatic colorectal
      cancer,

      refractory disease, late-line therapy, regorafenib, fruquintinib, TAS-102, randomized,
      and

      phaseIIItrials.Referencelistsofrelevantarticlesweremanuallyreviewedtoidentify

      additional eligible studies.The search strategy included combinations of the
      following

      keywordsandMedicalSubjectHeadings(MeSH)terms:“metastaticcolorectalcancer,”

      “refractorycolorectalcancer,”“fourthline,”“laterline,”“regorafenib,”“fruquintinib,”

      “trifluridine,” “tipiracil,” “TAS-102,” “randomized,” and “phase III.”

