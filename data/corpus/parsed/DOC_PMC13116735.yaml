      Thefullsearchstrategy(includingcompletesearchstringsforeachdatabase)was

      defined to ensure reproducibility.

      Twoindependentreviewers(JGandFF)screenedtitlesandabstracts,followedby

      full-textevaluationaccordingtopredefinedeligibilitycriteria.Discrepancieswerere-

      solved through discussion.From each eligible trial, the following study-level
      data were

      extracted:study name, publication year, geographic region, number of participants,
      treat-

      ment arms, and reported survival outcomes.Kaplan–Meier curves for OS were retrieved

      for reconstruction.

      When individual patient data were not available, published Kaplan–Meier survival

      curves were digitized to reconstruct time-to-event data using established statistical
      meth-

      ods.Extracted information was used exclusively for survival reconstruction and
      pooled

      survival estimation.

      Information on planned sample size and statistical power calculations, when
      available,

      was also extracted.

      Risk of bias was assessed independently by two reviewers using the Cochrane
      Risk

      of Bias tool, evaluating randomization, allocation concealment, blinding, completeness
      of

      outcome data, and selective reporting [11].

      Publicationbiaswasnotformallyassessedduetothelimitednumberofincluded

      studies; this was clearly distinguished from study-level risk of bias assessment.

      2.3.Statistical Analyses

      Statistical analyses focused primarily OS.

      Kaplan–Meier curves were digitized and individual patient data were reconstructed

      using the Guyot method.Numbers at risk were extracted when available, censoring
      was

      handled according to established methods, and reconstructed curves were visually
      val-

      idatedagainstpublisheddata.MedianOSandhazardratioswereconsideredprimary

      reference endpoints, while mean OS was estimated to allow pooled survival curve
      genera-

      tion and comparison of survival dynamics over time.

      A random-effects model was used to account for potential between-study variability.

      Median OS values were summarized descriptively across studies and aggregated
      to provide

      an overall estimate.

      Between-study heterogeneity was assessed using the I2statistic and the χ2test.An

      I2value<25%wasconsideredlowheterogeneity,25–50%moderate,and>50%high

      heterogeneity.

      Reconstructedsurvivalcurveswerevisuallycomparedtoevaluatedifferencesin

      survival dynamics over time [12].All statistical analyses were performed using
      R software

      R version 4.2.0 (R Foundation for Statistical Computing, Vienna, Austria), with
      survival

      and meta-analysis packages.

      Given the limited number of included trials (n = 4), formal assessment of publication

      bias was not performed.

      3.Results

      3.1.Study Characteristics

      A dedicated Study Characteristics section was introduced to improve clarity.

      Four RCTs treatment were included in the meta-analysis (Figure 1).The investigated

      agents were TAS-102 alone (1 RCT), regorafenib (2 independent RCTs), and fruquintinib

      (1 RCT). All studies enrolled heavily pretreated patients with refractory disease
      and re-

      portedOSastheprimaryendpoint.ThesummaryoftheanalyzedphaseIIIRCTsis

      reported in Table 1.

