      6 of 11

      No statistical heterogeneity was observed (I2= 0%); however, this finding should
      be

      interpreted cautiously given the small number of included trials.

      3.3.Comparative Analysis of Mean Overall Survival

      Numerical differences in mean OS were observed among treatments:

      •

      regorafenib (CONCUR) [13] showed the highest mean OS (9.34 months).

      •

      TAS-102 (RECOURSE) [1] demonstrated a mean OS of approximately 9.07 months.

      •

      regorafenib (CORRECT) [2] showed a mean OS of approximately 8.67 months.

      •

      fruquintinib (FRESCO-2) [6] demonstrated a mean OS of approximately 8.50 months.

      The maximum absolute difference between treatments remained below one month,

      indicating limited clinically meaningful differences across agents.

      A summary of median OS, median PFS, and major grade ≥3 adverse events for each

      included trial is reported in Table 2, providing a direct comparison of efficacy
      and safety

      across approved late-line therapies.

      3.4.Survival Curve Comparison

      The reconstructed OS curves (Figure 1) demonstrated a broadly overlapping pattern

      across the four treatment strategies.At early time points (3–6 months), survival
      probabili-

      ties were comparable across agents, with slight numerical separation favoring
      regorafenib

      (CONCUR) [13].Between 9 and 12 months, modest divergence was observed, with
      rego-

      rafenib(CONCUR)[13]maintainingthehighestsurvivalprobability,followedbyTAS-

      102 (RECOURSE) [1], while regorafenib (CORRECT) [2] and fruquintinib (FRESCO-2)
      [6]

      showedslightlylowerbutlargelyoverlappingsurvivalestimates.Atlatertimepoints

      (15–18 months), survival probabilities converged, with all treatments demonstrating
      similar

      tail behavior and no evidence of substantial long-term divergence.

      Overall, the survival curves indicate:parallel decline over time, absence of
      late separa-

      tion and no visually appreciable heterogeneity in survival dynamics

      These findings are consistent with the quantitative heterogeneity analysis (I2=
      0%),

      supporting comparable survival benefit across approved fourth-line and later
      therapies in

      refractory mCRC (Figure 2).

