    text: 'J. Clin.Med. 2026, 15, 3128

      2 of 11

      Twooralagents,trifluridine/tipiracil[1](TAS102)andregorafenib[2],havelong

      been established as standard salvage therapies for mCRC after progression on
      standard

      regimens, demonstrating statistically significant albeit incremental OS benefits
      compared

      with best supportive care (BSC) or placebo in pivotal trials.These agents are
      approved

      for use in patients previously treated with fluoropyrimidine-, oxaliplatin-,
      and irinotecan-

      based chemotherapy, as well as prior anti-VEGF therapy, and anti-EGFR therapy
      if RAS

      wild-type.Regorafenib, an oral multi-kinase inhibitor that targets angiogenic,
      stromal and

      oncogenic kinases including VEGFR, has been shown to increase OS in refractory
      mCRC

      and remains a benchmark in this setting.

      More recently, combination strategies aiming to enhance efficacy over monotherapy

      havebeeninvestigated.TheSUNLIGHTphaseIIItrial[3]establishedthatTAS102in

      combination with bevacizumab (an anti-VEGF antibody) significantly improves
      survival

      outcomes versus (vs.)TAS102 alone in refractory mCRC, resulting in regulatory
      approvals

      in multiple jurisdictions for patients who have received at least two prior
      lines of therapy. In

      this study, the addition of bevacizumab increased median OS and progression-free
      survival

      (PFS) compared with TAS102 alone, supporting maintenance of anti-angiogenic
      blockade

      beyond progression on prior bevacizumab-containing regimens.

      In parallel, regorafenib continues to be utilized as a salvage option, including
      after

      progression on TAS102 plus bevacizumab, with retrospective real-world analyses
      suggest-

      ing similar efficacy and safety outcomes in this sequence [4,5].Additionally,
      fruquintinib, a

      highly selective oral inhibitor of VEGFR-1, -2 and -3, has emerged as an effective
      third-line

      therapy, demonstrating significant improvements in OS and PFS compared with
      placebo

      in the international phase III FRESCO-2 trial [6], with a median OS of 7.4 months
      in the

      fruquintinibgroupvs.4.8monthsintheplacebogroup(HR=0.66,95%CI0.55–0·80,

      p < 0.0001). These results have informed regulatory approvals globally for previously
      treated

      mCRC, including in patients who have progressed following TAS102 and/or regorafenib.

      Importantly, despite these advances, the absolute magnitude of survival benefit
      ob-

      served with currently available later-line therapies remains limited, typically
      below three

      months.This raises critical questions regarding their clinical relevance, cost-effectiveness,

      and overall value, particularly in heavily pretreated patients with limited
      life expectancy.

      TheoptimalmanagementofmCRCbeyondthethirdlineoftherapyremainsan

      areaofsubstantialclinicaluncertainty.WhilecombinationstrategiessuchasTAS102

      plus bevacizumab have reshaped the standard third-line approach, treatment decisions

      afterfailureofstandardchemotherapydoubletsandbiologicagentsandparticularly

      after progression on a third-line regimen are not guided by direct comparative
      evidence.

      Inroutinepractice,patientswhohavealreadyreceivedfluoropyrimidine,oxaliplatin

      and irinotecan-based chemotherapy, as well as anti-VEGF and, where appropriate,
      anti-

      EGFR therapy, may receive sequential oral agents including regorafenib, fruquintinib,
      or

      trifluridine/tipiracil (TAS-102) monotherapy, depending on prior sequencing
      strategies.

      In clinical scenarios where TAS102 plus bevacizumab is administered in the third
      line,

      subsequentoptionsaretypicallylimitedtoregorafeniborfruquintinib.Conversely,in

      settings where regorafenib is chosen as third-line therapy, TAS-102 monotherapy
      may be

      reserved for later lines.Therefore, a clear understanding of the relative efficacy
      and safety

      of these agents beyond third-line therapy is critically needed to inform evidence-based

      sequencing decisions.

      The primary aim of this study was to conduct a systematic review and quantitative

      meta-analysis of phase II/III randomized controlled trials (RCTs) with reconstructed
      sur-

      vival data in order to evaluate OS among patients receiving regorafenib, fruquintinib,
      or

      TAS-102 monotherapy beyond the third line for refractory mCRC. Specifically,
      this anal-

      ysis aimed to estimate pooled survival outcomes and to perform an indirect descriptive

