    page: 8
  - name: 9 of 11
    text: 'J. Clin.Med. 2026, 15, 3128

      9 of 11

      An important aspect that warrants careful consideration is the toxicity profile
      of these

      agents.Although not quantitatively analyzed in this meta-analysis, previous
      studies have

      consistently reported clinically relevant adverse events associated with later-line
      therapies.

      Regorafenib and fruquintinib are commonly associated with hypertension, hand-foot
      skin

      reaction, fatigue, and hepatotoxicity, while TAS-102 is associated with hematologic
      toxicities

      such as neutropenia and anemia.These adverse events may significantly impact
      treatment

      adherence, dose intensity, and patient quality of life, and should therefore
      be integrated

      into treatment decision-making.

      In addition to toxicity, the economic burden of later-line therapies represents
      a critical

      and often under-discussed issue.The relatively high cost of these oral agents,
      combined

      with modest survival benefits,raises concerns regarding cost-effectiveness and
      sustain-

      ability,particularlyinhealthcaresystemswithlimitedresources.Inthiscontext,the

      valueoftreatmentshouldnotbeassessedsolelyonstatisticalendpoints,butratheron

      a comprehensive evaluation of clinical benefit, toxicity, patient-reported outcomes,
      and

      economic impact.

      Another key consideration relates to the design of the included trials, all
      of which used

      placebo as the comparator.While this approach allows for clear demonstration
      of drug

      activity, it may overestimate the perceived benefit in the absence of active
      comparators.

      In real-world clinical practice, patients often receive sequential therapies,
      and the relative

      positioning of these agents remains uncertain.Therefore, cross-trial comparisons
      should be

      interpreted with caution, and the lack of head-to-head studies represents a
      significant gap

      in the current evidence base.

      The interpretation of numerical differences between trials is further complicated
      by

      differencesinstudypopulations.Inparticular,theCONCURtrialenrolledexclusively

      Asian patients and included a lower proportion of patients previously treated
      with biologic

      agents compared with the CORRECT trial.These differences in baseline characteristics,

      prior treatment exposure, and potential pharmacogenomic factors may partially
      explain

      the numerically higher survival observed in CONCUR. This highlights the importance
      of

      considering population heterogeneity when interpreting indirect comparisons.

      From a methodological standpoint, this study employed reconstruction of individual

      patient data from published Kaplan–Meier curves,which represents a well-established

      approach in the absence of original datasets.To enhance the robustness of the
      analysis,

      numbers at risk were incorporated when available, censoring was handled according
      to

      standard methods, and reconstructed curves were visually validated against published

      data.Nevertheless, this approach remains inherently limited and cannot fully
      substitute

      for analyses based on original individual patient data.

      Theuseofmeanoverallsurvivalderivedfromreconstructeddatarepresentsan

      additional methodological consideration.While median OS remains the standard
      endpoint

      in oncology trials, mean OS provides complementary information by capturing
      the entire

      survival distribution and enabling the generation of pooled survival curves.This
      approach

      allows for a more comprehensive comparison of survival dynamics over time, although
      it

      should be interpreted alongside conventional endpoints.

      Theabsenceofstatisticallysignificantheterogeneityshouldnotbeinterpretedas

      definitiveevidenceofequivalencebetweentreatments.Giventhesmallnumberofin-

      cluded studies, both I2and χ2tests have limited sensitivity to detect true heterogeneity.

      Therefore, the observed consistency in outcomes should be viewed as suggestive
      rather

      than conclusive.

      Importantly, the findings of this analysis reinforce the concept that treatment
      selection

      in the later-line setting should be individualized.Given the minimal differences
      in efficacy,

      factors such as toxicity profile, patient comorbidities, performance status,
      prior treatment

