  - name: 20 of 27 / Limitations and challenges
    text: 'Liquid biopsies can detect rare mutations such as MET exon 14 skipping
      and RET fusions. Pre-treatment

      ctDNA levels have been used to identify low-risk patients who may benefit from
      sequential TKI treatment.

      ctDNA levels have been shown to identify patients with significantly improved
      survival rates post-

      treatment [145,146]. Serial detection provides insight into tumor burden, eliminating
      the need for repeating

      tissue biopsies. Several studies have found a significant association between
      quantitative changes in ctDNA,

      cancer response to the targeted therapy, and the prognosis of NSCLC.

      Minimal residual disease (MRD) is represented by early tumor development or
      relapse. Liquid biopsies can

      be used for early cancer treatments through their advantage of detecting micrometastatic
      disease and early

      abnormalities. A prospective longitudinal cohort study was conducted, where
      serial ctDNA detected relapse

      months earlier than imaging and predicted higher relapse risk [147].

      Liquid biopsies, specifically ctDNA, have become an indispensable tool in the
      management of EGFR-

      mutated NSCLC, particularly for patients treated with first- and second-generation
      EGFR TKIs. In summary,

      they have enabled non-invasive detection of EGFR mutations, real-time monitoring,
      and early identification

      of resistance mechanisms.

      Epigenetic Drugs

      Resistance to EGFR TKIs remains a significant challenge in NSCLC; epigenetic
      therapies are emerging onto

      the scene as a promising strategy of resistance reversal and a method of drug
      sensitivity restoration.

      Epigenetic therapies target gene expression modifications brought by DNA methylation
      and histone

      acetylation. These processes contribute to cancer progression and, in the case
      of NSCLC, the development of

      resistance to EGFR TKIs.

      There are multiple classes of epigenetic drugs (Figure 7); the most prominent
      are DNA methyltransferase

      inhibitors (DNMTis), histone deacetylase inhibitors (HSACis), and EZH2 inhibitors,
      which target histone

      methylation. Going into more detail, DNMTIs reverse the hypermethylation of
      tumor suppressor genes, such

      as CDKN2A and adenomatous polyposis coli (APC), thus restoring TKI sensitivity.
      DNMTi monotherapy

      showed minimal clinical response in trials involving NSCLC.

      Using DNMTi as a key player in combination therapies has yielded promising results.
      A phase I/II study of

      combined epigenetic therapy utilizes azacitidine and entinostat, which are DNA
      methylation and histone

      deacetylation inhibitors. The study reflected that nearly half of the patient
      cohort achieved disease control.

      Tumor biopsies taken post-treatment concluded that tumor suppressor genes CDKN2A
      and APC were re-

      expressed, which was in harmony with the clinical benefit [148].

      AI and Machine Learning, Predictive Modeling, and the Use of Radiogenomics in
      Lung Cancer Screening and

      Aiding in Personalized Therapy

      The use of artificial intelligence and machine learning has been slowly emerging
      as a key player in

      revolutionizing the prediction of resistance and personalized therapy. It has
      been shown to be very

      beneficial in predicting resistance mechanisms and identifying early relapse.
      As a landmark paper, the study

      by Chabon et al. (2020) demonstrated a method in which circulating tumor DNA
      (ctDNA) profiling combined

      with machine learning can predict EGFR TKI resistance in NSCLC. The machine
      learning model predicted

      T790M emergence with 92% accuracy months before progression. It also uncovered
      NF1 loss and TB1

      mutations as the main driving forces of resistance in T790M-negative tumors.
      The machine learning model

      could also detect MET amplification in ctDNA, which was confirmed later using
      tissue biopsies [149].

      Another study leveraged the ctDNA mutation burden, fragment size, and copy number
      alterations at

      baseline to train a machine learning model to avoid the need for longitudinal
      sampling. Baseline ctDNA

      features predicted progression risk with higher accuracy. The main predictive
      values utilized by the machine

      learning model were short ctDNA fragments, TP53 co-mutations, and high EGFR
      VAF. This study reflected

      how machine learning predictions can assist in guiding decisions regarding treatment
      [150].

      Limitations of Targeted Therapies in Lung Cancer

      The advent of targeted therapies has dramatically changed the prognosis for
      patients with actionable

      mutations in non-small cell lung cancer (NSCLC) by improving survival rates.
      These therapies, however

      valuable, do have some significant obstacles, including drug resistance, toxicity,
      interpatient variability, and

      economic access [151]. Such obstacles limit the effectiveness of targeted treatments
      on the patient''s health

      over an extended period, suggesting a necessity to investigate further the gaps
      in overcoming resistance,

      optimizing toxicity measures, and providing wider access to these therapies.

