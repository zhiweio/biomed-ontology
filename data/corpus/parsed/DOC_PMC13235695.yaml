      ALK

      Anaplastic lymphoma kinase (ALK) is a gene that, through the effect of receptor
      tyrosine kinase (RTK),

      typically supports tissue homeostasis and neural development by promoting cell
      proliferation and growth.

      However, in the context of lung cancer, ALK most frequently becomes oncogenic
      through genetic

      rearrangements with the echinoderm microtubule-associated protein (EML4) forming
      the EML4-ALK fusion

      gene, which activates ALK tyrosine kinase and promotes carcinogenesis through
      uncontrolled cell division

      and multiplication [76]. This is found to be responsible for approximately 4%
      of NSCLC cases, mostly in

      adenocarcinomas, and is characteristically seen in younger patients, as well
      as non-smokers [97].

      RTK inhibitors have been crucial in the treatment of ALK-positive lung cancers.
      As demonstrated in Figure 4,

      first-generation therapies, including crizotinib, showed significant efficacy,
      which was eventually limited by

      resistance mutations such as G1202R and I1171T [77]. Second-generation inhibitors,
      such as alectinib and

      brigatinib, provide improved central nervous system penetration and durability
      of response. Lorlatinib, a

      third-generation ALK inhibitor, has also been efficacious in overcoming the
      earlier-mentioned resistance

      mechanisms [78].

      ALK: anaplastic lymphoma kinase, NSCLC: non-small cell lung cancer, MET: mesenchymal-epithelial
      transition

      factor, TK: tyrosine kinase, ROS1: c-ros oncogene 1, CNS: central nervous system

      Created with BioRender

      MET

      Like ALK, the mesenchymal-epithelial transition (MET) gene also encodes an RTK,
      leading to cell growth

      and survival in a similar mechanism. In lung cancer, oncogenesis most commonly
      occurs because of a

      specific mutation in the MET gene called exon 14 skipping [79]. This can prevent
      the degradation of the MET

      tyrosine kinase receptor, which can cause uninhibited signaling and drive tumorigenesis.
      This happens in

      around 3% of patients with NSCLC, and while MET driver mutations are also associated
      with

      adenocarcinomas, they are more common in the elderly population [98]. Approved
      targeted inhibitors of

      MET tyrosine kinase include tepotinib and capmatinib, which have demonstrated
      efficacy in patients with

      MET exon 14 skip mutations, offering a tailored therapeutic approach for patients
      with NSCLC (Table 4).

      However, resistance mechanisms, including secondary mutations, continue to be
      a barrier to effective

      2026 Chitneni et al. Cureus 18(5): e108302. DOI 10.7759/cureus.108302

      12 of 27'
