  - name: '2026 Chitneni et al. Cureus 18(5): e108302. DOI 10.7759/cureus.108302 #13'
    text: 'Crizotinib is a small-molecule inhibitor of receptor tyrosine kinase (RTK)
      c-Met, ALK, and ROS1. Crizotinib

      was first approved for ROS1 in the United States in 2016. Another approved drug
      is entrectinib. Although

      crizotinib and entrectinib showed a high success rate, they also showed the
      evolution of acquired ROS1-

      resistant mutations during treatment [82]. The efficacy in patients with brain
      metastases was also limited. It

      gave intracranial responses, which were short-lasting [101].

      Repotrectinib is a newer ROS1 inhibitor, considered less vulnerable to secondary
      resistance, and has more

      CNS activity than previous drugs. Studies have shown that repotrectinib has
      long-lasting clinical activity in

      the brain and is widely used in clinical practice over crizotinib in patients
      with brain metastasis [83].

      VEGFR2

      Vascular endothelial growth factor (VEGF) is mainly associated with angiogenesis,
      and it has tyrosine kinase

      domains that help in downstream signaling. The Food and Drug Administration
      (FDA) approved

      bevacizumab as the first anti-VEGF monoclonal antibody in 2006 [102]. Ramucirumab
      is another monoclonal

      antibody blocking VEGFR2 and is widely used in treating metastatic lung cancer
      and other solid tumors in

      combination with different anticancer therapies [92].

      Moreover, other advanced studies are being conducted. Various studies have documented
      increased

      expression levels of heat shock proteins (HSPs) in cancer cells when exposed
      to different stimuli, such as

      chemotherapy, inhibition of tyrosine kinases, oxidative stress, and hyperthermia.
      BMS-690514 is another

      vital inhibitor of the VEGF receptor, acting by decreasing the expression of
      HSP40, in non-small cell lung

      cancer (NSCLC) cells [93].

      PD-L1

      PD-1 is an immunoglobulin superfamily type I transmembrane glycoprotein crucially
      expressed on activated

      T cells, as demonstrated in Figure 5. When a tumor cell faces an immune system
      attack, it has various

      methods to resist the immune system. At times, they secrete immunosuppressive
      substances, promoting

      immune cells with a suppressive nature and expressing them at the membrane surface.
      Selected inhibitors

      against specific receptors can block this immunosuppression, creating an anti-tumor
      effect [95].

