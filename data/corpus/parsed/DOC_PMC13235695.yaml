    text: 'EGFR: epidermal growth factor receptor, MOA: mechanism of action, TKI:
      tyrosine kinase inhibitor

      Created with BioRender

      Monoclonal Antibodies (mAbs) and Bispecific Antibodies

      Monoclonal antibodies, such as cetuximab and necitumumab, block ligand binding
      and subsequent

      downstream signaling pathways by targeting theextracellular domain of EGFR.
      Their use is supported by

      the frequent overexpression of EGFR observed in squamous NSCLC, providing a
      biological rationale for their

      therapeutic benefit, particularly when combined with chemotherapy or tyrosine
      kinase inhibitors (TKIs).

      These combinations may help overcome resistance mechanisms and improve treatment
      efficacy [65].

      Developing bispecific antibodies, such as amivantamab, is another promising
      treatment. Amivantamab has

      been approved for advanced NSCLC with EGFR exon 20 insertions based on the CHRYSALIS
      trial results,

      which showed an ORR of 40% and a median overall survival (OS) of 22.8 months
      as a monotherapy. It was

      also tested in combination with chemotherapy in the same study, where they found
      no negative impact of

      this drug. Since early trials showed strong response ratings, the combined therapy
      is currently being

      evaluated in the PAPILLON phase III study [66].

      Antibody-Drug Conjugates (ADCs)

      Antibody-drug conjugates (ADCs) directed toward EGFR present anew therapeutic
      avenue in NSCLC,

      especially post-resistance to TKIs, such as osimertinib. These ADCs utilize
      EGFR-targeting monoclonal

      antibodies fused to potent cytotoxic payloads to preferentially deliver chemotherapy
      to neoplastic cells with

      a dose-sparing effect on normal tissues [67].

      Patritumab deruxtecan targets HER3, and studies have shown that it is effective
      in patients post-osimertinib

      failure; a phase II trial determined an ORR of 40%, and now it is being investigated
      for its future potential in

      combination with osimertinib to overcome resistance [68].

      EGFR Pathway Inhibitors

      Resistance mechanisms often activate downstream pathways, such as PI3K/AKT/mTOR
      and

      RAS/RAF/MEK/ERK, explicitly affecting the effectiveness of osimertinib on EGFR
      signaling blocking.

      Inhibitors targeting these downstream pathways have been developed to overcome
      resistance [69].

      2026 Chitneni et al. Cureus 18(5): e108302. DOI 10.7759/cureus.108302

      9 of 27'
