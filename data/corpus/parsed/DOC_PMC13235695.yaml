  - name: 18 of 27 / Future advancements and emerging therapies
    text: 'frequency of the EML4-ALK rearrangement, and MYC amplification are potential
      causes of primary

      resistance to ALK TKIs. Primary resistance is observed in 5%-7% of patients
      after crizotinib, 9% of patients

      after ceritinib, and 25% of patients after lorlatinib use [134].

      ROS1

      Resistance mechanisms to ROS1 inhibitors mirror those of ALK inhibitors. Point
      mutations within the ROS1

      kinase domain, like the G2032R solvent front mutation, cause steric interference
      to TKI binding, rendering

      crizotinib, entrectinib, and lorlatinib ineffective [135]. Other point mutations
      have also been identified, with

      later-generation ROS1 inhibitors showing activity against most of them. Hence,
      repotrectinib may be

      preferable as first-line therapy [136]. However, ROS1 L2086F is known to resist
      repotrectinib and similar

      agents. Resistance can also arise through bypass signaling involving KRAS, NRAS,
      and MAP2K1 mutations,

      MET amplification, NF1 loss, and EGFR activation [137].

      HER2

      Poor outcomes with pan-HER TKIs, potentially due to HER2 amplification, prompted
      the development of

      HER2 selective inhibitors [138]. However, resistance to them may develop through
      bypass activations of

      EGFR and MET. While antibody-drug conjugates (ADCs) show promise in HER2-mutant
      NSCLC, diverse and

      complex resistance mechanisms exist. These include structural transformation
      and reduction in the number

      of HER2 receptors, decreased internalization of HER2, increased lysosomal pH,
      diminished activity of

      lysosomal enzymes, and changes in proteins involved in signaling pathways [88].

      BRAF

      Resistance in BRAF V600E-mutant NSCLC has been shown to arise due to BRAF splice
      variants (e.g., p61-

      BRAF V600E) that facilitate dimerization, bypassing the need for upstream activation
      [139]. Secondary

      mutations in KRAS (KRASG12D upon dabrafenib treatment) and NRAS (NRASQ61K after
      dual BRAF/MEK

      inhibition), upregulation of EGFR, and MEK activation are frequently observed
      in post-treatment BRAF-

      mutant NSCLC [99]. Activation of the MAPK pathway by MAP3K8 or COT and the PI3K/AKT
      pathway via RTK

      overexpression, PTEN loss, or mutations in PI3KC and AKT promotes resistance.
      Cell cycle aberrations, such

      as amplification of CCND1 and cyclin-dependent kinase 4 (CDK4) and loss of function
      of CDKN2A, may also

      play a role in resistance to RAF inhibitors [139].

      MET

      Resistance to MET TKIs, used in MET exon 14, altered NSCLC, and MET-amplified,
      EGFR-mutated NSCLC

      may be due to mutations in the kinase domain. D1228 and Y1230, as well as L1195
      and F1200, have been

      commonly reported to provide resistance to type 1 and 2 TKIs [140]. This may
      be overcome by switching

      between type 1 and 2 TKIs. HGF upregulation and binding to the intact ligand
      binding domain increase MET

      activation and diminish the binding of type 2 TKIs. Thus, a combination with
      antibodies against HGF or

      against the ligand may be helpful in such cases [141]. Resistance often correlates
      with MET amplification,

      alternative EGFR pathways, and KRAS mutations [142].

      Liquid Biopsies

      Liquid biopsies analyze circulating tumor DNA (ctDNA), exomes, and circulating
      tumor cells (CTCs) from a

      blood sample. Liquid biopsies have several key applications in lung cancer treatment
      and management,

      including early detection, treatment selection, monitoring response, and minimal
      residual disease (MRD)

      detection (Figure 7).

