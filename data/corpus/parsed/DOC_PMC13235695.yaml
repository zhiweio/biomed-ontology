      and KRAS genes, FDA: US Food and Drug Administration, phase I/II/III: stages
      of clinical trials evaluating safety and efficacy, CD8+ T cells: cytotoxic T
      lymphocytes, MHC: major histocompatibility complex

      Anaplastic lymphoma kinase (ALK) is a gene that, through the effect of receptor
      tyrosine kinase (RTK), typically supports tissue homeostasis and neural development
      by promoting cell proliferation and growth. However, in the context of lung
      cancer, ALK most frequently becomes oncogenic through genetic rearrangements
      with the echinoderm microtubule-associated protein (EML4) forming the EML4-ALK
      fusion gene, which activates ALK tyrosine kinase and promotes carcinogenesis
      through uncontrolled cell division and multiplication [76]. This is found to
      be responsible for approximately 4% of NSCLC cases, mostly in adenocarcinomas,
      and is characteristically seen in younger patients, as well as non-smokers [97].

      RTK inhibitors have been crucial in the treatment of ALK-positive lung cancers.
      As demonstrated in Figure 4 , first-generation therapies, including crizotinib,
      showed significant efficacy, which was eventually limited by resistance mutations
      such as G1202R and I1171T [77]. Second-generation inhibitors, such as alectinib
      and brigatinib, provide improved central nervous system penetration and durability
      of response. Lorlatinib, a third-generation ALK inhibitor, has also been efficacious
      in overcoming the earlier-mentioned resistance mechanisms [78].

      ALK: anaplastic lymphoma kinase, NSCLC: non-small cell lung cancer, MET: mesenchymal-epithelial
      transition factor, TK: tyrosine kinase, ROS1: c-ros oncogene 1, CNS: central
      nervous system

      Created with BioRender

      Like ALK, the mesenchymal-epithelial transition (MET) gene also encodes an RTK,
      leading to cell growth and survival in a similar mechanism. In lung cancer,
      oncogenesis most commonly occurs because of a specific mutation in the MET gene
      called exon 14 skipping [79]. This can prevent the degradation of the MET tyrosine
      kinase receptor, which can cause uninhibited signaling and drive tumorigenesis.
      This happens in around 3% of patients with NSCLC, and while MET driver mutations
      are also associated with adenocarcinomas, they are more common in the elderly
      population [98]. Approved targeted inhibitors of MET tyrosine kinase include
      tepotinib and capmatinib, which have demonstrated efficacy in patients with
      MET exon 14 skip mutations, offering a tailored therapeutic approach for patients
      with NSCLC (Table 4 ). However, resistance mechanisms, including secondary mutations,
      continue to be a barrier to effective targeted treatment, and research is currently
      being undertaken into combination therapies and nextgeneration agents, such
      as savolitinib, to overcome this limitation [80].'
    page: 12
  - name: FGFR
    text: 'Fibroblast growth factor receptors (FGFRs) are another class of RTKs known
      to precipitate about 3% of NSCLC cases when specific alterations in the FGFR
      gene, such as amplification or formation of fusion genes, occur [90]. Although
      there are no treatments currently licensed specifically for lung cancers that
      target FGFR, this is currently being studied extensively, and existing treatments
      in this class, such as pemigatinib (presently approved therapy for advanced
      cholangiocarcinoma), are being trialed as therapeutic options in advanced NSCLC
      with FGFR2 mutations [91].

      This mutation in the BRAF proto-oncogene plays a cardinal role in controlling
      and signaling cell growth in typical cases. In the presence of a mutation such
      as BRAF V600E, where the amino acid valine is substituted by glutamic acid at
      amino acid location 600 in the BRAF gene, this causes erratic and uninhibited
      cell division and leads to the onset of various types of cancers, including
      malignant melanoma, NSCLC, papillary thyroid carcinoma, and colorectal cancer
      [99]. Around 2% of NSCLCs have a BRAF mutation, most of which are of the V600E
      variant. This specific mutation is most frequently found in the elderly population
      and those with a history of heavy smoking [99]. There is currently a combination
      treatment that uses a BRAF inhibitor along with a MEK inhibitor (to potentially
      prevent bypassing mechanism of tumor resistance to a sole BRAF inhibitor) approved
      by the FDA in the management of advanced NSCLC, containing dabrafenib (targets
      BRAF) and trametinib (MEK) (Table 4 ) [94].

      Human epidermal growth factor receptor 2 (HER2) is an RTK protein encoded by
      the ERBB2 gene and is usually responsible for tissue repair and growth. However,
      specific genetic alterations characteristically drive oncogenesis in malignancies
      affecting the breast, ovaries, and lungs, usually through their overexpression
      and amplification. This leads to HER2 receptors binding together and forming
      dimers, which signals cell proliferation''s acceleration and malignant transformation
      [87]. In the case of lung cancers, HER2 mutations lead to nearly 2% of cases
      and tend to more commonly cause adenocarcinoma NSCLCs and are found mainly in
      older female patients who have never smoked in usual instances [100]. Trastuzumab
      deruxtecan is a targeted therapy with notable efficacy and is FDA-approved for
      managing advanced NSCLCs driven by HER2-specific mutations [88]. Two orally
      active pharmaceuticals, poziotinib and zongertinib, are currently being evaluated
      in clinical trials for their efficacy in targeting a specific HER2 mutation
      called an exon 20 insertion [89].

      The KRAS oncogene belongs to the RAS family. KRAS gene mutations are seen in
      about 15%-25% of adenocarcinoma cases. Among patients with locally advanced
      or metastatic NSCLC, sotorasib was the initial FDA-approved targeted treatment
      against this mutation. They were also associated with the KRAS G12C mutation.
      DT2216 (a PROTAC) and sotorasib were given jointly for better results. It was
      evaluated only in preclinical studies, not in human clinical trials. Specifically,
      the researchers tested this combination in animal xenograft models to assess
      its antitumor activity. No patient-based clinical trial data were reported.
      Also, it showed an outstanding improvement in sotorasib''s antitumor effectiveness
      [6].

      Furthermore, adagrasib and afatinib prevented the development of cancers with
      KRAS mutations; however, it was noted that afatinib encountered the KRAS G12C
      inhibitor''s versatile resistance. This was later discovered to be overcome
      by SHP2 inhibitors (TNO155), and in combination with sotorasib, trials found
      that the results had demonstrated improved tumor growth inhibition. However,
      the presence of add-on mutations and bypass track pathways is a challenge affecting
      the success of different treatments. Comutations with genetic alterations, acquired
      resistance, alterations in the signaling pathways of KRAS, and secondary KRAS
      mutations were a few reasons that led to the evolution of resistance to the
      KRAS (G12C) blocking agents.

      Future studies should focus on evolving multifaceted therapy options, including
      immune checkpoint inhibitors, inhibitors of tyrosine kinase, KRAS upstream inhibitors,
      and multi-kinase inhibitors against comutations, for a good future outcome [85].

      The ROS1 gene, a tyrosine kinase receptor, plays a vital role in activating
      various signaling pathways. ROS1 rearrangement is rare and is only present in
      0.9%-2.6% of NSCLC cases [81].'
    page: 13
  - name: VEGFR2
    text: 'Crizotinib is a small-molecule inhibitor of receptor tyrosine kinase (RTK)
      c-Met, ALK, and ROS1. Crizotinib was first approved for ROS1 in the United States
      in 2016. Another approved drug is entrectinib. Although crizotinib and entrectinib
      showed a high success rate, they also showed the evolution of acquired ROS1resistant
      mutations during treatment [82]. The efficacy in patients with brain metastases
      was also limited. It gave intracranial responses, which were short-lasting [101].

      Repotrectinib is a newer ROS1 inhibitor, considered less vulnerable to secondary
      resistance, and has more CNS activity than previous drugs. Studies have shown
      that repotrectinib has long-lasting clinical activity in the brain and is widely
      used in clinical practice over crizotinib in patients with brain metastasis
      [83].

      Vascular endothelial growth factor (VEGF) is mainly associated with angiogenesis,
      and it has tyrosine kinase domains that help in downstream signaling. The Food
      and Drug Administration (FDA) approved bevacizumab as the first anti-VEGF monoclonal
      antibody in 2006 [102]. Ramucirumab is another monoclonal antibody blocking
      VEGFR2 and is widely used in treating metastatic lung cancer and other solid
      tumors in combination with different anticancer therapies [92].

      Moreover, other advanced studies are being conducted. Various studies have documented
      increased expression levels of heat shock proteins (HSPs) in cancer cells when
      exposed to different stimuli, such as chemotherapy, inhibition of tyrosine kinases,
      oxidative stress, and hyperthermia. BMS-690514 is another vital inhibitor of
      the VEGF receptor, acting by decreasing the expression of HSP40, in non-small
      cell lung cancer (NSCLC) cells [93].

      PD-1 is an immunoglobulin superfamily type I transmembrane glycoprotein crucially
      expressed on activated T cells, as demonstrated in Figure 5 . When a tumor cell
      faces an immune system attack, it has various methods to resist the immune system.
      At times, they secrete immunosuppressive substances, promoting immune cells
      with a suppressive nature and expressing them at the membrane surface. Selected
      inhibitors against specific receptors can block this immunosuppression, creating
      an anti-tumor effect [95].'
