  - name: '2026 Chitneni et al. Cureus 18(5): e108302. DOI 10.7759/cureus.108302 #16'
    text: 'established itself as the standard first-line treatment for advanced-stage
      EGFR-mutated NSCLC based

      on superior efficacy and favorable toxicity profile compared to earlier-generation
      TKIs [111]. While

      resistance to first- and second-generation TKIs is mostly target-dependent,
      resistance to osimertinib is

      highly heterogeneous. When osimertinib was used as second-line treatment, 10%-26%
      of cases of resistance

      were due to tertiary EGFR C797S mutation [112,113]. Moreover, in the FLAURA
      trial, when osimertinib was

      administered as a front-line treatment, the C797S mutation accounted for only
      7% of the resistance

      mechanisms, and there was no evidence of EGFR T790M [111].

      Bypass Signaling Activation

      The most frequent mechanism underlying bypass signaling activation involves
      overexpression or

      amplification of the MET proto-oncogene, encountered in 15% and 19% of patients,
      after completion of

      osimertinib therapy, when osimertinib was used as first- and second-line treatment,
      respectively [114,115].

      HER2, another tyrosine kinase receptor, activates the downstream PI3K and MAPK
      pathways, enabling

      survival signaling independent of EGFR [116]. Additional mechanisms of bypass-mediated
      resistance have

      been identified, including fusion events of established drivers of NSCLC, such
      as FGFR, BRAF, ROS1,

      REarranged during Transfection (RET), NTRK, and ALK [109,117]. Oncogenic fusions
      occur at a relatively

      higher frequency for osimertinib than earlier EGFR TKIs [118].

      Downstream Signaling Pathways

      The RAS-MAPK and PI3K pathways are the main downstream effector pathways of
      EGFR that can become

      reactivated and mediate resistance. The RAS-MAPK pathway can be reactivated
      by multiple mechanisms

      influencing each pathway point. NRAS, KRAS, and BRAF V600E mutations and gain
      of wild-type NRAS or

      KRAS have been associated with resistance to EGFR TKI in first- and subsequent-line
      therapy [119,120].

      Furthermore, within the PI3K pathway, genetic alterations in PIK3CA (E454K,
      E542K, R88Q, N345K, and

      E418K) and phosphatase and tensin homolog (PTEN) deletion may cause bypass activation
      of the PI3K

      pathway. Mutations of PIK3CA, which codes for the catalytic subunit p100α protein,
      frequently coexist with

      other oncogenic driver mutations, contrary to the mutual exclusivity of most
      oncogenic driver mutations

      [121].

      Cell cycle aberrations encompassing alterations in genes encoding cyclin D1,
      cyclin D2, cyclin E1, cyclin-

      dependent kinase (CDK) 4, and CDK6, and a frameshift deletion in the gene encoding
      the CDK inhibitor 2A

      may also play a role in acquiring resistance to osimertinib [115].

      Phenotypic Transformation

      NSCLC cells can transition into SCLC, characterized by RB1 and TP53 inactivation,
      which renders EGFR TKIs

      ineffective [122,123]. Epithelial-to-mesenchymal transition (EMT) has been noted
      in patients with NSCLC

      with acquired resistance to gefitinib or osimertinib. EMT enhances migration,
      invasion, and drug resistance,

      often driven by TGF-β signaling that activates SMAD2 [124]. Increased NOTCH-1
      signaling has been linked

      to this transformation [125]. In patients with EMT, transcriptional regulators
      such as Zeb1, Snail, and

      TWIST1 can be potential targets for future therapies [126,127].

      ALK

      As with early-generation EGFR TKIs, acquired resistance to the first-generation
      ALK TKI, crizotinib,

      typically emerged within a year of starting treatment. ALK-dependent resistance
      occurs through several

      somatic kinase domain mutations (187), including point mutations L1196M, C1156Y,
      L1152R, 1151Tins,

      G1202R, and S1206Y, and ALK gene copy number gain [128]. Bypass tracks such
      as EGFR, KRAS, and KIT also

      confer off-target resistance [129].

      For second-generation ALK TKIs, ceritinib, alectinib, and brigatinib, ALK resistance
      mutations account for

      over half of patients developing resistance. While the frequency and spectrum
      of these resistance mutations

      depend on the specific ALK inhibitor used [130], G1202R is the most frequent
      mutation that drives

      resistance to second-generation ALK TKIs. Patients receiving sequential ALK
      inhibitor therapy may develop

      compound mutations. Some important ALK resistance mutations seen are F1174C/L,
      C1156Y, and G1123S

      with ceritinib; I1171T/N/S, L1196M, and G1269S with alectinib; and G1206C, E1210K+S1206C,
      and

      E1210K+D1203N with brigatinib [131]. MEK, SRC, KIT, IGF-1 R, and EGFR activation
      can also trigger

      downstream and bypass signaling independent of ALK in cases treated with ceritinib.

      The third-generation ALK TKI, lorlatinib, is active against most secondary ALK
      mutations; however, a

      diverse array of compound ALK mutations, L1196M/D1203N, F1174L/G1202R, and C1156Y/G1269A,
      may

      confer resistance in more than one-third of the cases [132]. In keeping with
      lorlatinib''s efficacy against wild-

      type ALK and the sequential development of compound mutations, first-line treatment
      with lorlatinib could

      prevent on-target resistance [133]. Moreover, BIM 11 with missing polymorphisms,
      the low minimum allele

