      Monoclonal antibodies, such as cetuximab and necitumumab, block ligand binding
      and subsequent downstream signaling pathways by targeting the extracellular
      domain of EGFR. Their use is supported by the frequent overexpression of EGFR
      observed in squamous NSCLC, providing a biological rationale for their therapeutic
      benefit, particularly when combined with chemotherapy or tyrosine kinase inhibitors
      (TKIs). These combinations may help overcome resistance mechanisms and improve
      treatment efficacy [65].'
    page: 8
  - name: 'EGFR Pathway Inhibitors / FIGURE 3: Composite figure with four sections:
      (A) common EGFR mutations causing lung cancer, (B) MOA of first- and second-generation
      EGFR TKIs, (C) MOA of third- and fourth-generation EGFR TKIs, and (D) other
      therapies targeting EGFR'
    text: 'FIGURE 3: Composite figure with four sections: (A) common EGFR mutations
      causing lung cancer, (B) MOA of first- and second-generation EGFR TKIs, (C)
      MOA of third- and fourth-generation EGFR TKIs, and (D) other therapies targeting
      EGFR

      Developing bispecific antibodies, such as amivantamab, is another promising
      treatment. Amivantamab has been approved for advanced NSCLC with EGFR exon 20
      insertions based on the CHRYSALIS trial results, which showed an ORR of 40%
      and a median overall survival (OS) of 22.8 months as a monotherapy. It was also
      tested in combination with chemotherapy in the same study, where they found
      no negative impact of this drug. Since early trials showed strong response ratings,
      the combined therapy is currently being evaluated in the PAPILLON phase III
      study [66].

      Antibody-drug conjugates (ADCs) directed toward EGFR present a new therapeutic
      avenue in NSCLC, especially post-resistance to TKIs, such as osimertinib. These
      ADCs utilize EGFR-targeting monoclonal antibodies fused to potent cytotoxic
      payloads to preferentially deliver chemotherapy to neoplastic cells with a dose-sparing
      effect on normal tissues [67].

      Patritumab deruxtecan targets HER3, and studies have shown that it is effective
      in patients post-osimertinib failure; a phase II trial determined an ORR of
      40%, and now it is being investigated for its future potential in combination
      with osimertinib to overcome resistance [68].

      Resistance mechanisms often activate downstream pathways, such as PI3K/AKT/mTOR
      and RAS/RAF/MEK/ERK, explicitly affecting the effectiveness of osimertinib on
      EGFR signaling blocking. Inhibitors targeting these downstream pathways have
      been developed to overcome resistance [69].'
    page: 9
  - name: Combination Therapies / Driver alterations in all other mutations
    text: 'PI3K inhibitors targeting PI3K/AKY/mTOR pathways (alpelisib) prevent lung
      cancer tumor cells from using alternative growth signals when EGFR TKIs fail,
      which is particularly effective in NSCLC. Alpelisib works better when combined
      with an EGFR inhibitor since it has limited success as monotherapy [70]. MEK
      inhibitor targeting the RAS/RAF/MEK/ERK pathway blocks key regulators in the
      MAPK/ERK signaling cascade: MEK1/2. Trametinib prevents ERK activation and blocks
      tumor growth, whereas cobimetinib blocks tumor proliferation [71].

      Combination therapies targeting EGFR with either VEGF or MET inhibitors have
      become increasingly popular in their ability to overcome resistance to EGFR
      TKIs in patients with non-small cell lung cancer (NSCLC). These therapies are
      thought to synergize for tumor suppression by targeting both tumorigenic EGFR-dependent
      signaling and alternative resistance mechanisms (VEGF and MET) [72].

      Osimertinib + bevacizumab is one of the most studied EGFR + VEGF inhibitor combinations.
      However, its benefits remain inconclusive. A meta-analysis showed that bevacizumab
      plus osimertinib had a smaller progression-free survival (PFS), OS, and ORR
      in advanced EGFR mutant NSCLC. However, it resulted in a higher yet manageable
      occurrence of specific adverse events, including hypertension, nausea, proteinuria,
      and oral mucositis [73].

      On the other hand, erlotinib, a first-generation EGFR TKI, plus bevacizumab
      as a combined therapy for treatment-naïve patients with NSCLC, has superior
      PFS compared to erlotinib alone, according to various studies (JO25567, NEJ026,
      and ARTEMIS). However, there is no evidence of overall survival improvement
      [74].

      RELAY, a phase III trial, studied another VEGF inhibitor-based therapy: erlotinib
      + ramucirumab. This combination also showed a PFS improvement from 12.4 months
      with erlotinib alone to 19.4 months after using both drugs [74].

      EGFR + MET inhibitor combinations are also gaining attention. The TATTON study
      evaluated the safety and efficacy of osimertinib plus savolitinib, a MET inhibitor,
      aiming to overcome MET-driven resistance mechanisms. The results show that patients
      with MET-amplified, EGFR-mutant NSCLC showed ORRs from 33% to 67% and a PFS
      between 5.5 and 11.1 months [75].

      However, in both of these combined therapies, toxicity management is a critical
      challenge, as they increase the risk of hypertension, liver toxicity, and bleeding
      complications.

      Table 4 lists non-EGFR driver alterations commonly targeted in lung cancer management.'
