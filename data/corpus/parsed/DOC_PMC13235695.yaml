    text: 'targeted treatment, and research is currently being undertaken into combination
      therapies and next-

      generation agents, such as savolitinib, to overcome this limitation [80].

      FGFR

      Fibroblast growth factor receptors (FGFRs) are another class of RTKs known to
      precipitate about 3% of

      NSCLC cases when specific alterations in the FGFR gene, such as amplification
      or formation of fusion genes,

      occur [90]. Although there are no treatments currently licensed specifically
      for lung cancers that target

      FGFR, this is currently being studied extensively, and existing treatments in
      this class, such as

      pemigatinib (presently approved therapy for advanced cholangiocarcinoma), are
      being trialed as therapeutic

      options in advanced NSCLC with FGFR2 mutations [91].

      BRAF V600E

      This mutation in the BRAF proto-oncogene plays a cardinal role in controlling
      and signaling cell growth in

      typical cases. In the presence of a mutation such as BRAF V600E, where the amino
      acid valine is substituted

      by glutamic acid at amino acid location 600 in the BRAF gene, this causes erratic
      and uninhibited cell

      division and leads to the onset of various types of cancers, including malignant
      melanoma, NSCLC, papillary

      thyroid carcinoma, and colorectal cancer [99]. Around 2% of NSCLCs have a BRAF
      mutation, most of which

      are of the V600E variant. This specific mutation is most frequently found in
      the elderly population and those

      with a history of heavy smoking [99]. There is currently a combination treatment
      that uses a BRAF inhibitor

      along with a MEK inhibitor (to potentially prevent bypassing mechanism of tumor
      resistance to a sole BRAF

      inhibitor) approved by the FDA in the management of advanced NSCLC, containing
      dabrafenib (targets

      BRAF) and trametinib (MEK) (Table 4) [94].

      HER2

      Human epidermal growth factor receptor 2 (HER2) is an RTK protein encoded by
      the ERBB2 gene and is

      usually responsible for tissue repair and growth. However, specific genetic
      alterations characteristically drive

      oncogenesis in malignancies affecting the breast, ovaries, and lungs, usually
      through their overexpression

      and amplification. This leads to HER2 receptors binding together and forming
      dimers, which signals cell

      proliferation''s acceleration and malignant transformation [87]. In the case
      of lung cancers, HER2 mutations

      lead to nearly 2% of cases and tend to more commonly cause adenocarcinoma NSCLCs
      and are found mainly

      in older female patients who have never smoked in usual instances [100]. Trastuzumab
      deruxtecan is a

      targeted therapy with notable efficacy and is FDA-approved for managing advanced
      NSCLCs driven by

      HER2-specific mutations [88]. Two orally active pharmaceuticals, poziotinib
      and zongertinib, are currently

      being evaluated in clinical trials for their efficacy in targeting a specific
      HER2 mutation called an exon 20

      insertion [89].

      KRAS Oncogene

      The KRAS oncogene belongs to the RAS family. KRAS gene mutations are seen in
      about 15%-25% of

      adenocarcinoma cases. Among patients with locally advanced or metastatic NSCLC,
      sotorasib was the initial

      FDA-approved targeted treatment against this mutation. They were also associated
      with the KRAS G12C

      mutation. DT2216 (a PROTAC) and sotorasib were given jointly for better results.
      It was evaluated only in

      preclinical studies, not in human clinical trials. Specifically, the researchers
      tested this combination in

      animal xenograft models to assess its antitumor activity. No patient-based clinical
      trial data were

      reported. Also, it showed an outstanding improvement in sotorasib''s antitumor
      effectiveness [6].

      Furthermore, adagrasib and afatinib prevented the development of cancers with
      KRAS mutations; however,

      it was noted that afatinib encountered the KRAS G12C inhibitor''s versatile
      resistance. This was later

      discovered to be overcome by SHP2 inhibitors (TNO155), and in combination with
      sotorasib, trials found

      that the results had demonstrated improved tumor growth inhibition. However,
      the presence of add-on

      mutations and bypass track pathways is a challenge affecting the success of
      different treatments. Co-

      mutations with genetic alterations, acquired resistance, alterations in the
      signaling pathways of KRAS, and

      secondary KRAS mutations were a few reasons that led to the evolution of resistance
      to the KRAS (G12C)

      blocking agents.

      Future studies should focus on evolving multifaceted therapy options, including
      immune checkpoint

      inhibitors, inhibitors of tyrosine kinase, KRAS upstream inhibitors, and multi-kinase
      inhibitors against co-

      mutations, for a good future outcome [85].

      ROS1

      The ROS1 gene, a tyrosine kinase receptor, plays a vital role in activating
      various signaling pathways. ROS1

      rearrangement is rare and is only present in 0.9%-2.6% of NSCLC cases [81].

