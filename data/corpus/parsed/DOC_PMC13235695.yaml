      EGFR: T790M and C797S

      Despite the efficacy of EGFR tyrosine kinase inhibitors, resistance inevitably
      develops within 12-18 months

      of treatment [110]. The T790M mutation increases the kinase affinity for ATP,
      thereby limiting the binding of

      ATP-competitive kinase inhibitors. Osimertinib, the third generation of this
      category of drugs, has

