      When discussing targeted therapies against PD-L1, pembrolizumab is a monoclonal
      antibody proven to have anti-tumor effects in progressed NSCLC. Pembrolizumab,
      when given as a single drug as a first-line treatment option, is beneficial
      for cancers with high expression of PD-L1 (≥50%) [95].

      However, the response rate was better with nivolumab plus ipilimumab among people
      with cancers that expressed PD-L1 in a later study about advanced NSCLC [96].

      DLL3 acts as an inhibitory ligand and is prevalent in small cell lung cancer
      (SCLC) treatment. As of now, the treatment methods focusing on DLL3 are different,
      including antibody-drug conjugates (ADCs), bispecific Tcell engagers (BiTEs),
      and chimeric antigen receptor (CAR) T-cell therapies. Among the three, the DLL3targeted
      BiTEs have held potential clinical interest [103].

      Tarlatamab has demonstrated advancement-free survival compared to basic care
      in a phase II trial; its biologics license application (BLA) is currently under
      FDA review. Various studies have focused on learning tarlatamab''s clinical
      efficiency [103]. Another promising development is the induction of pluripotent
      stem cell (iPSC)-derived immune cells [104].

      In the current scenario, resistance to these therapies is unavoidable. It may
      be primary (pre-existing genetic alterations prevent the tumor from having the
      initial desired response to treatment), adaptive (the initial effect of therapy
      is not sustained due to a cancer cell''s plastic counter response), and acquired
      (new mutations or cellular transformations emerge in response to therapy, causing
      failure of treatment) [105].

      Commonly identified mechanisms include bypass signaling activation, histological
      transformation, tumor microenvironment and immune evasion, and epigenetic modifications.'
