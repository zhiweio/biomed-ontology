  - name: '3 of 27 / Lung cancer: A prominent global evil / FIGURE 1: Etiologic risk
      factors for lung cancer'
    text: 'Created with BioRender

      The International Agency for Research on Cancer (IARC) has determined that a
      cigarette contains over 70

      human carcinogens. A positive and linear relationship between exposure to these
      substances and the

      development of lung cancer has been established [18,19]. The histological subtypes
      of lung cancer

      demonstrate different strengths of association in their relationship with cigarette
      smoking, with SCC and

      SCLC showing a stronger relationship, and adenocarcinoma and large cell carcinoma
      showing a weaker

      association. Exposure to secondhand smoke has also demonstrated a strong relationship
      to an increased risk

      of lung cancer, with the evidence being strongest among partners when compared
      to childhood

      exposure [20].

      Numerous studies indicate that genetic factors significantly influence lung
      cancer development, challenging

      the belief that environmental exposures are the sole cause. A notable finding
      was that smoking first-degree

      relatives of patients with lung cancer had a 2.5-fold increased risk compared
      to controls [21]. Over the past

      decade, Genome-Wide Association Studies (GWAS) have identified several genetic
      susceptibility loci linked

      to lung cancer and its subtypes across different ethnic backgrounds. Specific
      loci are notably associated with

      higher cancer risk among Asians [22-24] and Europeans [25-30], and some particularly
      for adenocarcinoma

      [31,32], emphasizing the importance of targeting genetic mutations in treatment.

      Lung cancer is one of the most common cancers, accounting for 12.4% of all new
      cancer diagnoses. It is also

      the prominent cause of cancer-related deaths, making up 18.7% of total fatalities
      from cancer. While it is the

      most diagnosed malignancy in men, it is the second most common cancer in women,
      following breast

      cancer. In 2022, there were 2.5 million newly diagnosed cases of lung cancer,
      resulting in 1.8 million

      fatalities attributed to this disease [33,34].

      According to the GLOBOCAN 2022 report, lung cancer ranked as the third most
      prevalent cancer over one

      year, comprising 9.1% of all cancer cases. Prevalence over three and five years
      showed that lung cancer is

      the fourth most prevalent cancer (only behind breast, colorectal, and prostate
      cancers), representing 7% and

      6% of total cancer cases, respectively.

      The prevalence of lung cancer varies across different world regions and is also
      different between both

      genders [33,34]. Owing to its vast population, East Asia has the highest incidence,
      mortality, and prevalence

      of lung cancer, irrespective of gender, accounting for 50.1% of total global
      cases, both in absolute numbers;

