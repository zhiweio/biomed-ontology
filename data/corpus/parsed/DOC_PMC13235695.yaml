  - name: 'EGFR: T790M and C797S / FIGURE 6: Resistance mechanisms'
    text: 'Cancer cells can circumvent targeted inhibition by activating alternative
      signaling pathways. MET or HER2 amplification KRAS mutations are well-documented
      resistance mechanisms as they activate and/or sustain downstream signaling pathways
      independent of the targeted oncogene [106].

      NSCLS cells can undergo phenotypic changes to become more resistant. Epithelial-to-mesenchymal
      transition enables tumor cells to become more invasive and resistant to apoptosis.
      NSCLC tumors treated with TKIs may evolve into small cell lung cancer, which
      is histologically distinct and more aggressive and, hence, does not respond
      to EGFR inhibitors [107].

      Inter- and intra-tumor heterogeneity is crucial in mediating resistance to targeted
      therapy  [105]. Hypoxia and fibroblast-mediated stromal interactions support
      drug resistance by promoting cell survival signals [108]. Some tumors can activate
      immune checkpoints by upregulating PD-L1 expression, leading to immune evasion
      [109].

      Epigenetic changes, such as DNA methylation, histone modifications, and non-coding
      RNA regulation, can alter gene expression and contribute to resistance [108].

      Here, we discuss the resistance mechanisms of the individual targets encountered
      with some of the main therapies mentioned above, which are also demonstrated
      in Figure 6 .

      EGFR: epidermal growth factor receptor, ALK: anaplastic lymphoma kinase, ROS1:
      c-ros oncogene 1, HER2: human epidermal growth factor receptor 2, MET: mesenchymal-epithelial
      transition factor, NF-κB: nuclear factorkappa B (NF-κB), MEK: mitogen-activated
      protein kinase kinase, ERK: extracellular signal-regulated kinase, CDK: cyclin-dependent
      kinase, EMT: epithelial-to-mesenchymal transition, SCLC: small cell lung cancer,
      RAS: rat sarcoma, JAK: Janus kinase, SRC: SRC proto-oncogene, non-receptor tyrosine
      kinase, STAT: signal transducer and activator of transcription, mTOR: mechanistic
      target of rapamycin, HGF: hepatocyte growth factor

      Created with BioRender

      Despite the efficacy of EGFR tyrosine kinase inhibitors, resistance inevitably
      develops within 12-18 months of treatment [110]. The T790M mutation increases
      the kinase affinity for ATP, thereby limiting the binding of ATP-competitive
      kinase inhibitors. Osimertinib, the third generation of this category of drugs,
      has established itself as the standard first-line treatment for advanced-stage
      EGFR-mutated NSCLC based on superior efficacy and favorable toxicity profile
      compared to earlier-generation TKIs [111]. While resistance to first- and second-generation
      TKIs is mostly target-dependent, resistance to osimertinib is highly heterogeneous.
      When osimertinib was used as second-line treatment, 10%-26% of cases of resistance
      were due to tertiary EGFR C797S mutation [112,113]. Moreover, in the FLAURA
      trial, when osimertinib was administered as a front-line treatment, the C797S
      mutation accounted for only 7% of the resistance mechanisms, and there was no
      evidence of EGFR T790M [111].'
    page: 16
  - name: 'Bypass Signaling Activation #2'
    text: 'The most frequent mechanism underlying bypass signaling activation involves
      overexpression or amplification of the MET proto-oncogene, encountered in 15%
      and 19% of patients, after completion of osimertinib therapy, when osimertinib
      was used as first- and second-line treatment, respectively [114,115]. HER2,
      another tyrosine kinase receptor, activates the downstream PI3K and MAPK pathways,
      enabling survival signaling independent of EGFR [116]. Additional mechanisms
      of bypass-mediated resistance have been identified, including fusion events
      of established drivers of NSCLC, such as FGFR, BRAF, ROS1, REarranged during
      Transfection (RET), NTRK, and ALK [109,117]. Oncogenic fusions occur at a relatively
      higher frequency for osimertinib than earlier EGFR TKIs [118].

      The RAS-MAPK and PI3K pathways are the main downstream effector pathways of
      EGFR that can become reactivated and mediate resistance. The RAS-MAPK pathway
      can be reactivated by multiple mechanisms influencing each pathway point. NRAS,
      KRAS, and BRAF V600E mutations and gain of wild-type NRAS or KRAS have been
      associated with resistance to EGFR TKI in first- and subsequent-line therapy
      [119,120].

      Furthermore, within the PI3K pathway, genetic alterations in PIK3CA (E454K,
      E542K, R88Q, N345K, and E418K) and phosphatase and tensin homolog (PTEN) deletion
      may cause bypass activation of the PI3K pathway. Mutations of PIK3CA, which
      codes for the catalytic subunit p100 α protein, frequently coexist with other
      oncogenic driver mutations, contrary to the mutual exclusivity of most oncogenic
      driver mutations [121].

      Cell cycle aberrations encompassing alterations in genes encoding cyclin D1,
      cyclin D2, cyclin E1, cyclindependent kinase (CDK) 4, and CDK6, and a frameshift
      deletion in the gene encoding the CDK inhibitor 2A may also play a role in acquiring
      resistance to osimertinib [115].

      NSCLC cells can transition into SCLC, characterized by RB1 and TP53 inactivation,
      which renders EGFR TKIs ineffective [122,123]. Epithelial-to-mesenchymal transition
      (EMT) has been noted in patients with NSCLC with acquired resistance to gefitinib
      or osimertinib. EMT enhances migration, invasion, and drug resistance, often
      driven by TGFβ signaling that activates SMAD2 [124]. Increased NOTCH-1 signaling
      has been linked to this transformation [125]. In patients with EMT, transcriptional
      regulators such as Zeb1, Snail, and TWIST1 can be potential targets for future
      therapies [126,127].

      As with early-generation EGFR TKIs, acquired resistance to the first-generation
      ALK TKI, crizotinib, typically emerged within a year of starting treatment.
      ALK-dependent resistance occurs through several somatic kinase domain mutations
      (187), including point mutations L1196M, C1156Y, L1152R, 1151Tins, G1202R, and
      S1206Y, and ALK gene copy number gain [128]. Bypass tracks such as EGFR, KRAS,
      and KIT also confer off-target resistance [129].

      For second-generation ALK TKIs, ceritinib, alectinib, and brigatinib, ALK resistance
      mutations account for over half of patients developing resistance. While the
      frequency and spectrum of these resistance mutations depend on the specific
      ALK inhibitor used [130], G1202R is the most frequent mutation that drives resistance
      to second-generation ALK TKIs. Patients receiving sequential ALK inhibitor therapy
      may develop compound mutations. Some important ALK resistance mutations seen
      are F1174C/L, C1156Y, and G1123S with ceritinib; I1171T/N/S, L1196M, and G1269S
      with alectinib; and G1206C, E1210K+S1206C, and E1210K+D1203N with brigatinib
      [131]. MEK, SRC, KIT, IGF-1 R, and EGFR activation can also trigger downstream
      and bypass signaling independent of ALK in cases treated with ceritinib.

      The third-generation ALK TKI, lorlatinib, is active against most secondary ALK
      mutations; however, a diverse array of compound ALK mutations, L1196M/D1203N,
      F1174L/G1202R, and C1156Y/G1269A, may confer resistance in more than one-third
      of the cases [132]. In keeping with lorlatinib''s efficacy against wildtype
      ALK and the sequential development of compound mutations, first-line treatment
      with lorlatinib could prevent on-target resistance [133]. Moreover, BIM 11 with
      missing polymorphisms, the low minimum allele frequency of the EML4-ALK rearrangement,
      and MYC amplification are potential causes of primary resistance to ALK TKIs.
      Primary resistance is observed in 5%-7% of patients after crizotinib, 9% of
      patients after ceritinib, and 25% of patients after lorlatinib use [134].'
    page: 17
  - name: 'ROS1 #2 / Future advancements and emerging therapies'
    text: 'Resistance mechanisms to ROS1 inhibitors mirror those of ALK inhibitors.
      Point mutations within the ROS1 kinase domain, like the G2032R solvent front
      mutation, cause steric interference to TKI binding, rendering crizotinib, entrectinib,
      and lorlatinib ineffective [135]. Other point mutations have also been identified,
      with later-generation ROS1 inhibitors showing activity against most of them.
      Hence, repotrectinib may be preferable as first-line therapy [136]. However,
      ROS1 L2086F is known to resist repotrectinib and similar agents. Resistance
      can also arise through bypass signaling involving KRAS, NRAS, and MAP2K1 mutations,
      MET amplification, NF1 loss, and EGFR activation [137].

      HER2

      Poor outcomes with pan-HER TKIs, potentially due to HER2 amplification, prompted
      the development of HER2 selective inhibitors [138]. However, resistance to them
      may develop through bypass activations of EGFR and MET. While antibody-drug
      conjugates (ADCs) show promise in HER2-mutant NSCLC, diverse and complex resistance
      mechanisms exist. These include structural transformation and reduction in the
      number of HER2 receptors, decreased internalization of HER2, increased lysosomal
      pH, diminished activity of lysosomal enzymes, and changes in proteins involved
      in signaling pathways [88].

      BRAF

      Resistance in BRAF V600E-mutant NSCLC has been shown to arise due to BRAF splice
      variants (e.g., p61BRAF V600E) that facilitate dimerization, bypassing the need
      for upstream activation [139]. Secondary mutations in KRAS (KRASG12D upon dabrafenib
      treatment) and NRAS (NRASQ61K after dual BRAF/MEK inhibition), upregulation
      of EGFR, and MEK activation are frequently observed in post-treatment BRAFmutant
      NSCLC [99]. Activation of the MAPK pathway by MAP3K8 or COT and the PI3K/AKT
      pathway via RTK overexpression, PTEN loss, or mutations in PI3KC and AKT promotes
      resistance. Cell cycle aberrations, such as amplification of CCND1 and cyclin-dependent
      kinase 4 (CDK4) and loss of function of CDKN2A, may also play a role in resistance
      to RAF inhibitors [139].

      MET

      Resistance to MET TKIs, used in MET exon 14, altered NSCLC, and MET-amplified,
      EGFR-mutated NSCLC may be due to mutations in the kinase domain. D1228 and Y1230,
      as well as L1195 and F1200, have been commonly reported to provide resistance
      to type 1 and 2 TKIs [140]. This may be overcome by switching between type 1
      and 2 TKIs. HGF upregulation and binding to the intact ligand binding domain
      increase MET activation and diminish the binding of type 2 TKIs. Thus, a combination
      with antibodies against HGF or against the ligand may be helpful in such cases
      [141]. Resistance often correlates with MET amplification, alternative EGFR
      pathways, and KRAS mutations [142].

      Liquid Biopsies

      Liquid biopsies analyze circulating tumor DNA (ctDNA), exomes, and circulating
      tumor cells (CTCs) from a blood sample. Liquid biopsies have several key applications
      in lung cancer treatment and management, including early detection, treatment
      selection, monitoring response, and minimal residual disease (MRD) detection
      (Figure 7 ).'
    page: 18
  - name: 'Future Advancements / FIGURE 7: Future advancements in lung cancer therapies'
    text: 'ctDNA: circulating tumor DNA, CTC: circulating tumor cell, MRD: minimal
      residual disease, TKI: tyrosine kinase inhibitor, ADC: antibody-drug conjugate,
      PROTACs: proteolysis-targeting chimeras, DUBTACs: deubiquitinasetargeting chimeras,
      LNPs: lipid nanoparticles

      Created with BioRender

      Liquid biopsies are currently used in standard NSCLC care mainly for molecular
      profiling and treatment selection, and sometimes for monitoring resistance mutations.
      However, applications such as early detection and minimal residual disease (MRD)
      detection using ctDNA remain largely investigational. In particular, ctDNA-based
      MRD detection is currently used mainly in research and clinical trials rather
      than routine clinical practice.

      In the development of non-invasive methods based on liquid biopsy analysis of
      ctDNA, in patients with cancer, a fraction of the ctDNA is tumor-derived and,
      as a result, referred to as ctDNA. As a basic principle, analysis of ctDNA has
      the major advantage of correlating with alterations specific to the tumor. A
      study by Phallen et al. (2017) laid the foundation for the commercial use of
      liquid biopsies by proving that ctDNA can detect early stages of NSCLC and ultra-sensitive
      sequencing using Targeted Error Correction Sequencing (TEC-Seq), which was used
      to detect low-frequency mutations. In a cohort of 200 patients with early-stage
      cancer and 44 healthy controls, 42 of the 200 had a confirmed diagnosis of NSCLC,
      and ctDNA was measured in these patients. NSCLC-specific data showed 59% detection
      in early-stage lung cancer, along with 100% specificity in healthy controls.
      The method was successful even in tumors less than 1 cm. On the other hand,
      high-depth sequencing remains expensive for routine use [143].

      In a diagnostic accuracy study with a cohort of 100 patients with NSCLC, tissue
      and plasma samples were used to demonstrate that ctDNA can reliably detect cancer-associated
      mutations in blood samples, matching tissue biopsy results with 90% concordance
      in the specific case of NSCLC. EGFR exon 19 deletions or L858R mutations were
      detected with a sensitivity of 70%-90% that varied by stage, with minimal false
      positives indicating close to 100% specificity. The study distinguished liquid
      biopsies as a clinically valid tool for initial EGFR testing and real-time resistance
      monitoring. However, it showed lower sensitivity in early-stage NSCLC, specifically
      stages I-II [144].'
    page: 19
  - name: Epigenetic Drugs / Limitations and challenges
    text: 'Liquid biopsies can detect rare mutations such as MET exon 14 skipping
      and RET fusions. Pre-treatment ctDNA levels have been used to identify low-risk
      patients who may benefit from sequential TKI treatment. ctDNA levels have been
      shown to identify patients with significantly improved survival rates posttreatment
      [145,146]. Serial detection provides insight into tumor burden, eliminating
      the need for repeating tissue biopsies. Several studies have found a significant
      association between quantitative changes in ctDNA, cancer response to the targeted
      therapy, and the prognosis of NSCLC.

      Minimal residual disease (MRD) is represented by early tumor development or
      relapse. Liquid biopsies can be used for early cancer treatments through their
      advantage of detecting micrometastatic disease and early abnormalities. A prospective
      longitudinal cohort study was conducted, where serial ctDNA detected relapse
      months earlier than imaging and predicted higher relapse risk [147].

      Liquid biopsies, specifically ctDNA, have become an indispensable tool in the
      management of EGFRmutated NSCLC, particularly for patients treated with first-
      and second-generation EGFR TKIs. In summary, they have enabled non-invasive
      detection of EGFR mutations, real-time monitoring, and early identification
      of resistance mechanisms.

      Resistance to EGFR TKIs remains a significant challenge in NSCLC; epigenetic
      therapies are emerging onto the scene as a promising strategy of resistance
      reversal and a method of drug sensitivity restoration. Epigenetic therapies
      target gene expression modifications brought by DNA methylation and histone
      acetylation. These processes contribute to cancer progression and, in the case
      of NSCLC, the development of resistance to EGFR TKIs.

      There are multiple classes of epigenetic drugs (Figure 7 ); the most prominent
      are DNA methyltransferase inhibitors (DNMTis), histone deacetylase inhibitors
      (HSACis), and EZH2 inhibitors, which target histone methylation. Going into
      more detail, DNMTIs reverse the hypermethylation of tumor suppressor genes,
      such as CDKN2A and adenomatous polyposis coli (APC), thus restoring TKI sensitivity.
      DNMTi monotherapy showed minimal clinical response in trials involving NSCLC.

      Using DNMTi as a key player in combination therapies has yielded promising results.
      A phase I/II study of combined epigenetic therapy utilizes azacitidine and entinostat,
      which are DNA methylation and histone deacetylation inhibitors. The study reflected
      that nearly half of the patient cohort achieved disease control. Tumor biopsies
      taken post-treatment concluded that tumor suppressor genes CDKN2A and APC were
      reexpressed, which was in harmony with the clinical benefit [148].

      AI and Machine Learning, Predictive Modeling, and the Use of Radiogenomics in
      Lung Cancer Screening and Aiding in Personalized Therapy

      The use of artificial intelligence and machine learning has been slowly emerging
      as a key player in revolutionizing the prediction of resistance and personalized
      therapy. It has been shown to be very beneficial in predicting resistance mechanisms
      and identifying early relapse. As a landmark paper, the study by Chabon et al.
      (2020) demonstrated a method in which circulating tumor DNA (ctDNA) profiling
      combined with machine learning can predict EGFR TKI resistance in NSCLC. The
      machine learning model predicted T790M emergence with 92% accuracy months before
      progression. It also uncovered NF1 loss and TB1 mutations as the main driving
      forces of resistance in T790M-negative tumors. The machine learning model could
      also detect MET amplification in ctDNA, which was confirmed later using tissue
      biopsies [149].

      Another study leveraged the ctDNA mutation burden, fragment size, and copy number
      alterations at baseline to train a machine learning model to avoid the need
      for longitudinal sampling. Baseline ctDNA features predicted progression risk
      with higher accuracy. The main predictive values utilized by the machine learning
      model were short ctDNA fragments, TP53 co-mutations, and high EGFR VAF. This
      study reflected how machine learning predictions can assist in guiding decisions
      regarding treatment [150].

      Limitations of Targeted Therapies in Lung Cancer

      The advent of targeted therapies has dramatically changed the prognosis for
      patients with actionable mutations in non-small cell lung cancer (NSCLC) by
      improving survival rates. These therapies, however valuable, do have some significant
      obstacles, including drug resistance, toxicity, interpatient variability, and
      economic access [151]. Such obstacles limit the effectiveness of targeted treatments
      on the patient''s health over an extended period, suggesting a necessity to
      investigate further the gaps in overcoming resistance, optimizing toxicity measures,
      and providing wider access to these therapies.

      Resistance Mechanisms Therapeutic resistance develops after an initial response
      to a targeted therapy, almost invariably resulting in disease progression. Resistance
      can be primary (intrinsic) when the tumor never responds to treatment from the
      start despite harboring a targetable mutation [152]. This is commonly attributed
      to the genetic heterogeneity of the tumors, where different subpopulations of
      cancer cells within the same individual have different genetic profiles and
      treatment sensitivity [153]. A case in point is our understanding of EGFR mutations
      and their response to therapy, such as reservoir host responses, which exhibit
      weak responses toward EGFR tyrosine kinase inhibitors (TKIs) due to exon 20
      insertions, making them ineffective as firstline treatment options [8]. Acquired
      resistance is observed in patients who initially respond to targeted therapy,
      developing over time through multiple means.'
    page: 20
  - name: Financial and Accessibility Barriers / Additional Information / Author Contributions
    text: 'Compared to traditional chemotherapy, targeted therapies are more selective;
      however, they can still produce adverse side effects that can decrease adherence
      to treatment and the patient''s quality of life. An example of these adverse
      effects, known as on-target effects, occurs when the blockade of a specific
      molecular pathway negatively impacts tissues other than those intended. An acneiform
      skin rash is commonly caused by EGFR inhibitors, such as erlotinib and osimertinib,
      due to the blockage of EGFR signaling, which is essential for epidermal homeostasis
      [153]. Visual complications and peripheral neuropathy are also seen in patients
      treated with ALK inhibitors crizotinib and lorlatinib due to unintended effects
      on the peripheral nervous system [152]. Osimertinib, a third-generation EGFR
      TKI, has also been reported to cause cardiotoxic effects, including QT prolongation
      and reduced left ventricular ejection fraction, which is suggested to happen
      by mis-targeted blockade of HER2 in cardiac muscle [8].

      Unlike the previously mentioned type of toxicity, immune-oncology treatments
      bear a unique type of toxicity known as immune-related adverse events (irAEs),
      which stems from too much activation of the immune system against the body.
      These toxicities are not restricted to a specific organ and include organspecific
      allergic pneumonitis, which can affect around 5% of patients receiving PD-1/PD-L1
      inhibitors and can be fatal if left untreated [154].

      One of the most significant barriers to the widespread implementation of targeted
      therapies is their high cost, particularly in low- and middle-income countries
      [154]. Many targeted agents are priced at over $100,000 annually, making them
      inaccessible to a substantial portion of the global population. Even in high-income
      countries, insurance restrictions and high copayments can lead to financial
      toxicity, forcing patients to delay or forgo treatment due to cost concerns
      [154]. Access to comprehensive biomarker testing also remains a significant
      limitation, particularly in resource-limited settings. Fewer than 50% of patients
      with lung cancer worldwide receive comprehensive genomic testing, mainly due
      to infrastructure and cost barriers [151]. This results in many patients being
      unable to receive effective targeted treatments, exacerbating global disparities
      in lung cancer care [154].

      Targeted therapy has been an increasingly studied topic that has revolutionized
      the management of advanced NSCLC over the past two decades. Regarding their
      impact on clinical outcomes, their advent has widely proven to be an adequate
      replacement for traditional chemotherapy, providing a more personalized and
      safer alternative. This has been found to prolong progression-free survival
      and improve the quality of life in patients with cancer. This review has highlighted
      significant gene alterations or driver mutations engendered in NSCLC cases,
      such as EGFR, ALK, HER2, KRAS, and VEGF.

      This review also discussed some of the licensed major pharmacological therapies
      that specifically target each mutation and, therefore, are shown to be effective
      in advanced NSCLC, which expresses their respective mutations. Despite their
      promise, however, there have been a few challenges that have been encountered
      with these therapies, such as developing acquired drug resistance by cancer
      cells, managing drug-related toxicity, and addressing financial implications
      and barriers to their obtainability. The effects of resistance are presently
      being studied in clinical trials to develop next-generation medication classes
      that overcome these resistance mechanisms and improve the treatment efficacy
      of NSCLC tumors.

      All authors have reviewed the final version to be published and agreed to be
      accountable for all aspects of the work.

