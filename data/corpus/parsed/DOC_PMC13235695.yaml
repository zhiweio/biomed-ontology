      Domenica Arias , Omar Yasin , Livia Cereser Prado de Souza , Roshan Afshan ,
      Vyapti A. Dave

      1. Medicine, MediCiti Institute of Medical Sciences, Hyderabad, IND 2. Stroke
      Medicine, University Hospital of North

      Durham, Durham, GBR 3. Internal Medicine, Northern Care Alliance NHS Foundation
      Trust, Royal Oldham Hospital,

      Oldham, GBR 4. Medicine, Rajiv Gandhi University of Health Sciences, Kottayam,
      IND 5. Medicine, Aarthi Eye Hospital,

      Karur, IND 6. Medicine, National University of Loja, Loja, ECU 7. General Surgery,
      Medway Maritime Hospital NHS

      Foundation Trust, Kent, GBR 8. Medicine, Lusíada University Center, Faculty
      of Medical Sciences of Santos, Santos,

      BRA 9. Internal Medicine, Detroit Medical Center, Detroit, USA 10. Internal
      Medicine, Gujarat Medical Education and

      Research Society Medical College Valsad, Valsad, IND

      Corresponding author: Vyapti A. Dave, vyaptidave10@gmail.com

      Lung cancer is among the leading causes of cancer-related mortality worldwide.
      It is classified into small cell

      lung cancer (SCLC) and non-small cell lung cancer (NSCLC), with NSCLC being
      more prevalent. There have

      been advancements in managing extensive research on immunotherapy agents, oncolytic
      viruses, and

      targeted therapies by understanding the genetic mutations and molecular mechanisms
      behind lung cancer.

      Targeted therapy is the new paradigm in the treatment of lung cancer, especially
      NSCLC, and the aim is to

      inhibit specific proteins involved in cancer growth and progression. They primarily
      utilize small molecule

      inhibitors, monoclonal antibodies (mAbs), and antibody-drug conjugates (ADCs)
      to attack specific

      oncogenic driver mutations such as epidermal growth factor receptor (EGFR),
      anaplastic lymphoma kinase

      (ALK), Kirsten rat sarcoma viral oncogene homolog (KRAS), c-ros oncogene 1 (ROS1),
      and immune

      checkpoint pathways. These agents have improved outcomes and have shown efficacy
      in clinical trials,

      making them a preferred option over traditional chemotherapy. However, the associated
      adverse effects of

      these agents, along with drug resistance, remain a challenge. In this review,
      we discuss targeted therapies

      for lung cancer, their efficacy, clinical trials, adverse effects, mechanisms
      of resistance, and future

      directions.

      Categories: Internal Medicine, Oncology, Pulmonology

      Keywords: braf mutation, ca lung, egfr targeted therapy, kras mutation, non-small
      cell lung carcinoma (nsclc), small

      cell lung cancer (sclc), targeted anticancer therapy

      Lung cancer remains the leading cause of cancer-related mortality globally,
      accounting for one in every five

      cancer-related deaths [1]. Due to its increasing prevalence, acquired resistance,
      today''s ageing population,

      and late-stage diagnoses, lung cancer continues to pose a serious threat to
      global health [2]. The prognosis

      for lung cancer remains relatively poor despite advancements in screening, diagnosis,
      and therapy,

      especially for individuals with advanced illness. In 2022, it was found that
      in the United States,

      approximately $3,200 was received in funding from the National Cancer Institute
      (NCI) per patient death,

      which was significantly lower than that allocated to many other malignancies,
      including brain, prostate, and

      breast cancer [3].

      Lung cancer is broadly classified into two major histological subtypes: small
      cell lung cancer (SCLC) and

      non-small cell lung cancer (NSCLC), with NSCLC accounting for approximately
      85% of cases. They are

      categorized mainly based on their molecular and histological features [4]. Considering
      these different

      histological types of lung cancer, we understand that each histological type
      has different genetic profiling

      and sensitivity to treatment. Targeted therapy based on the patient''s biological
      and genetic profile is a

      promising approach to optimize efficacy with the available agents [5].

      Advances in molecular biology have demonstrated that many lung cancers are driven
      by specific genetic

      alterations that promote uncontrolled cell proliferation and survival. These
      molecular abnormalities provide

      potential therapeutic targets. Oncogene activation or inactivation of tumor
      suppressor genes leads to

      disrupted signaling, increased cell growth, decreased inhibitory response, and
      metastasis. These oncogenes

      create vulnerability in lung cancer cells and act as therapeutic targets [6].
      This understanding has led us to

      develop targeted therapy focusing on the molecular target in the cancer cell
      or the tumor

      microenvironment. Accordingly, targeted therapies are designed to inhibit specific
      molecular abnormalities

      ("actionable mutations") that drive tumor growth in certain subsets of NSCLC.
      However, these mutations are

      present in only a limited proportion of cases; therefore, chemotherapy remains
      the mainstay of treatment

