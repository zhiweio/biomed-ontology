      figure of graphs on incidence, ASIR, and ASMR of lung cancer cases across men
      and women across the United Nations regions'
    text: 'ASIR: age-standardized incidence rate, ASMR: age-standardized mortality
      rate

      Created with BioRender

      Another example is that approximately one-third of all patients with lung cancer
      in East Asia, including

      China, Japan, and Korea, are non-smokers [47]. In East Asia, never-smokers most
      often develop

      adenocarcinoma, and 90% of these people carry oncogenic mutations such as EGFR
      and ALK [48-51]. Studies

      have shown different genetic susceptibility of Caucasians and Asians to lung
      cancer. EGFR mutation is

      predominant in East Asians (30%) compared to Caucasians (7%), particularly in
      patients with

      adenocarcinoma of the lung who are never-smokers [19,52,53]. Similarly, the
      K-Ras mutation was less

      prevalent in East Asians (10%) compared to Caucasians (18%), particularly in
      patients with adenocarcinoma

      who are smokers [53,54]. Among Polynesians, lung cancer was the most prominent
      cause of cancer-related

      mortality among native Hawaiians, and native Hawaiians also suffer worse cancer
      outcomes, irrespective of

      their smoking status, due to their genetic makeup [55].

      These ethnic variants underscore and reinforce the prominence of genetic susceptibility
      and oncogene

      mutations in the burden of lung cancer. While smoking cessation and regular
      screening play a role in

      preventing lung cancer, the role of genetic mutations in lung cancer emphasizes
      the role of personalized

      therapy targeting oncogene driver mutations in combating lung cancer worldwide.
      Targeted therapies

      inhibiting oncogenic mutated kinases are a cornerstone in managing these cases.
      In this review, we strive to

      discuss different newly evolving therapies targeted against genetic mutations
      that cause lung cancer, with

      more emphasis on therapies targeted against non-small cell lung cancer (NSCLC).

      In Table 2, Table 3, and Figure 3, we discuss all four generations of and other
      EGFR TKI treatment options for

      patients with NSCLC and activating EGFR mutations.

      2026 Chitneni et al. Cureus 18(5): e108302. DOI 10.7759/cureus.108302

