  - name: 2 of 27 / Review / Etiologic risk factors for lung cancer
    text: 'for a substantial proportion of newly diagnosed patients with NSCLC, accounting
      for approximately 40% [5].

      Receptor tyrosine kinases such as the epidermal growth factor receptor (EGFR),
      hepatocyte growth factor

      receptor (c-Met), and anaplastic lymphoma kinase (ALK) are involved in cell
      growth. They are primary

      targets for molecular targeted therapies. Currently, investigations are being
      conducted on inhibitors

      targeting other targets [7]. Other commonly activated oncogenes in lung cancer
      include c-ros oncogene

      1 (ROS1), human epidermal growth factor receptor 1/Erb-B2 receptor tyrosine
      kinase 1 (HER1/ERBB1),

      human epidermal growth factor receptor 2/Erb-B2 receptor tyrosine kinase 2 (HER2/ERBB2),
      MYC proto-

      oncogene (MYC), Kirsten rat sarcoma viral oncogene homolog (KRAS), cyclin D1
      (CCND1), cyclin-dependent

      kinase (CDK) 4, and B-cell lymphoma 2

      (BCL2).

      Targeted therapies have emerged as the cornerstone of treatment for lung cancer
      over the last two decades,

      focusing primarily on specific pathways and driver mutations, such as ROS1 fusions,
      epidermal growth factor

      receptor (EGFR) and Kirsten rat sarcoma viral oncogene homolog (KRAS) mutations,
      and anaplastic

      lymphoma kinase (ALK) rearrangements [8]. The evolution of lung cancer target
      therapies has transformed

      the management and prognosis of this once-fatal disease, starting in the early
      2000s, when the treatment

      options were limited, with the development of the first EGFR target therapy.
      The first significant milestone

      was the introduction of first-generation tyrosine kinase inhibitors (TKIs),
      which demonstrated substantial

      improvements in survival and quality of life compared to chemotherapy, such
      as gefitinib and erlotinib [9].

      Due to resistance, second-generation TKIs, including afatinib and dacomitinib,
      were developed to overcome

      these mutations. The objective response rate (ORR) of first- and second-generation
      TKIS can be up to 60%-

      70%; nonetheless, resistance is shown after 8-14 months of treatment. This motivated
      the search for third

      generations of drugs such as osimertinib and almonertinib [10]. These advances
      paved the way for specific

      inhibitors to target other actionable mutations, such as ROS1 fusions and anaplastic
      lymphoma kinase (ALK)

      rearrangements, which have significantly increased survival in these patient
      subgroups [11].

      Recently, a breakthrough in targeting mutations previously thought to be unactionable
      has been made

      possible by introducing KRAS G12C inhibitors, such as sotorasib. Similarly,
      the discovery of MET exon 14

      skipping mutations has increased the number of targeted treatment choices [12].

      This article describes the various therapies targeted against oncogenes causing
      lung cancer, resistance

      mechanisms, and possible future advancements.

      Lung cancer risk factors, as demonstrated in Figure 1, include tobacco smoking,
      genetics, air pollution [13],

      and exposure to carcinogens such as radon and asbestos [14-16], along with chronic
      lung diseases and

      infections, with tobacco smoking being the leading cause [17].

