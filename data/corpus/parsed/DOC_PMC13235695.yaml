    rows:
    - - KRAS
      - RTK
      - First-generation sotorasib, second- generation adagrasib
      - NSCLC
      - Y96D mutation at the drug binding site of KRAS causes resistance to all currently
        used KRAS inhibitors
      - TNO155, an SHP2 inhibitor used in combination with KRAS inhibitors, could
        help prevent any bypassing of signals through a few alternate pathways, and
        this is still being evaluated in clinical trials; the combination treatment
        of sotorasib with panitumumab (an EGFR TKI) was approved by the FDA earlier
        this year in the use of KRAS mutations
      - '[6,84-86]'
    - - HER2
      - RTK
      - Trastuzumab deruxtecan (antibody-drug conjugate)
      - NSCLC
      - HER2 tyrosine kinase domain mutations are known to cause reactivation of downstream
        pathways, potentially leading to tumor progression
      - A next-generation, orally administered HER2 TKI named zongertinib is currently
        being tested for its use in NSCLC (in a phase III clinical trial)
      - '[87-89]'
    - - FGFR
      - RTK
      - None currently approved for lung cancer treatment
      - NSCLC
      - Most commonly caused by gatekeeper mutations in the kinase domain of fibroblast
        growth factor receptors, FGFR inhibitors are prevented from binding with them
        to take the necessary effect
      - Pemigatinib, while already approved to be used in cholangiocarcinoma, is being
        investigated in a clinical trial (code mentioned on the left) at phase II
        to see its effectiveness in metastatic phases of NSCLC
      - '[90,91]'
    - - VEGFR2
      - Angiogenesis
      - Ramucirumab
      - NSCLC
      - Activation of other alternative pathways promoting angiogenesis, such as PDGF
        and EGFR
      - BMS-690514, a dual-target inhibitor of both HER2 and EGFR pathways, is a treatment
        option being evaluated for its use in NSCLC- C, found in phase I/IIa of clinical
        trials
      - '[92,93]'
    - - BRAF V600E
      - RTK
      - Combination therapy of dabrafenib (BRAF V600E inhibitor) + trametinib (MEK
        inhibitor), binimetinib
      - NSCLC
      - Found to cause resistance via bypass activation of the MEK pathway
      - PF-07799933, a next-generation treatment option with combined effects of BRAF
        and MEK inhibitors, is presently being evaluated in phase I of clinical trials;
        a combination of encorafenib (another BRAF signaling inhibitor) plus binimetinib
        is currently being clinically trialed in phase II for NSCLC
      - '[94]'
    - - CTLA-4 and PD- L1
      - Immune checkpoint regulators
      - 'CTLA 4: ipilimumab, IBI310 PD-1: nivolumab, pembrolizumab, PD-L1: atezolizumab,
        durvalumab'
      - NSCLC (atezolizumab has also been indicated for use in SCLC)
      - These tumors can suppress the expression of cell surface receptors (including
        major histocompatibility complexes), leading to diminished antigen presentation
        and processing as a part of an immune response
      - Combination treatment of immune checkpoint inhibitors with nivolumab and ipilimumab
        (action of both anti-CTLA-4 and anti-PD-L1 antibody function) is currently
        being studied for its effect in NSCLC (in phase II/III of clinical trials)
        as a mechanism to bypass the resistance posed by single-agent therapy and
        promote CD8+ T-cell response toward the cancerous tissues and potentially
        reducing the risk of immunosuppression; it has already been approved as a
        treatment option for malignant melanomas
      - '[95,96]'
