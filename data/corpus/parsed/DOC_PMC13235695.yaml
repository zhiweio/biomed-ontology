  - name: '16 of 27 / FIGURE 6: Resistance mechanisms'
    text: 'Bypass Signaling Activation

      Cancer cells can circumvent targeted inhibition by activating alternative signaling
      pathways. MET or HER2

      amplification KRAS mutations are well-documented resistance mechanisms as they
      activate and/or sustain

      downstream signaling pathways independent of the targeted oncogene [106].

      Histological Transformation

      NSCLS cells can undergo phenotypic changes to become more resistant. Epithelial-to-mesenchymal

      transition enables tumor cells to become more invasive and resistant to apoptosis.
      NSCLC tumors treated

      with TKIs may evolve into small cell lung cancer, which is histologically distinct
      and more aggressive and,

      hence, does not respond to EGFR inhibitors [107].

      Tumor Microenvironment and Immune Evasion

      Inter- and intra-tumor heterogeneity is crucial in mediating resistance to targeted
      therapy [105]. Hypoxia

      and fibroblast-mediated stromal interactions support drug resistance by promoting
      cell survival

      signals [108]. Some tumors can activate immune checkpoints by upregulating PD-L1
      expression, leading to

      immune evasion [109].

      Epigenetic Modifications

      Epigenetic changes, such as DNA methylation, histone modifications, and non-coding
      RNA regulation, can

      alter gene expression and contribute to resistance [108].

      Here, we discuss the resistance mechanisms of the individual targets encountered
      with some of the main

      therapies mentioned above, which are also demonstrated in Figure 6.

      EGFR: epidermal growth factor receptor, ALK: anaplastic lymphoma kinase, ROS1:
