  - name: '5 of 27 / the world and different UN regions / TABLE 1: Incidence, mortality,
      five-year prevalence, and estimated future burden of lung cancer in the world
      and different UN regions'
    text: '*ASIR: age-standardized incidence rate

      **ASMR: age-standardized mortality rate

      ***Prop. (per 100,000): Prevalence proportion is the percentage or proportion
      of the population affected by lung cancer during a period [33]

      Source: [33-35]

      Country-wise analysis shows that China has the highest number of lung cancer
      cases, which is due to China

      being the top producer and consumer of tobacco [41]. The Chinese government
      has launched a national

      strategy called Healthy China 2030 to reduce smoking prevalence to less than
      20% by implementing smoke-

      free laws [42]. Other countries with high lung cancer cases were the United
      States and Japan, with smoking

      being the predominant risk factor even in these areas [33,43]. However, compared
      to Western men, Japanese

      men had lower lung cancer mortality rates despite their high smoking rates.
      This mismatch is popularly

      referred to as the "Japanese smoking paradox." It is partly attributed to genetic
      factors that may offer

      resistance to lung cancer in the Japanese male population [44]. Considering
      the incidence based on ASIR,

      Hungary has the highest overall incidence rate, and so does the female population.
      Turkey has the highest

      ASIR among men, followed by Hungary. Other countries with high ASIR were New
      Caledonia, Serbia, and

      French Polynesia, as shown in Figure 2[33,43]. While smoking was the primary
      cause of high lung cancer

      incidence in all these countries, interestingly, the predominant risk factor
      in New Caledonia was widespread

      exposure to tremolite asbestos fibers, a type of mineral found in local soil,
      historically used in whitewashing

      buildings [45,46].

