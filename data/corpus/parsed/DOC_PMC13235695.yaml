    text: '600, EGFR: epidermal growth factor receptor, MEK: mitogen-activated protein
      kinase kinase, PDGF: platelet-derived growth factor, CTLA-4: cytotoxic T-

      lymphocyte-associated protein 4, PD-L1: programmed death-ligand 1, TKI: tyrosine
