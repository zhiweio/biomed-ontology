  - name: '19 of 27 / FIGURE 7: Future advancements in lung cancer therapies'
    text: 'ctDNA: circulating tumor DNA, CTC: circulating tumor cell, MRD: minimal
      residual disease, TKI: tyrosine kinase

      inhibitor, ADC: antibody-drug conjugate, PROTACs: proteolysis-targeting chimeras,
      DUBTACs: deubiquitinase-

      targeting chimeras, LNPs: lipid nanoparticles

      Created with BioRender

      Liquid biopsies are currently used in standard NSCLC care mainly for molecular
      profiling and treatment

      selection, and sometimes for monitoring resistance mutations. However, applications
      such as early

      detection and minimal residual disease (MRD) detection using ctDNA remain largely
      investigational. In

      particular, ctDNA-based MRD detection is currently used mainly in research and
      clinical trials rather than

      routine clinical practice.

      In the development of non-invasive methods based on liquid biopsy analysis of
      ctDNA, in patients with

      cancer, a fraction of the ctDNA is tumor-derived and, as a result, referred
      to as ctDNA. As a basic principle,

      analysis of ctDNA has the major advantage of correlating with alterations specific
      to the tumor. A study by

      Phallen et al. (2017) laid the foundation for the commercial use of liquid biopsies
      by proving that ctDNA can

      detect early stages of NSCLC and ultra-sensitive sequencing using Targeted Error
      Correction Sequencing

      (TEC-Seq), which was used to detect low-frequency mutations. In a cohort of
      200 patients with early-stage

      cancer and 44 healthy controls, 42 of the 200 had a confirmed diagnosis of NSCLC,
      and ctDNA was measured

      in these patients. NSCLC-specific data showed 59% detection in early-stage lung
      cancer, along with 100%

      specificity in healthy controls. The method was successful even in tumors less
      than 1 cm. On the other hand,

      high-depth sequencing remains expensive for routine use [143].

      In a diagnostic accuracy study with a cohort of 100 patients with NSCLC, tissue
      and plasma samples were

      used to demonstrate that ctDNA can reliably detect cancer-associated mutations
      in blood samples, matching

      tissue biopsy results with 90% concordance in the specific case of NSCLC. EGFR
      exon 19 deletions or L858R

      mutations were detected with a sensitivity of 70%-90% that varied by stage,
      with minimal false positives

      indicating close to 100% specificity. The study distinguished liquid biopsies
      as a clinically valid tool for

      initial EGFR testing and real-time resistance monitoring. However, it showed
      lower sensitivity in early-stage

      NSCLC, specifically stages I-II [144].

