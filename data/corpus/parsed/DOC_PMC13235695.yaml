  - name: 'Precision Medicine in Treating Lung Cancer: A Narrative Review on Treatments
      Targeting Oncogenic Genetic Mutations / Review / Etiologic risk factors for
      lung cancer'
    text: 'Targeted therapies have emerged as the cornerstone of treatment for lung
      cancer over the last two decades, focusing primarily on specific pathways and
      driver mutations, such as ROS1 fusions, epidermal growth factor receptor (EGFR)
      and Kirsten rat sarcoma viral oncogene homolog (KRAS) mutations, and anaplastic
      lymphoma kinase (ALK) rearrangements [8]. The evolution of lung cancer target
      therapies has transformed the management and prognosis of this once-fatal disease,
      starting in the early 2000s, when the treatment options were limited, with the
      development of the first EGFR target therapy. The first significant milestone
      was the introduction of first-generation tyrosine kinase inhibitors (TKIs),
      which demonstrated substantial improvements in survival and quality of life
      compared to chemotherapy, such as gefitinib and erlotinib [9].

      Due to resistance, second-generation TKIs, including afatinib and dacomitinib,
      were developed to overcome these mutations. The objective response rate (ORR)
      of first- and second-generation TKIS can be up to 60%70%; nonetheless, resistance
      is shown after 8-14 months of treatment. This motivated the search for third
      generations of drugs such as osimertinib and almonertinib [10]. These advances
      paved the way for specific inhibitors to target other actionable mutations,
      such as ROS1 fusions and anaplastic lymphoma kinase (ALK) rearrangements, which
      have significantly increased survival in these patient subgroups [11].

      Recently, a breakthrough in targeting mutations previously thought to be unactionable
      has been made possible by introducing KRAS G12C inhibitors, such as sotorasib.
      Similarly, the discovery of MET exon 14 skipping mutations has increased the
      number of targeted treatment choices [12].

      This article describes the various therapies targeted against oncogenes causing
      lung cancer, resistance mechanisms, and possible future advancements.

      Lung cancer risk factors, as demonstrated in Figure 1 , include tobacco smoking,
      genetics, air pollution [13], and exposure to carcinogens such as radon and
      asbestos [14-16], along with chronic lung diseases and infections, with tobacco
      smoking being the leading cause [17].'
    page: 2
  - name: 'Precision Medicine in Treating Lung Cancer: A Narrative Review on Treatments
      Targeting Oncogenic Genetic Mutations / Review / Lung cancer: A prominent global
      evil / FIGURE 1: Etiologic risk factors for lung cancer'
    text: 'FIGURE 1: Etiologic risk factors for lung cancer

      Created with BioRender

      The International Agency for Research on Cancer (IARC) has determined that a
      cigarette contains over 70 human carcinogens. A positive and linear relationship
      between exposure to these substances and the development of lung cancer has
      been established [18,19]. The histological subtypes of lung cancer demonstrate
      different strengths of association in their relationship with cigarette smoking,
      with SCC and SCLC showing a stronger relationship, and adenocarcinoma and large
      cell carcinoma showing a weaker association. Exposure to secondhand smoke has
      also demonstrated a strong relationship to an increased risk of lung cancer,
      with the evidence being strongest among partners when compared to childhood
      exposure [20].

      Numerous studies indicate that genetic factors significantly influence lung
      cancer development, challenging the belief that environmental exposures are
      the sole cause. A notable finding was that smoking first-degree relatives of
      patients with lung cancer had a 2.5-fold increased risk compared to controls
      [21]. Over the past decade, Genome-Wide Association Studies (GWAS) have identified
      several genetic susceptibility loci linked to lung cancer and its subtypes across
      different ethnic backgrounds. Specific loci are notably associated with higher
      cancer risk among Asians [22-24] and Europeans [25-30], and some particularly
      for adenocarcinoma [31,32], emphasizing the importance of targeting genetic
      mutations in treatment.

      Lung cancer is one of the most common cancers, accounting for 12.4% of all new
      cancer diagnoses. It is also the prominent cause of cancer-related deaths, making
      up 18.7% of total fatalities from cancer. While it is the most diagnosed malignancy
      in men, it is the second most common cancer in women, following breast cancer.
      In 2022, there were 2.5 million newly diagnosed cases of lung cancer, resulting
      in 1.8 million fatalities attributed to this disease [33,34].

      According to the GLOBOCAN 2022 report, lung cancer ranked as the third most
      prevalent cancer over one year, comprising 9.1% of all cancer cases. Prevalence
      over three and five years showed that lung cancer is the fourth most prevalent
      cancer (only behind breast, colorectal, and prostate cancers), representing
      7% and 6% of total cancer cases, respectively.

      The prevalence of lung cancer varies across different world regions and is also
      different between both genders [33,34]. Owing to its vast population, East Asia
      has the highest incidence, mortality, and prevalence of lung cancer, irrespective
      of gender, accounting for 50.1% of total global cases, both in absolute numbers;

      however, interpretation using age-standardized incidence rates (ASIR) suggests
      that this finding is influenced in part by the region''s large population size
      (ASIR) (Table 1 ) [33-35]. However, when we compare different regions of the
      world using ASIR, which allows us to compare different populations with varying
      distributions of age, Polynesia, a group of Pacific islands, tends to have the
      second-highest incidence of lung cancer cases in the world regions, despite
      having a lower number of absolute cases. These could be explained by factors
      such as increased smoking rates, obesity, poor dietary choices, limited healthcare,
      and potential exposure to environmental pollutants from past nuclear testing
      in some areas [36]. However, North America has the highest ASIR for lung cancer
      incidence among women, which is due to the widespread prevalence of cigarette
      smoking among North American women [37]. The current estimation is that lung
      cancer incidence rates in women are fast approaching or even surpassing those
      in men in several countries in Europe and North America due to increased smoking
      trends among women in these regions, especially among youngsters [38-40].'
    page: 3
  - name: 'Precision Medicine in Treating Lung Cancer: A Narrative Review on Treatments
      Targeting Oncogenic Genetic Mutations / Review / Lung cancer: A prominent global
      evil / TABLE 1: Incidence, mortality, five-year prevalence, and estimated future
      burden of lung cancer in the world and different UN regions'
    text: '*ASIR: age-standardized incidence rate

      **ASMR: age-standardized mortality rate

      ***Prop. (per 100,000): Prevalence proportion is the percentage or proportion
      of the population affected by lung cancer during a period [33]

      Source: [33-35]

      Country-wise analysis shows that China has the highest number of lung cancer
      cases, which is due to China being the top producer and consumer of tobacco
      [41]. The Chinese government has launched a national strategy called Healthy
      China 2030 to reduce smoking prevalence to less than 20% by implementing smokefree
      laws [42]. Other countries with high lung cancer cases were the United States
      and Japan, with smoking being the predominant risk factor even in these areas
      [33,43]. However, compared to Western men, Japanese men had lower lung cancer
      mortality rates despite their high smoking rates. This mismatch is popularly
      referred to as the "Japanese smoking paradox." It is partly attributed to genetic
      factors that may offer resistance to lung cancer in the Japanese male population
      [44]. Considering the incidence based on ASIR, Hungary has the highest overall
      incidence rate, and so does the female population. Turkey has the highest ASIR
      among men, followed by Hungary. Other countries with high ASIR were New Caledonia,
      Serbia, and French Polynesia, as shown in Figure 2 [33,43]. While smoking was
      the primary cause of high lung cancer incidence in all these countries, interestingly,
      the predominant risk factor in New Caledonia was widespread exposure to tremolite
      asbestos fibers, a type of mineral found in local soil, historically used in
      whitewashing buildings [45,46].'
    page: 5
  - name: 'Precision Medicine in Treating Lung Cancer: A Narrative Review on Treatments
      Targeting Oncogenic Genetic Mutations / Review / Targeted therapies in lung
      cancer / FIGURE 2: Composite figure of graphs on incidence, ASIR, and ASMR of
      lung cancer cases across men and women across the United Nations regions'
    text: 'FIGURE 2: Composite figure of graphs on incidence, ASIR, and ASMR of lung
      cancer cases across men and women across the United Nations regions

      ASIR: age-standardized incidence rate, ASMR: age-standardized mortality rate

      Created with BioRender

      Another example is that approximately one-third of all patients with lung cancer
      in East Asia, including China, Japan, and Korea, are non-smokers [47]. In East
      Asia, never-smokers most often develop adenocarcinoma, and 90% of these people
      carry oncogenic mutations such as EGFR and ALK [48-51]. Studies have shown different
      genetic susceptibility of Caucasians and Asians to lung cancer. EGFR mutation
      is predominant in East Asians (30%) compared to Caucasians (7%), particularly
      in patients with adenocarcinoma of the lung who are never-smokers [19,52,53].
      Similarly, the K-Ras mutation was less prevalent in East Asians (10%) compared
      to Caucasians (18%), particularly in patients with adenocarcinoma who are smokers
      [53,54]. Among Polynesians, lung cancer was the most prominent cause of cancer-related
      mortality among native Hawaiians, and native Hawaiians also suffer worse cancer
      outcomes, irrespective of their smoking status, due to their genetic makeup
      [55].

      These ethnic variants underscore and reinforce the prominence of genetic susceptibility
      and oncogene mutations in the burden of lung cancer. While smoking cessation
      and regular screening play a role in preventing lung cancer, the role of genetic
      mutations in lung cancer emphasizes the role of personalized therapy targeting
      oncogene driver mutations in combating lung cancer worldwide. Targeted therapies
      inhibiting oncogenic mutated kinases are a cornerstone in managing these cases.
      In this review, we strive to discuss different newly evolving therapies targeted
      against genetic mutations that cause lung cancer, with more emphasis on therapies
      targeted against non-small cell lung cancer (NSCLC).

      In Table 2 , Table 3 , and Figure 3 , we discuss all four generations of and
      other EGFR TKI treatment options for patients with NSCLC and activating EGFR
      mutations.'
