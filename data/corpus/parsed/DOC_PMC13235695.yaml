    - References
    rows:
    - - Erlotinib
      - First line for NSCLC with confirmed EGFR mutations (exon 19 deletions or exon
        21 L858R), second-line post-platinum therapy, third line in EGFR TKI-naïve
        patients
      - Reversible EGFR TKI blocks ATP binding and inhibits autophosphorylation and
        downstream signaling (PI3K/AKT, RAS/RAF/MEK)
      - Monotherapy or with bevacizumab
      - NCT02454933(erlotinib + durvalumab)
      - T790M mutation (50%), MET/HER2 amplification, PIK3CA mutations, EMT
      - Combination with MET inhibitors (e.g., savolitinib), liquid biopsy monitoring
      - '[56]'
    - - Gefitinib
      - Advanced metastatic NSCLC with EGFR exon 19 deletions or L858R, post-chemotherapy
        failure
      - Selective EGFR TKI inhibits downstream PI3K/AKT, MAPK/ERK signaling
      - Monotherapy
      - NCT03832114 (gefitinib + osimertinib)
      - T790M mutation, HER2/MET amplification, SCLC transformation, EMT
      - Sequential therapy with Osimertinib, immunotherapy combinations
      - '[57]'
    - - Afatinib
      - EGFR-mutant NSCLC (exon 19, 21), squamous NSCLC post-platinum chemotherapy
      - Irreversible inhibitor of EGFR, HER2, HER4; blocks downstream signaling
      - Monotherapy
      - NCT03755102 (afatinib + osimertinib)
      - T790M mutation, KRAS/MET alterations, EMT, SCLC transformation
      - Combination with anti-angiogenics (e.g., bevacizumab), next-generation irreversible
        TKIs
      - '[57]'
    - - Dacomitinib
      - EGFR-mutated NSCLC (superior PFS/OS versus gefitinib)
      - Irreversible pan-HER inhibitor (EGFR, HER2, HER4)
      - Monotherapy
      - NCT04479306 (dacomitinib + PD-1 inhibitor)
      - T790M mutation, MET amplification, higher toxicity (rash/diarrhea)
      - Lower toxicity dosing strategies, combination with MET inhibitors
      - '[58]'
