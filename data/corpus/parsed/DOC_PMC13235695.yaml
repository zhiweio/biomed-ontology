    text: 'Therapeutic resistance develops after an initial response to a targeted
      therapy, almost invariably resulting in

      disease progression. Resistance can be primary (intrinsic) when the tumor never
      responds to treatment from

      the start despite harboring a targetable mutation [152]. This is commonly attributed
      to the genetic

      heterogeneity of the tumors, where different subpopulations of cancer cells
      within the same individual have

      different genetic profiles and treatment sensitivity [153]. A case in point
      is our understanding of EGFR

      mutations and their response to therapy, such as reservoir host responses, which
      exhibit weak responses

      toward EGFR tyrosine kinase inhibitors (TKIs) due to exon 20 insertions, making
      them ineffective as first-

      line treatment options [8]. Acquired resistance is observed in patients who
      initially respond to targeted

      therapy, developing over time through multiple means.

      Adverse Side Effects

      Compared to traditional chemotherapy, targeted therapies are more selective;
      however, they can still

      produce adverse side effects that can decrease adherence to treatment and the
      patient''s quality of life. An

      example of these adverse effects, known as on-target effects, occurs when the
      blockade of a specific

      molecular pathway negatively impacts tissues other than those intended. An acneiform
      skin rash is

      commonly caused by EGFR inhibitors, such as erlotinib and osimertinib, due to
      the blockage of EGFR

      signaling, which is essential for epidermal homeostasis [153]. Visual complications
      and peripheral

      neuropathy are also seen in patients treated with ALK inhibitors crizotinib
      and lorlatinib due to unintended

      effects on the peripheral nervous system [152]. Osimertinib, a third-generation
      EGFR TKI, has also been

      reported to cause cardiotoxic effects, including QT prolongation and reduced
      left ventricular ejection

      fraction, which is suggested to happen by mis-targeted blockade of HER2 in cardiac
      muscle [8].

      Unlike the previously mentioned type of toxicity, immune-oncology treatments
      bear a unique type of

      toxicity known as immune-related adverse events (irAEs), which stems from too
      much activation of the

      immune system against the body. These toxicities are not restricted to a specific
      organ and include organ-

      specific allergic pneumonitis, which can affect around 5% of patients receiving
      PD-1/PD-L1 inhibitors and

      can be fatal if left untreated [154].

      Financial and Accessibility Barriers

      One of the most significant barriers to the widespread implementation of targeted
      therapies is their high

      cost, particularly in low- and middle-income countries [154]. Many targeted
      agents are priced at over

      $100,000 annually, making them inaccessible to a substantial portion of the
      global population. Even in

      high-income countries, insurance restrictions and high copayments can lead to
      financial toxicity, forcing

      patients to delay or forgo treatment due to cost concerns [154]. Access to comprehensive
      biomarker testing

      also remains a significant limitation, particularly in resource-limited settings.
      Fewer than 50% of patients

      with lung cancer worldwide receive comprehensive genomic testing, mainly due
      to infrastructure and cost

      barriers [151]. This results in many patients being unable to receive effective
      targeted treatments,

      exacerbating global disparities in lung cancer care [154].

      Targeted therapy has been an increasingly studied topic that has revolutionized
      the management of

      advanced NSCLC over the past two decades. Regarding their impact on clinical
      outcomes, their advent has

      widely proven to be an adequate replacement for traditional chemotherapy, providing
      a more personalized

      and safer alternative. This has been found to prolong progression-free survival
      and improve the quality of

      life in patients with cancer. This review has highlighted significant gene alterations
      or driver mutations

      engendered in NSCLC cases, such as EGFR, ALK, HER2, KRAS, and VEGF.

      This review also discussed some of the licensed major pharmacological therapies
      that specifically target

      each mutation and, therefore, are shown to be effective in advanced NSCLC, which
      expresses their

      respective mutations. Despite their promise, however, there have been a few
      challenges that have been

      encountered with these therapies, such as developing acquired drug resistance
      by cancer cells, managing

      drug-related toxicity, and addressing financial implications and barriers to
      their obtainability. The effects of

      resistance are presently being studied in clinical trials to develop next-generation
      medication classes that

      overcome these resistance mechanisms and improve the treatment efficacy of NSCLC
      tumors.

      All authors have reviewed the final version to be published and agreed to be
      accountable for all aspects of the

      work.

