      Zhang M, Wang Q, Hamid F, Wu J, Han J and Shen P (2026) Primary testicular neuroendocrine
      tumor with retroperitoneal lymph nodes metastasis: a case report. Front. Oncol.
      16:1766386. doi: 10.3389/fonc.2026.1766386

      © 2026 Zhang, Wang, Hamid, Wu, Han and Shen. This is an open-access article
