  - name: '10.3389/fonc.2026.1766386 #4 / Conclusion'
    text: 'RECIST1.1criteria,withthecompletedisappearanceofallpostop-

      erative anatomical shadows at the para-aortic site.

      Inprognosticevaluationoftesticularneuroendocrinetumor,

      theKi-67proliferativeindexandtumordifferentiationarekey

      prognostic factors (6). Studies have shown that lower Ki-67 indexes

      andbettertumordifferentiationcorrelatewithbetterprognosis

      (25).Inthiscase,thepatient’slowKi-67indexandgoodtumor

      differentiation suggest a relatively favorable prognosis. Although the

      presenceofretroperitoneallymphnodemetastasisincreasesthe

      complexityanddifﬁcultyoftreatment,combinedsurgeryand

      targetedtherapyeffectivelycontrolledthedisease.Currently,the

      patientremainsdisease-freewithnonewmetastasisordisease

      activity,suggestingapositivetreatmentoutcome.However,long-

      termfollow-upisstillrequiredtoassesspotentialrecurrenceor

      metastaticlesions.

      This case provides valuable insights into the treatment of testicular

      neuroendocrine tumor. Surgical resection played an important role in

      controlling the primary tumor, conﬁrming the diagnosis, and reducing

      tumor burden, while targeted therapy effectively controlled metastatic

      disease.Althoughthereisnostandardizedtreatmentprotocolfor

      testicular neuroendocrine tumor (26), this case suggests that individ-

      ualized treatment, particularly combining surgery with targeted drugs,

      may offer a potential therapeutic strategy for similar cases. However,

      the long-term efﬁcacy of combined surgery and surufatinib remains to

      be established, as this report is based on a single case with a relatively

      short follow-up period. As awareness of this rare cancer grows, more

      standardized and personalized treatment strategies may be developed

      to optimize outcomes and prognosis for these patients.

      ManagingmetastaticG1TNETischallenginggivenitslimited

      responsivenesstoconventionaladjuvanttreatments.Ourstudysug-

      gests that the integration of surgical debulking and adjuvant targeted

      therapywithsurufatinibprovidesaneffectivemeansofachievinga

      sustainedcompleteresponse.Whilethiscaseoffersapromising

      therapeuticstrategyforsuchraremalignancies,extendedfollow-up

      is necessary to validate the long-term clinical outcomes.

