      normalrange.Afterpreoperativeexaminationandtheexclusion

      ofsurgicalcontraindications,rightorchiectomywasperformed.

      Intraoperatively,therighttesticleshowedahard,nodularmass,

      approximately5cmindiameter,adherenttothescrotalwall.The

      testiclewasdissected,anditshowedaﬁsh-likeappearanceupon

      incision(Figure1).Thehistologicalspecimenwasthoroughly

