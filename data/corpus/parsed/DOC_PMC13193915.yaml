    text: '(5).Itsrarityandnonspeciﬁcclinicalpresentation,whichoften

      overlapswithmorecommongermcelltumors,posesigniﬁcant

      diagnosticpitfalls.Asobservedinourcaseandsupportedbya

      meta-analysisof132TNETcases,mostpatientspresentwitha

      painless mass and normal serum tumor markers (AFP, b-HCG, and

      LDH)(14).Theprimarydiagnosticchallengeliesindistinguishing

      “pure”TNETfrommetastaticNETorTNETarisingwithina

      teratoma,thelatterofwhichmayfollowadifferentclinicalcourse

      (15–17). In our patient,the integrated use ofmedical imagingand a

      speciﬁcimmunohistochemicalpanelwasnotmerelysupportivebut

      essentialfordiagnosticexclusion.Speciﬁcally,PET/CTwasinstru-

      mentalinrulingoutanextra-testicularprimaryorigin,whilethe

      negativeexpressionofgermcellandsexcord-stromalmarkers

      conﬁrmed the “pure” nature of the TNET. This multimodal diagnostic

      approachiscriticalfornavigatingthepitfallsassociatedwithsucha

      rare and poorly deﬁned entity.

      Whileradicalorchiectomyremainsthestandardforcontrolling

      the primary lesion and providing deﬁnitive staging, the management

      ofmetastaticdiseaseisfarlessstandardized.Theroleandlimitsof

      RPLND in TNET deserve careful consideration. In conventional germ

      cell tumors, thelymphatic spread follows a well-established anatom-

      icaldrainagetothepara-aorticandinteraortocavalnodes(18,19).

      However,forTNET,thetherapeuticbeneﬁtofRPLNDislessclear,

      especiallyforG1lesions.Inthiscase,althoughthemetastaticnodal

      masswasinextricablyadheredtothegreatvessels,ameticulous

      dissectionwasperformedtoclearthemetastaticterritory.

      Postoperative imaging identiﬁed no measurable macroscopic residual

      masses, consistent with a clinical R0 resection. However, this surgical

      experienceunderscoresa critical clinical uncertainty: the presence of

      severe intraoperative adhesions suggests a high risk of microscopic or

      subclinical residual disease, even when radiologically negative.

      ManagementofmetastaticTNETrequiresamultidisciplinary

      approach,withacomprehensivetreatmentstrategybeingessential

      (20).Whileradicalorchiectomy,astandardtreatment,andRPLND

      effectivelyreducethevisibletumorburdenandprovideadeﬁnitive

      pathologicalbasis,thepotentialforsubclinicalrecurrenceremainsa

      challenge.ThemanagementofmetastatictesticularNETswithgross

      residualdiseaseremainsaclinicalchallenge,andtheselectionof

      adjuvanttherapyrequirescarefulconsiderationoftumorbiology.

      Currentsystemicandlocaladjuvantoptionsincludeobservation,

      somatostatin analogs (SSAs), targeted therapies, radiotherapy, systemic

      chemotherapy. In this case, adjuvant chemotherapy and radiotherapy

      were not pursued based on a MDT consensus. Conventional cytotoxic

      chemotherapy (e.g., platinum-based regimens) is typically reserved for

      high-grade neuroendocrinecarcinomas (G3) withrapidproliferation.

      In contrast, well-differentiated G1 NETs, such as the one in our patient

      (Ki-67indexof1%),areinherentlyresistantto chemotherapydueto

      theirslowmitoticrate.Similarly,theroleofradiotherapyforgross

      residual disease in the aortocaval region is poorly deﬁned for low-grade

      NETs.ThelowproliferativeactivityofG1cellstranslatestolimited

      radiosensitivity,andtherisksofradiation-inducedmorbidityoften

      outweigh the marginal local control beneﬁts.

      The selection of surufatinib as the systemic treatment was justiﬁed

      bybothcurrentclinicalguidelinesanditsuniquepharmacological

      proﬁle(21).SurufatinibisanoralTKIthatsimultaneouslytargets

      vascularendothelialgrowthfactorreceptors(VEGFR1,2,and3),

      ﬁbroblast growthfactorreceptor1(FGFR1),andcolony-stimulating

      factor 1 receptor (CSF-1R). Unlike many other TKIs, its triple-target

      mechanism exerts potent anti-angiogenic effects while modulating the

      tumorimmunemicroenvironmentbyinhibitingtumor-associated

      macrophages.BasedontherobustevidencefromtheSANET-ep

      andSANET-pphaseIIItrials,surufatinibhasbeenofﬁciallyrecom-

      mendedasastandardsystemictherapyforG1/G2neuroendocrine

      tumors(22–24).Giventhesevereintraoperativeadhesionsandthe

      associatedriskofmicroscopicresiduals,thissystemictargetedap-

      proach offered a more comprehensive therapeutic beneﬁt compared to

      localizedmeasures.Theeffectivenessofthisstrategywasretrospec-

      tivelyvalidatedbytheachievementofasustainedCRaccordingto

