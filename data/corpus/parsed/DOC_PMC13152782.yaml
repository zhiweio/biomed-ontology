  - name: '10.3389/fonc.2026.1627170 #3 / 4 Conclusion'
    text: 'mutation. It also highlights the critical role of timely CSF NGS analysis

      in detecting actionable genetic alterations to guide precise treatment.

      Clinically, both BM and LM can mimic other neurological conditions,

      such as cerebral infarction, whichis sometimes the initial presenting

      symptom in patients with underlying malignancy.

      Notably, literature indicates that early-stage cerebral infarction

      lesions on contrast-enhanced MRI may demonstrate enhancement,

      suggestingthepotentialhemorrhageandpoorprognosis(6).In

      contrast,BMstypicallymanifestonMRIasnodularorring-

      enhancinglesions.Theseimagingfeaturesarecloselyassociated

      withthehistologicalsubtypeoftheprimarytumorandareoften

      accompaniedbyextensiveperitumoraledema(7).Acharacteristic

      radiological ﬁnding of BM is a “small lesion with extensive edema”

      (8).Giventhepatient’shistoryoflungadenocarcinomaandthe

      presenceofmultipleenhancingintracraniallesionsonMRI,BM

      was consideredmorelikelythancerebralinfarction.

      ThegoldstandardfordiagnosingLMremainsthecytological

      detection of tumor cells in CSF, with a sensitivity of 75%–90% and

      speciﬁcityapproaching100%.Importantly,thedetectionratemay

      exceed90%afterthreerepeatedlumbarpunctures(9).Emerging

      evidencealsosuggeststhatCSF-derivedcirculatingtumorDNA

      (ctDNA) analysis can reveal distinct genetic proﬁles of intracranial

      metastases.CtDNA in cerebrospinalﬂuid aidsin diseasediagnosis

      andenhancesourunderstandingofresistancemechanismsin

      patientswithCNSinvolvement(10).Consequently,wepursued

      CSFctDNAtestingforfurthertherapeuticguidance.

      Interestingly,thectDNAidentiﬁedinthiscaserevealeda

      METex14skippingmutationco-ampliﬁedwithCDK4and

      MDM2,alterationsthatweredetectedintheCSFbutnotin

      plasma.Asakeymodalityofliquidbiopsy,ctDNAplaysapivotal

      role in tumor diagnosis and management (11). In patients with CNS

      progression,plasma-basedliquidbiopsiesdetectactionablemuta-

      tionsinonlyapproximately6%ofcases,whereasCSF-derived

      ctDNAsigniﬁcantly improvesdetectionsensitivity(12).

      METmutationisakeydriverofoncogenicactivationanda

      major mechanism of resistance to epidermal growth factor receptor

      tyrosinekinaseinhibitors(EGFR-TKIs)inNSCLC(13).Common

      METalterationsincludeMETex14skippingmutationsandMET

      ampliﬁcation(14).InaChinesepopulationwithNSCLC,the

      incidenceofMETex14skippingmutationsrangesfrom0.9%to

      2.0%(15).However,METex14skippingmutationsinCNSmetas-

      tasesarelessreported(16,17).Inmousemodels,50%oftumors

      carryingtheMETex14skippingmutationsdevelopedBM.In

      contrast,BMswerecompletelyabsentinthecontrolgroup.

      In this case, the patient’s primary lung adenocarcinoma harbored

      METex14 skipping mutations. He subsequently developed intracranial

      progressionwithoutevidenceofactivepulmonarydisease.The

      mechanismofMETex14skippingmutationsinCNSmetastasesis

      complex.Wangetal.reportedthatMETex14increasedreceptor

      activityandexpressiononcellsurfaces,andprolongeddownstream

      signalingthroughimpairmentofendocyticdegradation,resultingin

      signiﬁcantly enhanced cell migration and scattering invasion capacity,

      especially BM (18). Savolitinib is a highly selective MET-TKI (19). An

      objective response rate of approximately 50% has been observed with

      ﬁrst-linesavolitinibinpatientswithNSCLCharboringMETex14

      skippingmutations(20,21).However,evidenceregardingBMin

      patientswithNSCLCharboringMETex14skippingmutationsis

      primarily conﬁned to case reports and retrospective analyses, lacking

      robustdatafromprospectivetrials.Follow-upbrainMRIrevealeda

      reductioninthepatientafter7monthsoforalsavolitinibadminis-

      tration.Yuetal.reported10patientswithNSCLCwithMETex14

      skippingmutationstreatedwithsavolitinib.Nineachievedstable

      disease(withcompleteintracranialresponseinthree)andonehad

      extracranial progression, though the LM status was not speciﬁed (20).

      Previous studies described TP53 and MDM2 as the most common

      co-occurring mutations in patients with NSCLC harboring METex14

      skipping mutations (22). MDM2 ampliﬁcation and overexpression are

      associated with resistance to chemotherapy and TKIs, as well as rapid

      diseaseprogressionfollowingimmunotherapy(23).Notably,inthis

      case, the patient presented with ampliﬁcations of MDM2 and CDK4.

      This aligns with prior studies indicating that patients with METex14

      skippingmutationsandMDM2ampliﬁcationmaynotrespondto

      crizotinib but can derive clinical beneﬁt from savolitinib (24).

      Regarding adverse effects, the patient received savolitinib 400 mg

      once daily and experienced only mild nausea and vomiting. Common

      adverse reactions of savolitinib primarily include nausea and vomiting,

      peripheraledema,hypoalbuminemia,hepatorenalimpairment,fa-

      tigue, and hypokalemia, most ofwhichare grade 1–2 adverse events

      (21).Managementshouldbebasedonclinicalpracticeandimple-

      mentedthroughlifestyleanddietarymodiﬁcations,pharmacological

      interventions, and treatment modiﬁcation (25).

      In conclusion, this case report describes a patient with NSCLC

      andCNSmetastases(BMandLM)whoseCSFtestedpositivefor

      METex14skippingmutations.Hedemonstratedclinicalandradi-

      ologicalimprovementfollowingsavolitinibtreatment.Thisreport

      contributes to the growing evidence on the management of patients

      with NSCLC with CNS metastases harboring this speciﬁc mutation.

      FurtherprospectiveclinicalstudiesonsavolitinibforNSCLCwith

      CNS metastasesarewarranted.

