    text: 'result,theoptimalmanagementofLMandBMispoorlydeﬁned.

      The prognosis of patients with NSCLC with CNS metastases is poor,

      andfurtherimprovementisgreatlyneeded.Themedianoverall

      survival(OS)forpatientswithBMis3–7months.However,the

      medianOSofLMisonlyapproximately3monthsinheavilypre-

      treated patients (4, 5). Male sex [hazard ratio (HR) 0.61], absence of

      hydrocephalus (HR 0.42), and targeted therapy post-diagnosis (HR

      0.33) were independent predictors of improved survival in LM (5).

      The presence of mesenchymal–epithelial transition factor exon

      14(METex14)skippingmutationsinCSFisrareinpatientswith

      NSCLCwithCNSmetastases.Savolitinibisahighlyselectiveoral

      targetedtherapyforNSCLCharboringtheMETex14skipping

      mutations.However,dataontheefﬁcacyofsavolitinibinpatients

      with CNS metastases remain limited. Here, we report a patient with

      NSCLCandCNSmetastasesharboringMETex14skippingmuta-

      tionswhobeneﬁted fromsavolitinib.

      A66-year-oldmanwasadmittedtoourhospitalinNovember

      2022,witha3-dayhistoryofleft-sidedlimbweaknessandslurred

      speech,accompaniedbynauseaandvomiting.Abraincomputed

      tomography(CT)scanrevealedahypodenselesionintheright

      frontallobe.Althoughthepatient’ssymptomsimprovedslightly

      withantiplateletandsupportivetherapy,leftlimbweaknessand

      speechimpairmentpersisted.Hewasinitiallydiagnosedwith

      cerebralinfarction.Hehadahistoryofhypertensionforover10

      years and pulmonary nodule resection2 years prior.Postoperative

      pathologyconﬁrmedlungadenocarcinomawithaMETex14skip-

      ping mutation, for which he was on regular follow-up. He had a 20-

      year smokinghistorybuthadquit2 yearsearlier.

      Contrast-enhancedcranial magneticresonanceimaging(MRI)

      showednodularandring-enhancingabnormalitiesinthebilateral

      frontal,temporal,andparietallobes(Figure1A).HisKarnofsky

      Performance Status (KPS) was 50. Lumbar puncture examination of

      CSF revealedelevated intracranialpressure(ICP)(>330 mmH2O),

      increased white blood cell count (17 × 106/L), and elevated protein

      level (0.46 g/L). Cytological analysis of CSF conﬁrmed the presence

      of tumor cells (Figure 2). Next-generation sequencing (NGS) of the

      CSFsampleratherthanplasmaidentiﬁedMETex14skipping

      mutation,alongwithampliﬁcationsofcyclin-dependentkinase4

      (CDK4),mousedoubleminute2homolog(MDM2),andtelome-

      rase reversetranscriptase(TERT)(Figures3A, B).

      BasedonCSFandMRIﬁndings,thepatientwasdeﬁnitively

      diagnosed with both BM and LM. Because of the patient’s refusal of

      radiotherapyandchemotherapy,thepatientreceivedoral

      savolitinib(400mg/day),asingleintrathecalinjectionofmetho-

      trexate(5mg,twiceaweek),andsupportivecare.Thepatient

