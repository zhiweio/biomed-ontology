      Inthepopulationwithnon-smallcelllungcancer(NSCLC),theincidenceof

      mesenchymal–epithelialtransitionfactorexon14(METex14)skippingmutations

      is approximately 3%–4%. However, the prevalence of this mutation appears to
      be

      loweramongpatientswithNSCLCpresentingwithbrainmetastases(BMs)or

      leptomeningealmetastases(LMs).AlthoughMETex14skippingmutationsconfer

      highsensitivitytosmall-moleculeMETtyrosinekinaseinhibitor(TKI),data

      regardingtheirefﬁcacyspeciﬁcallyagainstBMorLMremainlimited.Herein,we

      presented the case of a 66-year-old man diagnosed with lung adenocarcinoma.

      METex14skippingmutationsweredetectedincirculatingtumorDNA(ctDNA)

      fromthecerebrospinalﬂuid(CSF)vianext-generationsequencing(NGS).The

      patient derived signiﬁcant clinical beneﬁt from savolitinib treatment, achieving
      an

      intracranialpartialresponse(PR)uponevaluation.Inconclusion,NGS-based

      detectionofctDNAinCSFprovidesavaluabletoolforelucidatingtumor

      heterogeneityandthedistinctmolecularproﬁlesofcentralnervoussystem

      (CNS) metastases compared to primary tumors. Furthermore, savolitinib demon-

      stratedpromisingintracranialactivityandamanageablesafetyproﬁleinthis

      METex14-alteredNSCLCcase.Theseﬁndingssuggestthatsavolitinibmayrep-

      resent a viable novel treatment option for this patient population. Collectively,
      our

      dataindicatethatsavolitinibholdspromiseasanoveltreatmentstrategyfor

      thispopulation.

      KEYWORDS

      brain metastases, leptomeningeal metastases, mesenchymal-epithelial transition
      factor,

      non-small cell lung cancer, savolitinib

      Central nervous system (CNS) metastases are a frequent and advanced complication
      of

      non-small cell lung cancer(NSCLC). They areestimated tooccur in20%–25% of patients

      withadvancedNSCLCatinitialpresentationanddevelopin30%–40%ofpatientsduring

      thecourseoftheirdisease(1).CNSmetastasesincludebrainmetastases(BMs)and

      leptomeningealmetastases(LMs).LM,alsoknownasleptomeningealcarcinomatosis,

      involvestheinﬁltrationofmetastaticcancercellsintothecerebrospinalﬂuid(CSF)(2,3).

      Clinical trials of systemic treatments largely exclude patients with BM, especially
      LM. As a

