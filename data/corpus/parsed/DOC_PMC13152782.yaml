      Within the ﬁrst 8 days of treatment, his limb weakness and speech

      impairmentshowedcorrespondingimprovement.Hewassubse-

      quently discharged from the hospital on continued oral savolitinib.

      Thepatientdeclinedtherecommendedfollow-upbrainMRIat2

      monthsformetastasismonitoring,whoseKPSscorewas60.A

      follow-upbrainMRIperformedat7monthsafterdischarge

      demonstratedintracranialpartialresponse(PR),andKPSscore

      was 70 (Figure 1B). The patient ultimately died in October 2023 due

      toseverepneumoniaandsepticshock.HisOSfollowingthe

      diagnosisof BMandLM was11 months.

      This case highlights the importance of savolitinib for patients with

