      The patient described in this report is a 79-year-old male with a

      long-standing history of tobacco use. This feature stands in notable

      contrasttothetypicalproﬁleoutlinedinpriorstudies,where

      METex14aremorecommonlyobservedinolder,female,and

      non-smokingindividuals.Althoughevidencesuggeststhatthe

      efﬁcacyofICIsmaybereducedinMETex14-mutatedNSCLC

      (10,13),thispatientachievedaPFSof7monthswithﬁrst-line

      tislelizumab. This outcome may be related to the high TPS of 99%

      for PD-L1 expression on tumor cells. These ﬁndings indicate that in

      cases of extremely high PD-L1 expression, ICIs may remain a viable

      initial treatment option. Furthermore, this suggests that the tumor’s

      responsetotreatmentmaybeinﬂuencedbymultiplefactors,

      includingbutnotlimitedtoPD-L1expressionlevel(14),Tumor

      MutationalBurden(TMB)(15),andco-occurringgeneticaltera-

      tions(16)(suchastheTP53mutationfoundinthiscase).Recent

      investigationshavesimilarlynotedthatwithinthesubgroupof

      patientsexhibitingveryhighPD-L1expression(TPS≥80%),ICIs

      havedemonstratedconsiderabletherapeuticpromise(11,12).

      Thedistinctivenessofthiscaseisfurtherevidentinitssubse-

