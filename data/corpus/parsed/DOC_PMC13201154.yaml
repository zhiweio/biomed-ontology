    text: 'it more conducive to T-cell-mediated cytotoxicity, thereby restoring

      sensitivity to PD-1 blockade. However, this mechanistic explanation

      remainsspeculative,and researchdataarelimited.

      Thecomplexityofthiscasenecessitatesconsiderationofother

      contributing factors. First, the tumor’s molecular proﬁle is complex,

      withconcurrentTP53andMETex14mutations.Intheabsenceof

      variantallelefrequencydata,assessingclonaldynamicsanddeter-

      mining whether the METex14 alteration is a truncal driver event is

      challenging.Second,thepatient’ssigniﬁcantsmokinghistorycon-

      trasts with the typical METex14 mutated population and may have

      contributedtoauniquetumormutationalburdenandimmuno-

      geniclandscape,potentiallyconfoundingthetreatmentresponse

      pattern. Third, the clinical context of the tislelizumab re-challenge is

      unique: savolitinib was discontinued due to toxicity while the tumor

      wasinastateofresponse,notradiographicprogression.This

      minimalresidualdisease(MRD)scenariomayrepresentabiolo-

      gicalbackgroundwhereimmunesurveillanceismoreeffective,

      differing from the standard scenario of TKI treatment progression.

      Thisexempliﬁestheneedforcarefulclinicaljudgmentinindivid-

      ualizedoncology.

      Throughtheuniqueandeffectivetreatmentsequenceof“tar-

      getedtherapyafterimmunotherapyresistance,followedbyre-

      challengewithimmunotherapy,”thiscaseprovidesvaluablein-

      sightsforindividualizedtreatmentinNSCLCpatientswithhigh

      PD-L1expressionandconcurrentMETex14mutation.Itscore

      signiﬁcanceliesinprovidingpreliminaryclinicalevidencethat

      MET-TKIsmayreverseacquiredresistancetoPD-1inhibitors,

      offeringanewperspectiveontreatmentstrategiesforthisspeciﬁc

      patientsubgroup.

      Themanagementofthiscaseunderscorestheintricaciesin-

      volvedinclinicaldecision-makingandthepotentialquandaries

      encounteredinNSCLCpatientswhoexhibitbothhighPD-L1

      expressionandMETex14mutations.Whileexistingnationaland

      internationalguidelinestypicallyadvocatetargetedtherapyasthe

      frontlinestandardforindividualswithMETex14mutations(3,6,

      20–22),inreal-worldclinicalpractice,theselectionofinitial

      treatmentsforpatientscontinuestodivergesigniﬁcantly.This

      variabilitystemsfromamultitudeoffactors,includingdrug

      availability,disparitiesinregionalapprovals,andclinicianprefer-

      ences. Furthermore, this case and recent research data indicate that

      for patients with extremely high PD-L1 expression (TPS ≥80%), the

      medianoverallsurvival(mOS)withimmunotherapy(withor

      withoutchemotherapy)issigniﬁcantlybetterthanthatwith

      single-agentMET-TKItreatment,suggestingthatimmunotherapy

      can also be considered an effective initial treatment option (11, 12).

      Thisﬁndingchallengesthesingularmodelof“targetedtherapy

      ﬁrst”andunderscorestheimportanceofindividualizedtreatment

      decisionsbasedonmultidimensionalbiomarkers.Akeyclinical

      misconceptionisthatfocusingsolelyondrivergenemutations

      whileoverlookingextremelyhighPD-L1expressionmaylead

      patientstomisstheopportunitytobeneﬁtfromimmunotherapy.

      Additionally,itmustbeanticipatedthatresistancetoMET-TKIs

      willeventuallydevelop(23,24).Therefore,forsuch“double-

      positive”patients,comprehensivemolecularpathologyand

      immuneproﬁlinganalysisformsthefoundationfordeveloping

      precise treatmentstrategies.

      TheMET-TKImediatedimmunere-sensitizationmechanism

      proposed throughour observationin thiscase ishypothetical,and

      theinterpretationisinherentlylimitedbythenatureofasingle

      retrospectivecasereport.Validationthroughprospectivestudies

      andtranslationalresearchisneeded.Additionally,thisstudylacks

      baselineTMBdatatosupportthepotentialreasonsfortheinitial

      effectiveness of immunotherapy, and no re-biopsy was performed at

      diseaseprogressiontoanalyzespeciﬁcresistancemechanisms.

      Therefore,thegeneralizabilityofitsconclusionsislimited,and

      whetherthisexperienceappliestoabroaderMETex14mutated

      NSCLCpopulation remainsuncertain.

      This case report, along with a literature review, indicates that for

      patientswithadvancednon-smallcelllungcancerexhibiting

      exceptionallyhighPD-L1expressionlevelsandconcurrent

      METex14skippingmutations.Therefore,clinicaltreatmentdeci-

      sionsshouldbehighlyindividualized.Immunotherapyremainsa

      viable option as part of ﬁrst-line treatment. The observed phenom-

      enonof“successfulreversalofacquiredresistancetoPD-1inhib-

      itors through MET tyrosine kinase inhibitors” offers a novel clinical

      perspective and practical foundation for overcoming immunother-

      apy resistance.

      Inthefuture,byfurtherdeepeningbasicresearchandclinical

      translationalexploration,weaimtoidentifybiomarkersthatcan

      predict the response to immunotherapy or targeted therapy, thereby

      clarifyingthetargetpopulationforprioritizingimmunotherapyor

      targetedtherapyamong“double-positive”patients;utilizemulti-

      omics technologies (such as single-cell RNA sequencing and spatial

      transcriptomics)todeeplyelucidatethemolecularandimmuno-

      logical mechanisms by which MET inhibitors reverse immunother-

      apyresistance;explorenewcombinationoroptimizedsequential

      treatmentmodalitiesofMET-TKIsandICIs,whileproperlyman-

      agingpotentialoverlappingtoxicities(suchashepatotoxicityand

      interstitialpneumonia).Thiswillcontributetodevelopingmore

      optimizedandprecisetreatmentstrategiesforthisspeciﬁcpa-

      tientpopulation.

