  - name: resistanceandliteraturereview / YefeiRuanandLinQiu*
    text: 'The Afﬁliated YangmingHospitalofNingbo University,YuyaoPeople’sHospital,Yuyao,China

      In the precisionmanagement ofnon-smallcell lungcancer (NSCLC), identifying

      drivermutationsandevaluatingimmune-relatedbiomarkersareessential.Yet,

      clear therapeutic protocols remain absent for tumors that concurrently carry
      MET

      exon14skippingmutations(METex14)anddemonstrateelevatedprogrammed

      deathligand-1(PD-L1)expression.Thisreportdetailsthecaseofa79-year-old

      male with a prolonged smoking history who quit 20 years ago, diagnosed with
      left

      lungNSCLC.PathologicalanalysisrevealedhighPD-L1expressioninthetumor

      (tumorproportionscore99%),alongsideaMETex14mutation.Initialtherapy

      employedthePD-1inhibitorTislelizumab,yieldingaprogression-freesurvival

      (PFS)of7months.TreatmentwasthenmodiﬁedtotheMETtyrosinekinase

      inhibitor(MET-TKI)Savolitinib,whichledtomarkedtumorreduction.Following

      discontinuationofSavolitinibduetodrug-inducedliverinjury,Tislelizumab,

      previouslyassociatedwithresistance,wasreintroducedasa“rechallenge”suc-

      cessfullyre-establishingdiseasecontrol.Thisdistinctivetherapeuticsequence

      providesclinicalevidencethat“METinhibitorsmaycounteractacquiredresis-

      tancetoPD-1inhibitors”.Beyondunderscoringthevalueofpersonalizedtreat-

      ment in the intricate setting of coexisting high PD-L1 expression and MET-driven

      mutations,this casehints at anovel strategy:sequential MET inhibitortreatment

      restoresensitivitytoimmunotherapyresponsesbymodifyingthetumormicro-

      environment. Coupled with a systematic review of pertinent literature, this
      article

      explores the clinical features, therapeutic challenges, potential resistance
      mech-

      anisms,andmanagementapproachesforsuchpatients.Italsooutlinesfuture

      researchavenuesforcombinationorsequentialtherapies,aimingtofurnisha

      moreholisticreferenceforclinicaldecision-making.

      KEYWORDS

      MET14exon skippingmutation,non-small celllungcancer, programmeddeath-ligand

      1,savolitinib,tislelizumab

