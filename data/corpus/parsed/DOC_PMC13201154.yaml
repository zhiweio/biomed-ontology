  title: 'Clinical response in advanced non-small cell lung cancer with high PD-L1
    expression and &lt;i&gt;MET&lt;/i&gt; exon 14 skipping mutation: a case analysis
    of overcoming immunotherapy resistance and literature review.'
  doc_type: JOURNAL_ARTICLE
