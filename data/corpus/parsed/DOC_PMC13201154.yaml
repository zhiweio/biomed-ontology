    text: 'question:whydidimmunotherapyregainefﬁcacyfollowingdis-

      continuationoftargetedtherapy?Existingliteraturehasmore

      frequentlydocumentedprimaryresistancetoICIsinpatientswith

      METex14 mutations or the potential heightened risk of ICI-related

      adverseeventsfollowingMET-TKItherapy(17),whereascase

      reportssuccessfullyovercomingimmuneresistancethroughse-

      quentialtreatmentremainrelativelyscarce.Moreover,somecase

      reports suggest that the combined use of anti-CTLA-4 and anti-PD-

      1antibodiesmightovercomePD-1inhibitorresistancein

      METex14-mutated NSCLC (18). A plausible hypothesis explaining

      thesuccessoftheimmunotherapyre-challengeinthiscaseisthat

      savolitinib, by effectively inhibiting the METex14-driven oncogenic

      pathway,mayhavemodulatedthetumormicroenvironment

