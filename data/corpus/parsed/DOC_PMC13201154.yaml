  - name: 10.3389/fonc.2026.1807242 / Follow-upandclinicaloutcomes / Patient information
    text: 'Non-smallcelllungcancer(NSCLC)istheleadingcauseof

      cancer-related death worldwide. Over the last ten years, advances in

      decipheringtumordevelopmentmechanismshaveledtonotable

      improvements in therapeutic approaches (1). For advanced NSCLC,

      current personalized precision medicine relies on three main pillars:

      targetedtreatmentsforspeciﬁcdrivergenealterations,immuno-

      therapycenteredonimmune-checkpointinhibitors(ICIs),and

      chemotherapypairedwithanti-angiogenicagents.Amongthese,

      METex14isarelativelyrareoncogenicdriveralteration,foundin

      about3%–4%ofNSCLCcasesandmorefrequentlyobservedin

      olderindividuals,women,andnon-smokers(2,3).Thisgenetic

      changedisruptstheubiquitin-mediateddegradationoftheMET

      receptor,leadingtosustainedactivationofdownstreamsignaling

      cascadesthatfostertumorinitiationandprogression(4).This

      alterationisnotablyenrichedinpulmonarysarcomatoidcarci-

      noma,ahistologicsubtypeassociatedwithaggressivebehavior

      and unfavorableprognosis(5).Today, MET tyrosine kinaseinhib-

      itorsdesignedtotargetMETex14(suchascapmatinib,tepotinib,

      andsavolitinib)havedemonstratedhighobjectiveresponserates,

      establishingthemasthestandardofcareforthesepatients(6, 7).

      Meanwhile,forpatientswhosetumorsshowaPD-L1tumor

      proportion score (TPS) of 50% or higher, monotherapy with a PD-

      1/PD-L1 monoclonal antibody has become the established ﬁrst-line

      treatment(8,9).However,whenbothhighPD-L1expressionand

      METex14 mutation, two molecular characteristics with well-deﬁned

      therapeuticrelevance,coexistinthesameindividual,adistinct

      clinicalconundrumarises:shouldtargetedtherapyorimmuno-

      therapytakeprecedence?Atpresent,noclearconsensusorguide-

      lineexiststodirectmanagementstrategiesforsuch“double-

      positive” cases. Some available data indicate that patients harboring

      METmutationsgenerallyrespondpoorlytoimmunotherapyand

      experienceshorterprogression-freesurvival(10).Nevertheless,

      recentinvestigationshavehighlightedthatinasubgroupwith

      exceptionallyhighPD-L1expression(TPS≥80%),immunotherapy

      mightshowefﬁcacycomparabletoorevensurpassingthatof

      targetedtherapy,therebyquestioningtheconventionalwisdomof

      prioritizingtargetedtreatment(11,12).Hence,determiningthe

      optimaltherapeuticapproachforthisrareyetclinicallyimportant

      patientgrouphas emergedasa pressingnecessity.

      Herein,wepresentachallengingcaseofadvancedNSCLC

      harboring both a high PD-L1 TPS and a METex14 mutation, illustrat-

      ingauniquesequentialtreatmentstrategyandraisingimportant

      questions regarding therapeutic interplay and resistance mechanisms.

      Thepatientisa79-year-oldmalewithasigniﬁcantsmoking

      history,whoquitsmokingtwentyyearsago.InNovember2022,a

      chest CT scan identiﬁed a space-occupying lesion in the right upper

      lunglobe,promptingreferraltoourinstitutionforfurtherevalu-

      ation.Uponadmission,physicalexaminationrevealedabarrel-

      shapedchest,diminishedbreathsoundsbilaterally,andnoother

      notable positiveﬁndings.

      Contrast-enhancedchestCTdemonstratedasolidnodule

      measuringapproximately20×27mmintherightupperlobe,

      accompaniedbymediastinallymphadenopathy(Figure1).An

      ultrasound-guidedtransbronchialneedleaspirationbiopsyofthe

      4Rmediastinallymphnodeswasperformedviabronchoscopyto

      establishapathologicaldiagnosis.Histopathologicalexamination

      conﬁrmed non-small cell lung carcinoma. Subsequent immunohis-

      tochemical analysis showed tumor cells with diffuse strong positiv-

      ityforthyroidtranscriptionfactor-1(TTF-1),whileP40staining

      wasweaklypositiveinonlyaminorityofcells,supportinga

      diagnosisoflungadenocarcinoma(Figure2).Fortumorstaging,

      whole-bodybonescintigraphy(ECT)wasconducted,revealing

      evidenceofbonemetastasis.PD-L1immunohistochemicaltesting

      ofthetumortissueindicatedhighexpression,withatumor

      proportionscore(TPS)of99%.Additionally,molecularpatholog-

      icalanalysisofthetumortissuevianext-generationsequencing

      identiﬁedthefollowingdrivergenemutations:METexon14

      skippingmutation,TP53p.R273Hpointmutation,andMET

      exon 16p.H1094Ypointmutation.

      BeginninginDecember2022,thepatientwastreatedwith

      Tislelizumabmonotherapy,administeredeverythreeweeksata

      doseof200mg.Aftersixcyclesoftreatment,imagingfollow-up

      demonstrated a reduction in lesions, with efﬁcacy assessed as partial

      response(Figure3AversusB).Thepatientthencontinuedthis

      regimen as maintenance therapy, completing a total of eight cycles.

      However,subsequentimagingfollow-uprevealedlocoregional

      diseaseprogression,indicatedbyanincreaseinthesizeofthe

      primary lunglesion(Figure3C).

      Given the detection of a METex14 through driver gene testing,

      theclinicaltreatmentapproachwasmodiﬁedtotargetedtherapy,

      initiatingoralSavolitinibatadailydoseof400mg.Twomonths

      aftertreatmentinitiation,follow-upchestCTshowedamarked

      reductioninlesions,indicatingcleartherapeuticbeneﬁt

      (Figure 3D). Nevertheless, during Savolitinib treatment, the patient

      developedseveredrug-inducedliverinjury,meetingcriteriafor

      Grade3(severe)hepatotoxicityaccordingtoCTCAEv5.0.

      Consequently,Savolitinibwaspromptlydiscontinued,andliver-

      protectiveandenzyme-loweringtreatmentswerecommenced.

      Afteroveramonthofsymptomaticsupportivecare,thepatient’s

      liver functionparametersreturnedtothenormalrange.

      Followingfurtherdiscussionwiththepatientandobtaining

      informedconsent,anti-tumortherapywithTislelizumabwasre-

      sumed onNovember29,2023.

      AfterresumingTislelizumabtherapy,routineimagingsurveil-

      lance revealed stable lesions with no evidence of disease progression

      (Figure4).Currently,thepatientremainsinstableconditionand

