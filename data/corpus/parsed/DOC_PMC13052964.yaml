  title: Post-marketing signal detection of fruquintinib-associated adverse events
    using the FAERS database.
  doc_type: JOURNAL_ARTICLE
  language: en
  license_tier: TIER_0
  sections:
  - name: 1. Introduction / Cui Liu, MMa / , Hao Zhang, MMa,*
    text: 'Observational Study

      1

      ®

      Abstract

      Fruquintinib, a targeted therapeutic agent approved in 2018 for the treatment
      of metastatic colorectal cancer, is gradually being

      applied in an expanding range of clinical settings. Given the complexities associated
      with real-world dosing, a comprehensive

      evaluation of its safety profile is essential for optimizing clinical decision-making.
      We conducted a retrospective pharmacovigilance

      study utilizing a spontaneous reporting system. Reports related to Fruquintinib
      were extracted through a standardized data

      cleaning process and cross-validated using 3 complementary signal detection
      algorithms: proportional reporting ratio, Bayesian

      confidence propagation neural network, and reporting odds ratio (ROR). This
      approach was employed to systematically assess

      the drug’s safety and identify potential adverse event signals. A total of 92
      statistically significant safety signals were identified

      from 1188 independent cases included in the analysis, corresponding to 1836
      adverse event reports. The signal distribution

      exhibited organ system specificity, with gastrointestinal reactions being the
      most prevalent category. These reactions primarily

      manifested as typical drug-related toxicities, including diarrhea and nausea.
      Other notable complications included neurological,

      respiratory, dermatological, renal, and cardiovascular events. Important aes
      not mentioned in the instructions, such as bone

      marrow suppression (ROR = 11.17), peripheral neuropathy (ROR = 4.24) and dehydration
      (ROR = 3.98), were also discovered.

      This study systematically characterizes the post-marketing safety profile of
      Fruquintinib through a multi-algorithm synergistic

      analysis, confirming that its safety profile aligns with the clinically expected
      outcomes based on its mechanism of action. Future

      research should focus on analyzing drug interaction mechanisms and exploring
      biomarkers to develop a precise risk-benefit

      assessment model.

      Abbreviations: ADE = adverse drug event, BCPNN = Bayesian confidence propagation
      neural network, CRC = colorectal

      cancer, EMT = epithelial-mesenchymal transition, eNOS-NO = endothelial nitric
      oxide synthase-nitric oxide, FAERS = FDA adverse

      event reporting system, FDA = food and drug administration, GMA = glomerular
      microangiopathy, HICs = high- and middle-

      income countries, IC = information components, MAD = measure of disproportionality,
      MedDRA = medical dictionary of regulatory

      activities, NMPA = National Medical Products Administration, PRR = proportional
      reporting ratio, PT = preferred terminology,

      ROR = reporting odds ratio, SOC = system organ classification, TMA = thrombotic
      microangiopathy, US = United States, VEGFR =

      vascular endothelial growth factor receptors.

      Keywords: adverse events, FAERS, fruquintinib, pharmacovigilance

      1. Introduction

      Colorectal cancer (CRC), the third most common malignancy

      globally and the second leading cause of cancer-related deaths,

      demonstrates substantial global heterogeneity in its disease bur­

      den.[1] Epidemiological data indicate significant geographic vari­

      ations in the global incidence of CRC, with particularly high

      rates observed in high- and middle-income countries (HICs).

      These variations are closely associated with factors such as

      urbanization, dietary changes toward Western patterns, and

      population aging. Despite improvements in prognosis due to

      the promotion of healthy lifestyles and increased early screening

      awareness, 15% to 30% of patients still present with distant

      metastases at initial diagnosis. The liver is the most common

      site of metastasis (approximately 50%–70%), followed by the

      lungs, peritoneum, and lymph nodes. This metastatic pattern is

      strongly linked to the biological characteristics of CRC and its

      vascular invasion pathways.[2]

      The authors have no funding and conflicts of interest to disclose.

      All data generated or analyzed during this study are included in this published

      article [and its supplementary information files].

      The FAERS comprises de-identified spontaneous reports for which research-

      specific informed consent was not obtained, as per regulatory standards. This

      study was exempt from ethical review and informed consent requirements under

      applicable guidelines, given its exclusive use of publicly accessible, anonymized

      data sourced from the FAERS database.

