      collection and cleansing
    text: "2\nLiu and Zhang • Medicine (2026) 105:14\b\nMedicine\nFruquintinib, a\
      \ highly selective small molecule tyrosine\nkinase inhibitor targeting vascular\
      \ endothelial growth factor\nreceptors (VEGFR) 1, 2, and 3, was independently\
      \ developed\nby Hutchison Whampoa Pharmaceuticals. It was approved for\nmarketing\
      \ in September 2018 through the priority review pro­\ncess by the National Medical\
      \ Products Administration of China.\nFruquintinib is indicated for patients\
      \ with metastatic colorectal\ncancer (mCRC) who have failed at least 2 prior\
      \ standard che­\nmotherapy regimens.[3] The drug inhibits vascular endothelial\n\
      cell proliferation and migration by competitively binding to the\nintracellular\
      \ tyrosine kinase domain of VEGFR and specifically\nblocking ligand-induced\
      \ phosphorylation of the VEGF recep­\ntor. Notably, VEGFR-1 and VEGFR-2 exhibit\
      \ high expression\nin colorectal cancer cells, playing a critical role in regulating\n\
      tumor cell proliferation, survival, and epithelial-mesenchymal\ntransition through\
      \ activation of the PI3K/Akt and MAPK/\nERK signaling pathways. In contrast,\
      \ the VEGFR-3 signaling\naxis is primarily involved in regulating lymphangiogenesis.[4–6]\n\
      Reported adverse events (AEs) include hypertension (38.7%),\nhand-foot syndrome\
      \ (27.4%), bleeding (21.9%), abnormal liver\nfunction (elevated AST/ALT in 19.3%),\
      \ proteinuria (15.8%),\nand hypothyroidism (12.4%). The incidence of grade 3\
      \ or\nhigher AEs is approximately 42.6%,[7] which can be managed\nwith dose\
      \ adjustments and supportive therapy.\nThe FDA adverse event reporting system\
      \ (FAERS) is a pub­\nlicly accessible spontaneous reporting database that includes\
      \ a\nvast collection of AEs, medication errors, and product quality\ncomplaints\
      \ submitted by healthcare professionals, manufactur­\ners, and other stakeholders.\
      \ It offers a valuable source of real-\nworld data for drug safety research,\
      \ making it an essential tool\nfor identifying potential adverse reactions and\
      \ assessing the\nsafety of drugs in clinical practice.[8]\nThis study aimed\
      \ to identify and characterize post-marketing\nadverse event signals associated\
      \ with Fruquintinib in the FAERS\ndatabase from 2023 to 2024 to support clinical\
      \ risk manage­\nment and pharmacovigilance practice.\n2. Methods\n2.1. Data\
      \ collection and cleansing\nThe FAERS database includes 7 core data elements:\
      \ demo­\ngraphic and management information (DEMO), adverse drug\nreaction data\
      \ (REAC), patient outcomes (OUTC), drug infor­\nmation (DRUG), treatment start/end\
      \ dates (THER), report­\ning source (RPSR), and indications for use/diagnosis\
      \ (INDI).\nAdverse drug event (ADE) descriptors were standardized and\nadapted\
      \ with reference to the medical dictionary for regula­\ntory activities (MedDRA28.0).\
      \ Following the FDA’s recom­\nmended method for removing duplicate reports,\
      \ select the\nPRIMARYID, CASEID, and FDA_DT fields from the DEMO\ntable. Sort\
      \ the records in the order of CASEID, FDA_DT, and\nthen PRIMARYID. For reports\
      \ with identical CASEIDs, retain\nthe one with the largest FDA_DT value. Subsequently,\
      \ for\nreports with matching CASEID and FDA_DT values, retain\nthe one with\
      \ the largest PRIMARYID value. ADE reports\nwith the same preferred term (PT)\
      \ were grouped together\nand categorized by the system organ class (SOC). A\
      \ total of\n3293,302 patient reports were screened from the FAERS data­\nbase,\
      \ with 391,174 duplicates removed. Reports identifying\n“Fruquintinib” as the\
      \ primary suspected drug were selected\nfor inclusion in the study from November\
      \ 2023 to December\n2024. As a result, 1188 patients treated with Fruquintinib\
      \ as\nprimary therapy and 1836 adverse event cases were included\nfor further\
      \ analysis, as shown in Figure 1.\n2.2. Signal detection and statistics\nMeasure\
      \ of disproportionality (MAD) is a widely used ADR\nsignal detection method\
      \ both domestically and internation­\nally. In this study, several signal detection\
      \ methods were used,\nincluding reported ratio ratio (ROR), proportional reporting\n\
      ratio (PRR), and Bayesian belief propagation neural network\n(BCPNN) as part\
      \ of the disproportionality analysis method.\nROR is one of the classical signal\
      \ detection methods that help\nto eliminate bias by providing a more accurate\
      \ risk estima­\ntion. PRR has higher specificity compared to ROR. BCPNN\nevaluates\
      \ drugs mainly based on information components\nand their 95% confidence intervals\
      \ and has the advantage of\nintegrating and cross-validating data from multiple\
      \ sources.[9]\nThis comprehensive approach improves the accuracy of safety\n\
      signal identification, reduces false positives through cross-\nvalidation, balances\
      \ sensitivity and specificity, and enhances\nthe detection of rare AEs by adjusting\
      \ thresholds and vari­\nances. The specific formulas are shown in Tables 1 and\
      \ 2. Each\nPT was judgmentally screened according to the thresholds in\nFigure\
      \ 1. The process of selecting AEs from the FAERS database. AEs = adverse events,\
      \ FAERS = FDA adverse event reporting system."
