      Table 2, and the judgmental criteria of the 3 algorithms had to be met simultaneously
      before an ADE signal was generated. The generation of ADE signals suggests a
      statistical correlation with the drug, and the stronger the signal, the stronger
      the correlation between the 2. All statistical analyses were performed using
      R software 4.3.2 and Microsoft Excel for data analysis. [10]

      The analysis yielded a total of 1836  AEs related to Fruquintinib, reported  between  November  2023  and  December  2024,
      involving 1188 patients. The distribution of patients by gender was roughly
      equal, with a slightly higher proportion of males. The majority of patients
      (48%) were aged between 18 and 85 years. The United States reported the highest
      number of adverse reactions, accounting for 848 cases (71.4%), followed  by  China  (15.5%).  Detailed  information  is  provided
      in  Table 3.  The  time  to  the  onset  of  adverse  reactions  was defined
      as the interval between the occurrence of the adverse event and the initiation
      of Fruquintinib treatment. The most common period for AEs to occur was within
      the first 30 days of  treatment,  which  accounted  for  approximately  63%  of
      reported cases (Fig. 2).

      In  this  study,  a  signal  detection  method  was  employed  to systematically  analyze  AEs  associated  with  Fruquintinib.
      The analysis identified 16 SOCs and 92 PTs related to the reported  AEs.  Based  on  the  frequency  of  adverse  event
      reports,  the  top  3  SOC  categories  were  systemic  diseases and drug administration
      site reactions, gastrointestinal disorders,  and  abnormalities  in  various  laboratory  tests.  The
      specific  distribution  is  shown  in  Figure 3.  Quantitative signal  detection  revealed  that  the  signal  intensities  of  AEs
      in  these  3  SOCs  significantly  exceeded  the  preset  threshold.  Gastrointestinal  disorders  exhibited  the  highest  signal
      intensity  (ROR = 2.04),  followed  by  laboratory  abnormalities (ROR = 1.69),
      and systemic diseases and site-ofadministration reactions, which were statistically
      significant but had relatively lower signal intensity (ROR = 1.36). The results  of  this  multidimensional  analysis  may  suggest  a
      association between Fruquintinib and these 3 categories of systemic and organ-specific
      adverse reactions, with gastrointestinal toxicity being particularly prominent.'
    page: 3
  - name: 3.3. Risk signaling PT
    text: "\b\nFigure 2. Distribution of AEs over time. AEs = adverse events.\nNuber\n\
      Figure 3. Results of SOC classification of ADE signals. ADE = adverse drug event,\
      \ SOC = system organ classification.\nIn  this  study,  a  total  of  1836 \
      \ cases  of  Fruquintinib-related AEs  were  systematically  evaluated  using\
      \  3  complementary signal detection algorithms: PRR, Bayesian confidence propagation\
      \ neural network (BCPNN), and reporting odds ratio (ROR).  The  analysis  was\
      \  conducted  based  on  data  from the  FAERS  database.  After  applying \
      \ strict  exclusion  criteria,  which  included  nondrug-related  events,  complications\
      \ arising  from  drug  administration  procedures,  pregnancyspecific  events,\
      \  and  genetic  disorders,  92  statistically  significant safety signals were\
      \ identified. The signal validation results demonstrated  a  high  degree  of\
      \  consistency  with  the  known risk  profiles  currently  listed  in  the\
      \  drug's  labeling.  Among the  1188  independent  patients  included  in \
      \ the  analysis,  the AEs exhibited multisystem involvement. Gastrointestinal\
      \ disorders,  systemic  diseases  and  administration  site  reactions, and\
      \ laboratory abnormalities were the most prevalent event categories  according\
      \  to  the  MedDRA  SOC.  A  frequency analysis  of  the  PTs  revealed  that\
      \  fatigue  (ROR = 3.27),  elevated blood pressure (ROR = 11.78), diarrhea (ROR\
      \ = 2.18), weakness (ROR = 4.18), and dysphonia (ROR = 24.75) were the 5 most\
      \ frequently reported AEs (see Fig. 4 for the top 30 rankings). Notably, when\
      \ ROR values were used to assess signal intensity, the top 5 high-risk signals\
      \ identified were renal restrictive  thrombotic  microangiopathy  (ROR = 11.17),\
      \  elevated carcinoembryonic antigen (ROR = 41.89), tongue ulcers (ROR = 33.13),\
      \  vocal  difficulties  (ROR = 24.75),  and  bile duct obstruction (ROR = 20.09).\
      \ These signals exhibited significantly higher intensities than the traditionally\
      \ recognized high-incidence AEs (see Fig. 5 for the top 30 signal intensity\
      \ rankings).  Important  aes  not  mentioned  in  the  instructions, such as\
      \ bone marrow suppression (ROR = 11.17), peripheral neuropathy  (ROR = 4.24)\
      \  and  dehydration  (ROR = 3.98), were also discovered.\nWe  performed  subgroup\
      \  analyses  by  gender  and  age  group separately, with a view to exploring\
      \ whether adverse reactions differed in different populations, but the final\
      \ results showed a roughly balanced distribution, as shown in Figures 6 and\
      \ 7.\nConducting  an  in-depth  investigation  into  the  differences  in adverse\
      \ drug reactions (ADRs) among various medications is of paramount importance\
      \ for refining clinical treatment strategies and safeguarding patient medication\
      \ safety. With this in mind, we adopted a standardized and rigorous approach\
      \ to search the FAERS database, focusing specifically on 4 VEGFR inhibitors:\
      \ Axitinib, Cabozantinib, Sunitinib, and Vandetanib. We systematically  gathered\
      \  reports  where  these  drugs  were  identified  as the  primary  suspected\
      \  medications.  Subsequently,  we  applied predetermined screening criteria\
      \ to select reports that met our study requirements, with the objective of thoroughly\
      \ examining whether significant differences exist in ADRs among these different\
      \ VEGFR inhibitors."
    page: 4
  - name: 4. Discussion
    text: "Figure 4. Top 30 PT of frequency. PT = preferred term.\nThe results  of\
      \  our  study  demonstrated  that  these VEGFR inhibitors exhibit several common\
      \ adverse reactions. Specifically, 5 VEGFR inhibitors, including fruquintinib,\
      \ were found to be associated with the following AEs: palmar-plantar erythrodysaesthesia\
      \ syndrome, blood pressure increased, blister, decreased appetite, glossodynia,\
      \ oral pain, stomatitis, dry mouth, hypothyroidism, diarrhoea and proteinuria.\
      \ The top 5 other adverse reactions are detailed in Table 4. Furthermore, we\
      \ identified adverse reactions that are specific to fruquintinib, namely bone\
      \ marrow suppression, peripheral neuropathy, and dehydration.\nThe male-to-female\
      \ ratio among the reported cases was approximately  1:1,  with  a  slight  predominance\
      \  of  males.  The  incidence of the disease was more common among older patients,\
      \ which aligns with epidemiological findings on the disease. [2]  The majority\
      \ of reports originated from the United States, followed by Europe. This distribution\
      \ may be influenced by regional variations in drug usage as well as differences\
      \ in disease incidence across racial groups. [11]\nAmong the 16 SOC categories\
      \ associated with fruquintinibrelated ADE signals, systemic diseases/administration\
      \ site reactions,  gastrointestinal  disorders,  renal/urinary  disorders, \
      \ and abnormal  laboratory  test  parameters  were  most  frequently reported.\
      \ [7]  This distribution pattern corresponds to the known safety profile outlined\
      \ in the drug's prescribing information.\nA comprehensive frequency and risk\
      \ analysis of ADRs associated with fruquintinib revealed that the primary ADRs\
      \ requiring clinical monitoring include elevated blood pressure, hand-foot skin\
      \  reaction  (HFSR),  proteinuria,  diarrhea,  and  oral  mucositis.  Real-world\
      \  data  from  a  Chinese  cohort  (n = 76)  further validated these findings.\
      \ In a single-center retrospective study, the  major  hematologic  toxicities\
      \  observed  were  hypertension\n20\n\b\nFigure 5. Top 30 PT of signal intensity.\
      \ PT = preferred term.\n(9.2%),  HFSR  (7.9%),  and  thrombocytopenia  (3.9%).\
      \  Nonhematologic toxicities included oral mucositis (1.3%) and proteinuria\
      \ (1.3%). Notably, the incidence of ALT elevation (1.3%) and  neutropenia  (1.3%)\
      \  in  this  cohort  was  lower  than  that reported in the FRESCO phase III\
      \ clinical trial, potentially due to differences in baseline hepatic function\
      \ among the enrolled patients. [12]\nShu  et  al  described  a  case  of  pemphigus\
      \  vulgaris  (CTCAE grade 3) during fruquintinib monotherapy, which presented\
      \ with features  distinct  from  typical  HFSR:  a  diffuse  maculopapular rash\
      \ affecting the trunk and proximal extremities, histopathology showing dermal\
      \ lymphocytic infiltration with eosinophilia, and complete resolution of symptoms\
      \ after discontinuation of the drug, followed by recurrence upon re-administration.\
      \ [13]  This case may be associated with the need to be vigilant about the potential\
      \ spectrum of hypersensitivity reactions to fruquintinib. The hypothesized mechanism\
      \ may involve immune regulation abnormalities due to VEGFR inhibition, although\
      \ specific signaling pathways remain to be confirmed by in vitro studies.\n\
      Zhao  et  al [14] reported  a  case  of  fruquintinib-related  renal restrictive\
      \ thrombotic microangiopathy (RTMA) in a 73-yearold  male  patient.  During\
      \  treatment  for  metastatic  colorectal cancer with fruquintinib, the patient\
      \ developed skin peeling of the hands and feet, elevated blood pressure, and\
      \ increased urine foam. On the 28th day after starting treatment, renal dysfunction\
      \ prompted referral to the nephrology department, where renal ultrasound  and\
      \  biopsy  confirmed  RTMA.  The  kidney  injury potentially related to fruquintinib\
      \ may involve a dual mechanism:  direct  endothelial  cytotoxicity  leading\
      \  to  microvascular barrier  dysfunction,  and  compensatory  upregulation\
      \  of  proangiogenic factors (e.g., Ang-2, FGF-2). This response can disrupt\
      \  endothelial-podocyte  interactions,  evidenced  by  elevated soluble endothelial\
      \ factors (sVEGFR-1,  sEndoglin), which interfere  with  the  localization \
      \ and  function  of  podocyte  proteins (nephrin, podocin) in the glomerular\
      \ filtration barrier. Guo reported  a  case  of  drug-induced  glomerular  microangiopathy\
      \ (GMA) potentially related to focal segmental glomerulosclerosis following\
      \ treatment with tirilizumab and fruquintinib. The patient,  who  presented\
      \  with  bilateral  lower  extremity  edema and foamy urine, was diagnosed with\
      \ GMA after renal biopsy. [15]\nBleeding risk is another significant adverse\
      \ effect of fruquintinib.  A  rare  case  of  cerebellar  hemorrhage  has  been\
      \ reported  in  a  colorectal  cancer  patient  undergoing  treatment with \
      \ the  drug. [16]   Studies  suggest  that  VEGF  inhibitors  contribute  to\
      \  the  formation  of  reactive  oxygen  species,  reduce the activity of the\
      \ endothelial  nitric oxide  synthase-nitric oxide (eNOS-NO) pathway, and increase\
      \ circulating levels of endothelin-1, a potent vasoconstrictor. These effects\
      \ are important factors influencing blood pressure regulation. Additionally,\
      \ VEGFR  inhibitors  compromise  vascular  integrity  and  angiogenesis, weaken\
      \ the vessel wall, impair endothelial cell repair, and disrupt the blood-brain\
      \ barrier, thereby increasing the risk of  hemorrhage. [17] Ledet  reported\
      \  a  case  of  reversible  posterior  cerebral  syndrome  in  a  41-year-old\
      \  female  patient,  who developed acute headache, nausea, and vomiting 2 months\
      \ after starting fruquintinib. This eventually led to a generalized tonicclonic\
      \ seizure, which resolved with symptomatic treatment. [18] This hypothesized\
      \ mechanism may be related to fruquintinib's impact on endothelial cell homeostasis,\
      \ potentially resulting in arterial hypertension and inadequate cerebral perfusion.\
      \ [19]"
    page: 5
  - name: 5. Conclusion
    text: 'Figure 6. The subgroup analysis in gender.

      These  findings  potentially  related  to  fruquintinib  with  side effects  that  cannot  be  ignored.  In  clinical  practice,  emphasis
      should be placed on core risk factors such as hypertension, proteinuria,  neurological  dysfunction,  and  early  renal  toxicity  in
      patients, with dynamic monitoring and proactive intervention implemented.  Meanwhile,  future  research  needs  to  delve  into
      the  specific  mechanisms  by  which  population  characteristics, drug dosage
      gradients, and duration of medication influence the occurrence of adverse reactions.

      There are some limitations in this study. The FAERS database is  a  spontaneous  presentation  system,  and  there  are  problems  of  omission,  misreporting  and  missing  information  in
      the  data.  The  information  comes  from  various  sources  (e.g.,

      30

      pharmaceutical companies, patients, doctors, etc), and there is a certain degree
      of reporting bias. [20]  Although the deduplication process in this study based
      on FAERS can mitigate the impact of duplicate submissions, the current data
      cannot support precise incidence calculations due to underreporting caused by
      the system''s  passivity  and  the  unknowable  nature  of  unreported populations.
      We sincerely call for further research to explore more robust quantitative methods
      to overcome the limitations of existing surveillance systems. The dataset timeframe
      (1 year) limits trend and longitudinal analysis. Although the screening threshold
      of ADE signal was improved in this study by combining ROR method, BCPNN method
      and PRR method, the possibility of false-positive ADE signal still could not
      be ruled out. The generation of ADE signal could only indicate that there is
      a statistical correlation between the drug and the ADE, while the causal relationship
      between the drug and the ADE still needs further clinical research and evaluation.
      The data in this study are  mainly  from  Europe  and  the  United  States,  and  whether
      they are applicable to the Chinese patient population remains to be verified.

      We are grateful to the staff and participants of The FDA adverse event reporting
      system (FAERS).'
