  - name: 4. Discussion
    text: "5\nLiu and Zhang • Medicine (2026) 105:14\b\nwww.md-journal.com\nparamount\
      \ importance for refining clinical treatment strategies\nand safeguarding patient\
      \ medication safety. With this in mind,\nwe adopted a standardized and rigorous\
      \ approach to search the\nFAERS database, focusing specifically on 4 VEGFR inhibitors:\n\
      Axitinib, Cabozantinib, Sunitinib, and Vandetanib. We system­\natically gathered\
      \ reports where these drugs were identified as\nthe primary suspected medications.\
      \ Subsequently, we applied\npredetermined screening criteria to select reports\
      \ that met our\nstudy requirements, with the objective of thoroughly examining\n\
      whether significant differences exist in ADRs among these dif­\nferent VEGFR\
      \ inhibitors.\nThe results of our study demonstrated that these VEGFR\ninhibitors\n\
      exhibit\nseveral\ncommon\nadverse\nreactions.\nSpecifically, 5 VEGFR inhibitors,\
      \ including fruquintinib, were\nfound to be associated with the following AEs:\
      \ palmar-plantar\nerythrodysaesthesia syndrome, blood pressure increased, blis­\n\
      ter, decreased appetite, glossodynia, oral pain, stomatitis, dry\nmouth, hypothyroidism,\
      \ diarrhoea and proteinuria. The top 5\nother adverse reactions are detailed\
      \ in Table 4. Furthermore,\nwe identified adverse reactions that are specific\
      \ to fruquintinib,\nnamely bone marrow suppression, peripheral neuropathy, and\n\
      dehydration.\n4. Discussion\nThe male-to-female ratio among the reported cases\
      \ was approx­\nimately 1:1, with a slight predominance of males. The inci­\n\
      dence of the disease was more common among older patients,\nwhich aligns with\
      \ epidemiological findings on the disease.[2] The\nmajority of reports originated\
      \ from the United States, followed\nby Europe. This distribution may be influenced\
      \ by regional vari­\nations in drug usage as well as differences in disease\
      \ incidence\nacross racial groups.[11]\nAmong the 16 SOC categories associated\
      \ with fruquintinib-\nrelated ADE signals, systemic diseases/administration\
      \ site reac­\ntions, gastrointestinal disorders, renal/urinary disorders, and\n\
      abnormal laboratory test parameters were most frequently\nreported.[7] This\
      \ distribution pattern corresponds to the known\nsafety profile outlined in\
      \ the drug’s prescribing information.\nA comprehensive frequency and risk analysis\
      \ of ADRs associ­\nated with fruquintinib revealed that the primary ADRs requiring\n\
      clinical monitoring include elevated blood pressure, hand-foot\nskin reaction\
      \ (HFSR), proteinuria, diarrhea, and oral muco­\nsitis. Real-world data from\
      \ a Chinese cohort (n = 76) further\nvalidated these findings. In a single-center\
      \ retrospective study,\nthe major hematologic toxicities observed were hypertension\n\
      Figure 4. Top 30 PT of frequency. PT = preferred term.\n6\nLiu and Zhang • Medicine\
      \ (2026) 105:14\b\nMedicine\n(9.2%), HFSR (7.9%), and thrombocytopenia (3.9%).\
      \ Non-\nhematologic toxicities included oral mucositis (1.3%) and pro­\nteinuria\
      \ (1.3%). Notably, the incidence of ALT elevation (1.3%)\nand neutropenia (1.3%)\
      \ in this cohort was lower than that\nreported in the FRESCO phase III clinical\
      \ trial, potentially due\nto differences in baseline hepatic function among\
      \ the enrolled\npatients.[12]\nShu et al described a case of pemphigus vulgaris\
      \ (CTCAE\ngrade 3) during fruquintinib monotherapy, which presented with\nfeatures\
      \ distinct from typical HFSR: a diffuse maculopapular\nrash affecting the trunk\
      \ and proximal extremities, histopathol­\nogy showing dermal lymphocytic infiltration\
      \ with eosinophilia,\nand complete resolution of symptoms after discontinuation\
      \ of\nthe drug, followed by recurrence upon re-administration.[13] This\ncase\
      \ may be associated with the need to be vigilant about the\npotential spectrum\
      \ of hypersensitivity reactions to fruquintinib.\nThe hypothesized mechanism\
      \ may involve immune regulation\nabnormalities due to VEGFR inhibition, although\
      \ specific sig­\nnaling pathways remain to be confirmed by in vitro studies.\n\
      Zhao et al[14] reported a case of fruquintinib-related renal\nrestrictive thrombotic\
      \ microangiopathy (RTMA) in a 73-year-\nold male patient. During treatment for\
      \ metastatic colorectal\ncancer with fruquintinib, the patient developed skin\
      \ peeling of\nthe hands and feet, elevated blood pressure, and increased urine\n\
      foam. On the 28th day after starting treatment, renal dysfunction\nprompted\
      \ referral to the nephrology department, where renal\nultrasound and biopsy\
      \ confirmed RTMA. The kidney injury\npotentially related to fruquintinib may\
      \ involve a dual mecha­\nnism: direct endothelial cytotoxicity leading to microvascular\n\
      barrier dysfunction, and compensatory upregulation of pro-\nangiogenic factors\
      \ (e.g., Ang-2, FGF-2). This response can dis­\nrupt endothelial-podocyte interactions,\
      \ evidenced by elevated\nsoluble endothelial factors (sVEGFR-1, sEndoglin),\
      \ which\ninterfere with the localization and function of podocyte pro­\nteins\
      \ (nephrin, podocin) in the glomerular filtration barrier. Guo\nreported a case\
      \ of drug-induced glomerular microangiopathy\n(GMA) potentially related to focal\
      \ segmental glomerulosclero­\nsis following treatment with tirilizumab and fruquintinib.\
      \ The\npatient, who presented with bilateral lower extremity edema\nand foamy\
      \ urine, was diagnosed with GMA after renal biopsy.[15]\nBleeding risk is another\
      \ significant adverse effect of\nfruquintinib. A rare case of cerebellar hemorrhage\
      \ has been\nreported in a colorectal cancer patient undergoing treatment\nwith\
      \ the drug.[16] Studies suggest that VEGF inhibitors con­\ntribute to the formation\
      \ of reactive oxygen species, reduce\nthe activity of the endothelial nitric\
      \ oxide synthase-nitric\noxide (eNOS-NO) pathway, and increase circulating levels\
      \ of\nendothelin-1, a potent vasoconstrictor. These effects are import­\nant\
      \ factors influencing blood pressure regulation. Additionally,\nVEGFR inhibitors\
      \ compromise vascular integrity and angio­\ngenesis, weaken the vessel wall,\
      \ impair endothelial cell repair,\nand disrupt the blood-brain barrier, thereby\
      \ increasing the risk\nof hemorrhage.[17] Ledet reported a case of reversible\
      \ poste­\nrior cerebral syndrome in a 41-year-old female patient, who\nFigure\
      \ 5. Top 30 PT of signal intensity. PT = preferred term."
