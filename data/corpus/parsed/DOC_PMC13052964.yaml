    page: 1
  - name: 2. Methods
    text: "\b\nFruquintinib, a highly selective  small  molecule  tyrosine kinase\
      \  inhibitor  targeting  vascular  endothelial  growth  factor receptors (VEGFR)\
      \ 1, 2, and 3, was independently developed by Hutchison Whampoa Pharmaceuticals.\
      \ It was approved for marketing in September 2018 through the priority review\
      \ process by the National Medical Products Administration of China. Fruquintinib\
      \ is indicated for patients with metastatic colorectal cancer (mCRC) who have\
      \ failed at least 2 prior standard chemotherapy  regimens. [3]  The  drug  inhibits\
      \  vascular  endothelial cell proliferation and migration by competitively binding\
      \ to the intracellular tyrosine kinase domain of VEGFR and specifically blocking\
      \  ligand-induced  phosphorylation  of  the VEGF  receptor.  Notably, VEGFR-1\
      \ and VEGFR-2 exhibit high expression in  colorectal  cancer  cells,  playing\
      \  a  critical  role  in  regulating tumor  cell  proliferation,  survival,\
      \  and  epithelial-mesenchymal transition  through  activation  of  the  PI3K/Akt\
      \  and  MAPK/ ERK signaling  pathways.  In  contrast,  the VEGFR-3  signaling\
      \ axis is primarily involved in regulating lymphangiogenesis. [4-6] Reported\
      \ adverse events (AEs) include hypertension (38.7%), hand-foot syndrome (27.4%),\
      \ bleeding (21.9%), abnormal liver function  (elevated  AST/ALT  in  19.3%),\
      \  proteinuria  (15.8%), and  hypothyroidism  (12.4%).  The  incidence  of \
      \ grade  3  or higher AEs is approximately 42.6%, [7]  which can be managed\
      \ with dose adjustments and supportive therapy.\nThe FDA adverse event reporting\
      \ system (FAERS) is a publicly accessible spontaneous reporting database that\
      \ includes a vast collection of AEs, medication errors, and product quality\
      \ complaints submitted by healthcare professionals, manufacturers, and other\
      \ stakeholders. It offers a valuable source of realworld data for drug safety\
      \ research, making it an essential tool for  identifying  potential  adverse\
      \  reactions  and  assessing  the safety of drugs in clinical practice. [8]\n\
      This study aimed to identify and characterize post-marketing adverse event signals\
      \ associated with Fruquintinib in the FAERS database from 2023 to 2024 to support\
      \ clinical risk management and pharmacovigilance practice.\nThe  FAERS  database\
      \  includes  7  core  data  elements:  demographic and management information\
      \ (DEMO), adverse drug reaction data (REAC), patient outcomes (OUTC), drug information\
      \  (DRUG),  treatment  start/end  dates  (THER),  reporting source (RPSR), and\
      \ indications for use/diagnosis (INDI). Adverse drug event (ADE) descriptors\
      \ were standardized and adapted with reference to the medical dictionary for\
      \ regulatory  activities  (MedDRA28.0).  Following  the  FDA's  recommended\
      \  method  for  removing  duplicate  reports,  select  the PRIMARYID, CASEID,\
      \ and FDA_DT fields from the DEMO table. Sort the records in the order of CASEID,\
      \ FDA_DT, and then PRIMARYID. For reports with identical CASEIDs, retain the\
      \  one  with  the  largest  FDA_DT  value.  Subsequently,  for reports  with\
      \  matching  CASEID  and  FDA_DT  values,  retain the  one  with  the  largest\
      \  PRIMARYID  value.  ADE  reports with  the  same  preferred  term  (PT)  were\
      \  grouped  together and categorized by the system organ class (SOC). A total\
      \ of 3293,302 patient reports were screened from the FAERS database,  with \
      \ 391,174  duplicates  removed.  Reports  identifying 'Fruquintinib'  as  the\
      \  primary  suspected  drug  were  selected for inclusion in the study from\
      \ November 2023 to December 2024. As a result, 1188 patients treated with Fruquintinib\
      \ as primary therapy and 1836 adverse event cases were included for further\
      \ analysis, as shown in Figure 1.\nMeasure of disproportionality (MAD) is a\
      \ widely used ADR signal  detection  method  both  domestically  and  internationally.\
      \ In this study, several signal detection methods were used, including reported\
      \ ratio ratio (ROR), proportional reporting ratio (PRR), and Bayesian belief\
      \ propagation neural network (BCPNN) as part of the disproportionality analysis\
      \ method. ROR is one of the classical signal detection methods that help to\
      \  eliminate  bias  by  providing  a  more  accurate  risk  estimation. PRR\
      \ has higher specificity compared to ROR. BCPNN evaluates  drugs  mainly  based\
      \  on  information  components and their 95% confidence intervals and has the\
      \ advantage of integrating and cross-validating data from multiple sources.\
      \ [9] This comprehensive approach improves the accuracy of safety signal  identification,\
      \  reduces  false  positives  through  crossvalidation,  balances  sensitivity\
      \  and  specificity,  and  enhances the  detection  of  rare AEs  by  adjusting\
      \  thresholds  and  variances. The specific formulas are shown in Tables 1 and\
      \ 2. Each PT was judgmentally screened according to the thresholds in\nFigure\
      \ 1. The process of selecting AEs from the FAERS database. AEs = adverse events,\
      \ FAERS = FDA adverse event reporting system."
