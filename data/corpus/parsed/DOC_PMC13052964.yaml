  - name: 9.30 / 3.3. Risk signaling PT
    text: "4\nLiu and Zhang • Medicine (2026) 105:14\b\nMedicine\n3.3. Risk signaling\
      \ PT\nIn this study, a total of 1836 cases of Fruquintinib-related\nAEs were\
      \ systematically evaluated using 3 complementary\nsignal detection algorithms:\
      \ PRR, Bayesian confidence prop­\nagation neural network (BCPNN), and reporting\
      \ odds ratio\n(ROR). The analysis was conducted based on data from\nthe FAERS\
      \ database. After applying strict exclusion crite­\nria, which included nondrug-related\
      \ events, complications\narising from drug administration procedures, pregnancy-\n\
      specific events, and genetic disorders, 92 statistically signifi­\ncant safety\
      \ signals were identified. The signal validation results\ndemonstrated a high\
      \ degree of consistency with the known\nrisk profiles currently listed in the\
      \ drug’s labeling. Among\nthe 1188 independent patients included in the analysis,\
      \ the\nAEs exhibited multisystem involvement. Gastrointestinal dis­\norders,\
      \ systemic diseases and administration site reactions,\nand laboratory abnormalities\
      \ were the most prevalent event\ncategories according to the MedDRA SOC. A frequency\n\
      analysis of the PTs revealed that fatigue (ROR = 3.27), ele­\nvated blood pressure\
      \ (ROR = 11.78), diarrhea (ROR = 2.18),\nweakness (ROR = 4.18), and dysphonia\
      \ (ROR = 24.75) were\nthe 5 most frequently reported AEs (see Fig. 4 for the\
      \ top 30\nrankings). Notably, when ROR values were used to assess sig­\nnal\
      \ intensity, the top 5 high-risk signals identified were renal\nrestrictive\
      \ thrombotic microangiopathy (ROR = 11.17), ele­\nvated carcinoembryonic antigen\
      \ (ROR = 41.89), tongue ulcers\n(ROR = 33.13), vocal difficulties (ROR = 24.75),\
      \ and bile\nduct obstruction (ROR = 20.09). These signals exhibited sig­\nnificantly\
      \ higher intensities than the traditionally recognized\nhigh-incidence AEs (see\
      \ Fig. 5 for the top 30 signal intensity\nrankings). Important aes not mentioned\
      \ in the instructions,\nsuch as bone marrow suppression (ROR = 11.17), peripheral\n\
      neuropathy (ROR = 4.24) and dehydration (ROR = 3.98),\nwere also discovered.\n\
      3.4. Subgroup analysis\nWe performed subgroup analyses by gender and age group\n\
      separately, with a view to exploring whether adverse reactions\ndiffered in\
      \ different populations, but the final results showed a\nroughly balanced distribution,\
      \ as shown in Figures 6 and 7.\n3.5. Comparative study on differences in adverse\
      \ reactions\nto VEGFR inhibitors\nConducting an in-depth investigation into\
      \ the differences in\nadverse drug reactions (ADRs) among various medications\
      \ is of\nFigure 2. Distribution of AEs over time. AEs = adverse events.\nFigure\
      \ 3. Results of SOC classification of ADE signals. ADE = adverse drug event,\
      \ SOC = system organ classification."
