  - name: 5. Conclusion
    text: "7\nLiu and Zhang • Medicine (2026) 105:14\b\nwww.md-journal.com\ndeveloped\
      \ acute headache, nausea, and vomiting 2 months after\nstarting fruquintinib.\
      \ This eventually led to a generalized tonic-\nclonic seizure, which resolved\
      \ with symptomatic treatment.[18]\nThis hypothesized mechanism may be related\
      \ to fruquintinib’s\nimpact on endothelial cell homeostasis, potentially resulting\
      \ in\narterial hypertension and inadequate cerebral perfusion.[19]\n5. Conclusion\n\
      These findings potentially related to fruquintinib with side\neffects that cannot\
      \ be ignored. In clinical practice, emphasis\nshould be placed on core risk\
      \ factors such as hypertension, pro­\nteinuria, neurological dysfunction, and\
      \ early renal toxicity in\npatients, with dynamic monitoring and proactive intervention\n\
      implemented. Meanwhile, future research needs to delve into\nthe specific mechanisms\
      \ by which population characteristics,\ndrug dosage gradients, and duration\
      \ of medication influence the\noccurrence of adverse reactions.\n6. Limitations\n\
      There are some limitations in this study. The FAERS database\nis a spontaneous\
      \ presentation system, and there are prob­\nlems of omission, misreporting and\
      \ missing information in\nthe data. The information comes from various sources\
      \ (e.g.,\npharmaceutical companies, patients, doctors, etc), and there is a\n\
      certain degree of reporting bias.[20] Although the deduplication\nprocess in\
      \ this study based on FAERS can mitigate the impact\nof duplicate submissions,\
      \ the current data cannot support pre­\ncise incidence calculations due to underreporting\
      \ caused by the\nsystem’s passivity and the unknowable nature of unreported\n\
      populations. We sincerely call for further research to explore\nmore robust\
      \ quantitative methods to overcome the limitations\nof existing surveillance\
      \ systems. The dataset timeframe (1 year)\nlimits trend and longitudinal analysis.\
      \ Although the screening\nthreshold of ADE signal was improved in this study\
      \ by combin­\ning ROR method, BCPNN method and PRR method, the pos­\nsibility\
      \ of false-positive ADE signal still could not be ruled out.\nThe generation\
      \ of ADE signal could only indicate that there is a\nstatistical correlation\
      \ between the drug and the ADE, while the\ncausal relationship between the drug\
      \ and the ADE still needs\nfurther clinical research and evaluation. The data\
      \ in this study\nare mainly from Europe and the United States, and whether\n\
      they are applicable to the Chinese patient population remains\nto be verified.\n\
      Acknowledgments\nWe are grateful to the staff and participants of The FDA adverse\n\
      event reporting system (FAERS).\nFigure 6. The subgroup analysis in gender."
