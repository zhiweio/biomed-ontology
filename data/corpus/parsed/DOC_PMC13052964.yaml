    text: "3\nLiu and Zhang • Medicine (2026) 105:14\b\nwww.md-journal.com\nTable\
      \ 2, and the judgmental criteria of the 3 algorithms had\nto be met simultaneously\
      \ before an ADE signal was generated.\nThe generation of ADE signals suggests\
      \ a statistical correla­\ntion with the drug, and the stronger the signal, the\
      \ stronger\nthe correlation between the 2. All statistical analyses were per­\n\
      formed using R software 4.3.2 and Microsoft Excel for data\nanalysis.[10]\n\
      3. Result\n3.1. Basic information for adverse event reporting\nThe analysis\
      \ yielded a total of 1836 AEs related to Fruquintinib,\nreported between November\
      \ 2023 and December 2024,\ninvolving 1188 patients. The distribution of patients\
      \ by gen­\nder was roughly equal, with a slightly higher proportion of\nmales.\
      \ The majority of patients (48%) were aged between 18\nand 85 years. The United\
      \ States reported the highest number\nof adverse reactions, accounting for 848\
      \ cases (71.4%), fol­\nlowed by China (15.5%). Detailed information is provided\n\
      in Table 3. The time to the onset of adverse reactions was\ndefined as the interval\
      \ between the occurrence of the adverse\nevent and the initiation of Fruquintinib\
      \ treatment. The most\ncommon period for AEs to occur was within the first 30\
      \ days\nof treatment, which accounted for approximately 63% of\nreported cases\
      \ (Fig. 2).\n3.2. Risk signaling SOC\nIn this study, a signal detection method\
      \ was employed to\nsystematically analyze AEs associated with Fruquintinib.\n\
      The analysis identified 16 SOCs and 92 PTs related to the\nreported AEs. Based\
      \ on the frequency of adverse event\nreports, the top 3 SOC categories were\
      \ systemic diseases\nand drug administration site reactions, gastrointestinal\
      \ dis­\norders, and abnormalities in various laboratory tests. The\nspecific\
      \ distribution is shown in Figure 3. Quantitative\nsignal detection revealed\
      \ that the signal intensities of AEs\nin these 3 SOCs significantly exceeded\
      \ the preset thresh­\nold. Gastrointestinal disorders exhibited the highest\
      \ signal\nintensity (ROR = 2.04), followed by laboratory abnormal­\nities (ROR\
      \ = 1.69), and systemic diseases and site-of-\nadministration reactions, which\
      \ were statistically significant\nbut had relatively lower signal intensity\
      \ (ROR = 1.36). The\nresults of this multidimensional analysis may suggest a\n\
      association between Fruquintinib and these 3 categories of\nsystemic and organ-specific\
      \ adverse reactions, with gastroin­\ntestinal toxicity being particularly prominent.\n\
