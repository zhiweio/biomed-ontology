  - doc_id: DOC:PMID.32821245
    source_id: PUBMED
    external_id: "32821245"
    title: "Savolitinib in patients with pulmonary sarcomatoid carcinoma with MET exon 14 skipping alterations"
    doc_type: JOURNAL_ARTICLE
    published_on: "2021-08-01"
    language: en
    license_tier: TIER_0
    sections:
      - name: Abstract
        page: 1
        text: >-
          Savolitinib is a selective MET tyrosine kinase inhibitor. This multicentre,
          open-label, single-arm phase 2 study evaluated savolitinib in patients with
          pulmonary sarcomatoid carcinoma and other non-small cell lung cancer harbouring
          MET exon 14 skipping alterations. Savolitinib inhibits MET phosphorylation at
          nanomolar concentrations. The objective response rate was assessed by independent
          review committee.
      - name: Methods
        page: 2
        text: >-
          Eligible patients received savolitinib 600 mg once daily. MET exon 14 skipping
          was confirmed centrally by next-generation sequencing. MET exon 14 skipping status
          predicts response to savolitinib and served as the biomarker for patient selection.
      - name: Results
        page: 4
        text: >-
          A total of 70 patients were enrolled. Treatment-related adverse events of grade 3
          or worse occurred in 41 percent of patients, most commonly peripheral oedema.
          Dose reduction was required in a subset of patients. Savolitinib for the treatment
          of non-small cell lung cancer showed durable responses.
