  - doc_id: DOC:PATSNAP.PS-2023-00417
    source_id: MOCK_LICENSED
    external_id: PS-2023-00417
    title: "Competitive landscape of MET inhibitors in China (licensed analyst report)"
    doc_type: INTERNAL_REPORT
    published_on: "2023-11-02"
    language: en
    license_tier: TIER_3
    sections:
      - name: Summary
        page: 1
        text: >-
          This licensed report reviews acquired resistance to MET inhibitors and bypass
          activation mechanisms. Savolitinib was evaluated in EGFR-mutant non-small cell
          lung cancer with MET amplification. Savolitinib in combination with osimertinib is
          discussed as a combination therapy. The analyst forecast is proprietary and must
          not leave the entitled workspace.
