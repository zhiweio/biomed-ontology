  - doc_id: DOC:PMID.30006302
    source_id: PUBMED
    external_id: "30006302"
    title: "Fruquintinib in patients with previously treated metastatic colorectal cancer: the FRESCO randomized clinical trial"
    doc_type: JOURNAL_ARTICLE
    published_on: "2018-06-26"
    language: en
    license_tier: TIER_0
    sections:
      - name: Abstract
        page: 1
        text: >-
          Fruquintinib is a highly selective VEGFR inhibitor. In this randomized,
          double-blind, placebo-controlled phase 3 trial, fruquintinib was evaluated in
          metastatic colorectal cancer. Fruquintinib targets VEGFR2 and suppresses tumour
          angiogenesis. The hazard ratio for overall survival favoured fruquintinib.
      - name: Results
        page: 3
        text: >-
          Median overall survival was longer with fruquintinib than placebo. Grade 3 or
          higher adverse events included hypertension and hand-foot syndrome. Fruquintinib
          for the treatment of colorectal cancer was approved on the basis of this trial.
    tables:
      - table_id: T2
        caption: "FRESCO primary and secondary endpoints"
        page: 4
        bbox: [70.0, 200.0, 520.0, 330.0]
        header: [Arm, N, OS, PFS, DCR]
        rows:
          - [Fruquintinib, "278", "9.3", "3.7", "62.2"]
          - [Placebo, "138", "6.6", "1.8", "12.3"]

  - doc_id: DOC:CTGOV.NCT02807415
    source_id: CTGOV
    external_id: NCT02807415
    title: "A Study of Surufatinib in Patients With Advanced Neuroendocrine Tumors"
    doc_type: CLINICAL_TRIAL_RECORD
    published_on: "2016-06-21"
    language: en
    license_tier: TIER_0
    sections:
      - name: BriefSummary
        page: 1
        text: >-
          Surufatinib is an oral angio-immuno kinase inhibitor. Surufatinib targets VEGFR
          and CSF1R. This randomized, double-blind, placebo-controlled phase 3 study
          evaluated surufatinib in advanced neuroendocrine tumors. Surufatinib for the
          treatment of neuroendocrine tumors is being investigated in this registry study.
      - name: Outcomes
        page: 2
        text: >-
          The primary endpoint is progression-free survival assessed by blinded independent
          image review. Adverse event monitoring includes grade 3 hypertension and
          proteinuria.

