  # ============================================================ 语料同步批次
  #
  # 这批不是竞品盘点，而是把 9 篇真实文献正文里反复出现的药收进来 ——
  # 语料里讲了一整节的药却不在本体中，检索时它就只是一串字符：
  # 别名归一不了，图谱扩展够不着，引用里也标不出实体。
  #
  # 纳入线是「正文出现 ≥3 次」。低于这条线的（binimetinib 2 次、tarlatamab 2 次）
  # 一律不收：本体是要维护的，收一个没人查的概念，成本在往后每一次核对里。
  #
  # 中文商品名标 source: NMPA 的是国内已上市的；未在国内上市的（如 lazertinib、
  # zanzalintinib）只给音译通用名并标 SEED_INTERNAL，不编造商品名。

