# PoC 种子切片 —— 阿斯利华自研管线 + 直接竞品。
#
# 这个文件承载的是「买不到的部分」：概念范围划定与企业内部别名
# （研发代号、合作方代号、中文商品名）。外部 ID 由 loader 从真实快照解析，
# 不在此处硬编码 —— 手抄的外部 ID 无法保证与快照版本一致。
#
# xref_hints 是给 loader 的检索线索，不是权威 ID。
# verified: false 表示尚未经真实快照核对，不得进入发版。

