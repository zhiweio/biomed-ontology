    definition: 选择性 MET 酪氨酸激酶抑制剂，与阿斯利康共同开发
    verified: false
    xref_hints:
      UNII: { by: name, value: savolitinib }
      CHEMBL: { by: pref_name, value: SAVOLITINIB }
      DRUGCENTRAL: { by: name, value: savolitinib }
    aliases:
      # D4 旗舰用例：以下全部写法必须归一到同一个 HMD:SUB code。
      - { raw: savolitinib,  lang: en, scope: EXACT, type: INN,           source: UNII }
      - { raw: volitinib,    lang: en, scope: EXACT, type: RESEARCH_CODE, source: SEED_INTERNAL }
      - { raw: HMPL-504,     lang: en, scope: EXACT, type: INTERNAL_CODE, source: SEED_INTERNAL }
