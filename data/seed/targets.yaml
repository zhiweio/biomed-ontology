      - { raw: VEGFR1, lang: en, scope: EXACT, type: ABBREV, source: HGNC }
      - { raw: VEGFR-1, lang: en, scope: EXACT, type: ABBREV, source: HGNC }
      - { raw: FLT,    lang: en, scope: EXACT, type: LEGACY, source: HGNC }
      - { raw: 血管内皮生长因子受体1, lang: zh, scope: EXACT, type: TRANSLATION, source: SEED_INTERNAL }

