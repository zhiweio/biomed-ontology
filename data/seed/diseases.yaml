      - { raw: lung neoplasm,   lang: en, scope: EXACT, type: TRANSLATION,   source: MONDO }
      - { raw: 肺癌,            lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }

  - key: prcc
    preferred_label_en: papillary renal cell carcinoma
    preferred_label_zh: 乳头状肾细胞癌
    verified: false
    xref_hints:
      MONDO: { by: label, value: papillary renal cell carcinoma }
