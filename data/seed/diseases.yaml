      - { raw: LUAD,                lang: en, scope: EXACT, type: ABBREV,        source: SEED_INTERNAL }
      - { raw: 肺腺癌,              lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }

