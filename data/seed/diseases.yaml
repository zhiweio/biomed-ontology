# 适应症种子切片。
#
# 层级关系是检索扩展的基础：查「NSCLC」必须能召回「MET ex14 skipping 肺腺癌」文献。
# parents 用 seed key 引用，loader 解析为内部 CURIE。

seed_version: "0.1.0"
entity_type: DISEASE

concepts:
  - key: nsclc
    preferred_label_en: non-small cell lung carcinoma
    preferred_label_zh: 非小细胞肺癌
    verified: false
    xref_hints:
      MONDO: { by: label, value: non-small cell lung carcinoma }
      NCIT:  { by: label, value: Non-Small Cell Lung Carcinoma }
    parents: [lung_cancer]
    aliases:
      - { raw: non-small cell lung carcinoma, lang: en, scope: EXACT, type: CHEMICAL_NAME, source: MONDO }
      - { raw: non-small cell lung cancer,    lang: en, scope: EXACT, type: TRANSLATION,   source: MONDO }
      - { raw: NSCLC,                         lang: en, scope: EXACT, type: ABBREV,        source: MONDO }
      - { raw: 非小细胞肺癌,                  lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }

  - key: lung_adenocarcinoma
    preferred_label_en: lung adenocarcinoma
    preferred_label_zh: 肺腺癌
    verified: false
    xref_hints:
