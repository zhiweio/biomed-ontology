      - { raw: PRCC,                           lang: en, scope: EXACT, type: ABBREV,        source: SEED_INTERNAL }
      - { raw: pRCC,                           lang: en, scope: EXACT, type: ABBREV,        source: SEED_INTERNAL }
      - { raw: 乳头状肾细胞癌,                 lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }

  - key: mcrc
    preferred_label_en: metastatic colorectal carcinoma
    preferred_label_zh: 转移性结直肠癌
    verified: false
    xref_hints:
      MONDO: { by: label, value: colorectal carcinoma }
    parents: [colorectal_cancer]
    aliases:
      - { raw: metastatic colorectal carcinoma, lang: en, scope: EXACT, type: CHEMICAL_NAME, source: SEED_INTERNAL }
      - { raw: mCRC,                            lang: en, scope: EXACT, type: ABBREV,        source: SEED_INTERNAL }
      - { raw: 转移性结直肠癌,                  lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }
      - { raw: 晚期结直肠癌,                    lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }

  - key: colorectal_cancer
    preferred_label_en: colorectal carcinoma
    preferred_label_zh: 结直肠癌
    verified: false
    xref_hints:
      MONDO: { by: label, value: colorectal carcinoma }
    aliases:
      - { raw: colorectal carcinoma, lang: en, scope: EXACT, type: CHEMICAL_NAME, source: MONDO }
      - { raw: colorectal cancer,    lang: en, scope: EXACT, type: TRANSLATION,   source: MONDO }
      - { raw: CRC,                  lang: en, scope: EXACT, type: ABBREV,        source: SEED_INTERNAL }
      - { raw: 结直肠癌,             lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }
      - { raw: 大肠癌,               lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }

  - key: net
    preferred_label_en: neuroendocrine tumor
    preferred_label_zh: 神经内分泌瘤
    verified: false
    xref_hints:
      MONDO: { by: label, value: neuroendocrine tumor }
    aliases:
      - { raw: neuroendocrine tumor,     lang: en, scope: EXACT, type: CHEMICAL_NAME, source: MONDO }
      - { raw: neuroendocrine neoplasm,  lang: en, scope: EXACT, type: TRANSLATION,   source: MONDO }
      # NET 是本切片里最危险的缩写之一（还指 norepinephrine transporter），
      # 歧义处理见 ambiguity.yaml。
      - { raw: NET,                      lang: en, scope: EXACT, type: ABBREV,        source: SEED_INTERNAL }
      - { raw: 神经内分泌瘤,             lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }
      - { raw: 神经内分泌肿瘤,           lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }

  - key: itp
    preferred_label_en: immune thrombocytopenia
    preferred_label_zh: 免疫性血小板减少症
    verified: false
    xref_hints:
      MONDO: { by: label, value: immune thrombocytopenia }
    aliases:
      - { raw: immune thrombocytopenia,           lang: en, scope: EXACT, type: CHEMICAL_NAME, source: MONDO }
      - { raw: immune thrombocytopenic purpura,   lang: en, scope: EXACT, type: TRANSLATION,   source: MONDO }
      - { raw: idiopathic thrombocytopenic purpura, lang: en, scope: EXACT, type: LEGACY,      source: SEED_INTERNAL }
      - { raw: ITP,                               lang: en, scope: EXACT, type: ABBREV,        source: SEED_INTERNAL }
      - { raw: 免疫性血小板减少症,                lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }
      - { raw: 特发性血小板减少性紫癜,            lang: zh, scope: EXACT, type: LEGACY,        source: SEED_INTERNAL }

  - key: waiha
    preferred_label_en: warm autoimmune hemolytic anemia
    preferred_label_zh: 温抗体型自身免疫性溶血性贫血
    verified: false
    aliases:
      - { raw: warm autoimmune hemolytic anemia, lang: en, scope: EXACT, type: CHEMICAL_NAME, source: SEED_INTERNAL }
      - { raw: wAIHA,                            lang: en, scope: EXACT, type: ABBREV,        source: SEED_INTERNAL }
      - { raw: 温抗体型自身免疫性溶血性贫血,     lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }

  - key: gastric_cancer
    preferred_label_en: gastric carcinoma
    preferred_label_zh: 胃癌
    verified: false
    xref_hints:
      MONDO: { by: label, value: stomach carcinoma }
    aliases:
      - { raw: gastric carcinoma, lang: en, scope: EXACT, type: CHEMICAL_NAME, source: MONDO }
      - { raw: gastric cancer,    lang: en, scope: EXACT, type: TRANSLATION,   source: MONDO }
      - { raw: stomach cancer,    lang: en, scope: EXACT, type: TRANSLATION,   source: MONDO }
      - { raw: 胃癌,              lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }

  - key: lymphoma
    preferred_label_en: lymphoma
    preferred_label_zh: 淋巴瘤
    verified: false
    xref_hints:
      MONDO: { by: label, value: lymphoma }
    aliases:
      - { raw: lymphoma, lang: en, scope: EXACT, type: CHEMICAL_NAME, source: MONDO }
      - { raw: 淋巴瘤,   lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }

  # ============================================================ 语料同步批次
  #
  # 取自 9 篇真实文献的正文，收录口径同 targets.yaml。
  #
  # 缩写这一层挑得比英文全称保守：SCLC/PDAC/pNET 在语料里是唯一解，
  # 但 NS（肾病综合征 / 生理盐水 / not significant）和 LM（脑膜转移 / 淋巴管转移）
  # 不是 —— 收进来只会给归一化制造一批没人登记过的碰撞。

  - key: sclc
    preferred_label_en: small cell lung carcinoma
    preferred_label_zh: 小细胞肺癌
    verified: false
    xref_hints:
      MONDO: { by: label, value: small cell lung carcinoma }
      NCIT:  { by: label, value: Small Cell Lung Carcinoma }
    parents: [lung_cancer]
    aliases:
      - { raw: small cell lung carcinoma, lang: en, scope: EXACT, type: CHEMICAL_NAME, source: MONDO }
      - { raw: small cell lung cancer,    lang: en, scope: EXACT, type: TRANSLATION,   source: MONDO }
      - { raw: SCLC,                      lang: en, scope: EXACT, type: ABBREV,        source: MONDO }
      - { raw: 小细胞肺癌,                lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }

  - key: pancreatic_cancer
    preferred_label_en: pancreatic carcinoma
    preferred_label_zh: 胰腺癌
    verified: false
    xref_hints:
      MONDO: { by: label, value: pancreatic carcinoma }
    aliases:
      - { raw: pancreatic carcinoma, lang: en, scope: EXACT, type: CHEMICAL_NAME, source: MONDO }
      - { raw: pancreatic cancer,    lang: en, scope: EXACT, type: TRANSLATION,   source: MONDO }
      - { raw: 胰腺癌,               lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }

  - key: pdac
    preferred_label_en: pancreatic ductal adenocarcinoma
    preferred_label_zh: 胰腺导管腺癌
    verified: false
    xref_hints:
      MONDO: { by: label, value: pancreatic ductal adenocarcinoma }
    parents: [pancreatic_cancer]
    aliases:
      - { raw: pancreatic ductal adenocarcinoma, lang: en, scope: EXACT, type: CHEMICAL_NAME, source: MONDO }
      - { raw: PDAC,                             lang: en, scope: EXACT, type: ABBREV,        source: SEED_INTERNAL }
      - { raw: 胰腺导管腺癌,                     lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }

  - key: pnet
    preferred_label_en: pancreatic neuroendocrine tumor
    preferred_label_zh: 胰腺神经内分泌瘤
    verified: false
    xref_hints:
      MONDO: { by: label, value: pancreatic neuroendocrine tumor }
    # 双父节点：既是神经内分泌瘤又是胰腺肿瘤。只挂一个都会让另一条查询路径漏掉它 ——
    # 查"胰腺肿瘤"漏 pNET，或查"NET 的治疗"漏胰腺原发。
    parents: [net, pancreatic_cancer]
    aliases:
      - { raw: pancreatic neuroendocrine tumor, lang: en, scope: EXACT, type: CHEMICAL_NAME, source: MONDO }
      # 不给它挂裸 NET —— 那是父概念的别名，挂上来就是一次未登记碰撞。
      - { raw: pNET,                            lang: en, scope: EXACT, type: ABBREV,        source: SEED_INTERNAL }
      - { raw: 胰腺神经内分泌瘤,                lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }

  - key: testicular_net
    preferred_label_en: testicular neuroendocrine tumor
    preferred_label_zh: 睾丸神经内分泌瘤
    verified: false
    parents: [net]
    aliases:
      - { raw: testicular neuroendocrine tumor, lang: en, scope: EXACT, type: CHEMICAL_NAME, source: SEED_INTERNAL }
      - { raw: testicular NET,                  lang: en, scope: EXACT, type: ABBREV,        source: SEED_INTERNAL }
      - { raw: primary testicular carcinoid,    lang: en, scope: EXACT, type: LEGACY,        source: SEED_INTERNAL }
      - { raw: 睾丸神经内分泌瘤,                lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }

  - key: cns_metastasis
    preferred_label_en: central nervous system metastasis
    preferred_label_zh: 中枢神经系统转移
    verified: false
    aliases:
      - { raw: central nervous system metastasis, lang: en, scope: EXACT, type: CHEMICAL_NAME, source: SEED_INTERNAL }
      - { raw: CNS metastasis,                    lang: en, scope: EXACT, type: ABBREV,        source: SEED_INTERNAL }
      - { raw: CNS metastases,                    lang: en, scope: EXACT, type: ABBREV,        source: SEED_INTERNAL }
      - { raw: 中枢神经系统转移,                  lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }

  - key: brain_metastasis
    preferred_label_en: brain metastasis
    preferred_label_zh: 脑转移
    verified: false
    xref_hints:
      MONDO: { by: label, value: brain metastasis }
    parents: [cns_metastasis]
    aliases:
      - { raw: brain metastasis,  lang: en, scope: EXACT, type: CHEMICAL_NAME, source: MONDO }
      - { raw: brain metastases,  lang: en, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }
      - { raw: 脑转移,            lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }
      - { raw: 脑转移瘤,          lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }

  - key: leptomeningeal_metastasis
    preferred_label_en: leptomeningeal metastasis
    preferred_label_zh: 软脑膜转移
    verified: false
    # 挂在 cns_metastasis 而不是 brain_metastasis 之下：软脑膜转移累及的是脑膜与脑脊液，
    # 不是脑实质。做成父子关系会让"脑转移的局部治疗"直接盖到软脑膜播散上，
    # 而这两者的处置（全脑放疗 vs 鞘内给药）并不通用。
    parents: [cns_metastasis]
    aliases:
      - { raw: leptomeningeal metastasis,    lang: en, scope: EXACT, type: CHEMICAL_NAME, source: SEED_INTERNAL }
      - { raw: leptomeningeal metastases,    lang: en, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }
      - { raw: leptomeningeal carcinomatosis, lang: en, scope: EXACT, type: LEGACY,       source: SEED_INTERNAL }
      - { raw: 软脑膜转移,                   lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }
      - { raw: 脑膜转移,                     lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }

  - key: nephrotic_syndrome
    preferred_label_en: nephrotic syndrome
    preferred_label_zh: 肾病综合征
    verified: false
    xref_hints:
      MONDO: { by: label, value: nephrotic syndrome }
    aliases:
      - { raw: nephrotic syndrome, lang: en, scope: EXACT, type: CHEMICAL_NAME, source: MONDO }
      - { raw: 肾病综合征,         lang: zh, scope: EXACT, type: TRANSLATION,   source: SEED_INTERNAL }
