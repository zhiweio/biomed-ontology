site_name: biomed-ontology 手册
site_description: Enterprise Biomedical World Model / AI Data Foundation —— 企业生物医学世界模型与 Ontology Semantic Layer
site_url: https://zhiweio.github.io/biomed-ontology/
repo_name: zhiweio/biomed-ontology
repo_url: https://github.com/zhiweio/biomed-ontology
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - footnotes
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zhiweio/biomed-ontology
      name: GitHub
  generator: false

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - assets/javascripts/mermaid.mjs

extra_css:
  - assets/stylesheets/mermaid.css

exclude_docs: |
  __pycache__/
  *.py[cod]
  .DS_Store

nav:
  - 首页: index.md
  - 快速开始: getting-started.md
  - 架构总览:
      - 分层 L0–L8: architecture/layers.md
      - Foundation 世界模型: architecture/foundation.md
      - Document Pipeline 双写: architecture/document-pipeline.md
      - OpenMetadata × Trino: architecture/openmetadata.md
      - 端到端数据流: architecture/pipeline.md
      - LinkML 与生成物: architecture/linkml.md
  - 本体与语义层:
      - Ontology 工程工具链: ontology/toolchain.md
      - Golden Path: ontology/golden-path.md
      - 种子与 BuiltConcept: ontology/seed.md
      - 归一化级联: ontology/normalize.md
      - 类型化链接与 search-around: ontology/links.md
      - GraphStore 与许可命名图: ontology/rdf.md
  - 文档解析与语料:
      - 版面后端与语义树: parse/layout.md
      - 资产路径与视觉融合: parse/assets.md
      - 切片与包装纸过滤: parse/chunks.md
      - 图型 figure_type: parse/figure-type.md
  - 检索栈:
      - 三通道与带权 RRF: retrieval/hybrid.md
      - 查询改写 vs 图通道: retrieval/ontology-paths.md
      - Milvus 五列与融合不下推: retrieval/milvus.md
      - 模态与图型过滤: retrieval/filters.md
      - 交叉编码器精排: retrieval/rerank.md
      - 嵌入器与权重解析: retrieval/embedders.md
  - Foundation Semantic API 与 Citationware:
      - Semantic Access 与契约: tools/tools.md
      - 证据树与 restore_context: tools/citationware.md
      - REST / MCP 与凭据边界: tools/serve.md
  - 许可与合规:
      - Tier 策略矩阵: licensing/tiers.md
      - 组件闸门: licensing/components.md
  - 可观测与演进:
      - 四支柱: observability/pillars.md
      - 信号 → KGCL → 发版: evolution/loop.md
  - 评测手册:
      - Gold 与判定粒度: eval/gold.md
      - ARMS 消融阶梯: eval/arms.md
      - 显著性怎么读: eval/significance.md
      - targets 与豁免纪律: eval/targets.md
  - 设计不变量: invariants.md
  - 附录:
      - 目录地图: appendix/tree.md
      - CLI 速查: appendix/cli.md
      - NOTICE / 出处: appendix/notice.md
      - 设计决策 D1–D12: appendix/decisions.md
