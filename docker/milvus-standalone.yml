# Milvus Standalone —— 本地开发与评测用，非生产配置。
#
# 用 standalone 而非 Milvus Lite：Lite 不支持 partition key 与部分索引类型，
# 而许可隔离恰恰依赖 partition key 做物理隔离（见 search/backends/base.py）。
# 用 Lite 跑通的测试无法证明生产形态下的隔离有效。
#
# 本文件是服务片段，由 docker-compose.foundation.yml include，项目名统一为
# hmd-foundation。勿单独 `docker compose -f` 起第二套栈（会抢 9001/19530）。
# 起停：task milvus:up（仅 etcd/minio/standalone）或 task foundation:up（全栈）。

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ./volumes/etcd:/etcd
    command: >-
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      # 本地固定凭据，仅用于容器间通信，不对外暴露；生产必须换成密钥管理下发。
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # 默认上限是 4 个向量列，而本仓库有 5 列（词法稀疏 + 通用/生医稠密 +
      # 两条视觉列）。不放开的话建表会在第 5 列上直接失败，报错是
      # "maximum vector field's number should be limited to 4" ——
      # 与"哪一列多余"毫无关系，很容易被读成 schema 写错了。
      # 上限本身是 10（Milvus 侧的硬编码），这里取 6 留一列余量。
      PROXY_MAXVECTORFIELDNUM: "6"
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      # 绑到 127.0.0.1：Milvus 默认无鉴权，暴露到 0.0.0.0 等同于把全部语料对局域网开放。
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      - etcd
      - minio
