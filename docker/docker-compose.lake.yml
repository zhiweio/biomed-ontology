# Iceberg REST Catalog + Trino（由 docker-compose.foundation.yml include）
services:
  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    ports:
      - "127.0.0.1:8181:8181"
    environment:
      # 镜像默认 `jdbc:sqlite:file:/tmp/iceberg_rest_mode=memory` 实际是文件库，
      # Connect 每 15s commit 会 SQLITE_BUSY，入仓/建表一起失败。
      CATALOG_URI: jdbc:sqlite:file:/tmp/iceberg_rest.db?journal_mode=WAL&busy_timeout=60000
      CATALOG_WAREHOUSE: s3://hmd-lake/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_ACCESS__KEY__ID: minioadmin
      CATALOG_S3_SECRET__ACCESS__KEY: minioadmin
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_CLIENT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      - minio

  trino:
    image: trinodb/trino:455
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    depends_on:
      - iceberg-rest
      - minio
