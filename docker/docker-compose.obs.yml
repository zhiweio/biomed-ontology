# Observability bus: Redpanda + Kafka Connect Iceberg Sink
# Usage (from repo root, with lake already up):
#   docker compose -f docker/docker-compose.foundation.yml \
#     -f docker/docker-compose.obs.yml --profile obs up -d
#
# App 默认 Settings.kafka_bootstrap_servers=localhost:19092（与 external 端口一致）
name: hmd-foundation

services:
  redpanda:
    profiles: ["obs"]
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --set
      - redpanda.auto_create_topics_enabled=true
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  # Iceberg Sink：消费 Redpanda → 写 MinIO + REST catalog
  # 镜像需自备 connector 插件目录时，见 docker/obs/README.md
  kafka-connect-iceberg:
    profiles: ["obs"]
    image: tabulario/iceberg-kafka-connect:0.6.19
    depends_on:
      - redpanda
      - iceberg-rest
      - minio
    environment:
      CONNECT_BOOTSTRAP_SERVERS: redpanda:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect-iceberg
      CONNECT_GROUP_ID: hmd-iceberg-connect
      CONNECT_CONFIG_STORAGE_TOPIC: hmd_connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: hmd_connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: hmd_connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /kafka/connect
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - ./obs/connectors:/etc/kafka-connect/connectors:ro

volumes:
  redpanda-data:
