# Observability bus: Redpanda + Kafka Connect Iceberg Sink
# Usage (from repo root, with lake already up):
#   task obs:up          # redpanda + connect worker
#   task obs:register    # PUT connector configs
#
# App 默认 Settings.kafka_bootstrap_servers=127.0.0.1:19092（避免 ::1）
name: hmd-foundation

services:
  redpanda:
    profiles: ["obs"]
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      # 宿主机客户端用 127.0.0.1，避免 macOS localhost→::1 Connection refused
      - internal://redpanda:9092,external://127.0.0.1:19092
      - --set
      - redpanda.auto_create_topics_enabled=true
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  kafka-connect-iceberg:
    profiles: ["obs"]
    build:
      context: ./obs
      dockerfile: Dockerfile.connect
    image: hmd-iceberg-kafka-connect:1.9.2
    depends_on:
      - redpanda
      - iceberg-rest
      - minio
    environment:
      CONNECT_BOOTSTRAP_SERVERS: redpanda:9092
      CONNECT_REST_PORT: "8083"
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect-iceberg
      CONNECT_GROUP_ID: hmd-iceberg-connect
      CONNECT_CONFIG_STORAGE_TOPIC: hmd_connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: hmd_connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: hmd_connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - ./obs/connectors:/etc/kafka-connect/connectors:ro

volumes:
  redpanda-data:
