[project]
name = "biomed-ontology"
version = "0.1.0"
description = "AI-Ready Scientific Data Foundation for Drug Discovery (Asliva PoC)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "hmd-contracts",
    "hmd-core",
    "hmd-ingest",
    "hmd-nlu",
    "hmd-kg",
    "hmd-index",
    "hmd-access",
    # core
    "linkml>=1.8.0",
    "linkml-runtime>=1.8.0",
    "sssom>=0.4.10",
    "curies>=0.10.0",
    "bioregistry>=0.11.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "networkx>=3.3",
    "polars>=1.9.0",
    "httpx>=0.27.0",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "tqdm>=4.66.0",
    "structlog>=24.4.0",
    # rdf / ontology
    "rdflib>=7.1.0",
    "pyshacl>=0.26.0",
    "oaklib>=0.6.10",
    "pronto>=2.5.7",
    "kgcl-schema>=0.6.0",
    # vector retrieval（torch 由 pymilvus[model] 间接引入）
    "pymilvus[model]>=2.5.0",
    # BGE-M3 的实现在 FlagEmbedding 里，pymilvus 只做惰性 import。
    # 不显式声明的话 pymilvus 会在运行时自己 pip install —— 那次安装既绕过
    # uv 的锁定，也会被下一次 `uv sync` 抹掉，表现为"装了但导入不到"。
    "FlagEmbedding>=1.3.3",
    "sentence-transformers>=3.0.0",
    # BIOS_v3 全量下载与模型权重拉取共用。
    "huggingface_hub>=0.26.0",
    # 内网连不上 huggingface.co 时改走 ModelScope（HMD_MODEL_HUB=modelscope）。
    "modelscope>=1.20.0",
    # Qwen3-VL-Embedding 的视觉列。官方推理脚本随权重下发，但它 import 的这两个
    # 包不在权重里：qwen-vl-utils 负责把图缩放到合法的 patch 数，av 是它的解码后端。
    # transformers 下限来自模型卡：4.57 才认得 qwen3_vl 这个 model_type。
    "transformers>=4.57.0",
    "qwen-vl-utils>=0.0.14",
    "av>=15.0.0",
    "torchvision>=0.20.0",
    # BiomedCLIP 第五列（dense_visual_bio）与图型零样本分类。
    # 模型卡实测环境是 transformers==4.35.2；与本仓库锁定的 >=4.57 已在加载路径上
    # 验证兼容（HFTextEncoder 走本地 BiomedBERT，不经 open_clip 的在线解析）。
    "open_clip_torch>=2.23.0",
    # 版面解析。PyMuPDF4LLM（底层 PyMuPDF）为 AGPL-3.0/商业双授权，对外服务前需法务确认（见 NOTICE）。
    # MinerU 默认走本地 import（HMD_MINERU_TRANSPORT=local）；也可改 http 只打远程服务。
    "pymupdf4llm>=0.0.17",
    "docling>=2.0.0",
    "pillow>=10.4.0",
    "mineru>=2.0.0",
    # vision
    "openai>=1.54.0",
    # service
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # 3.x 把 streamable_http_app() 改名为 http_app()，跨大版本挂载方式不同
    "fastmcp>=3.0.0,<4.0.0",
    # lake
    "minio>=7.2.0",
    "pyiceberg[s3fs]>=0.7.0",
    "pyarrow>=17.0.0",
    "prefect>=3.0.0",
    "trino>=0.330.0",
    # obs → Redpanda (Kafka API); missing/offline → Jsonl WAL fallback
    "confluent-kafka>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "ty>=0.0.18",
    "respx>=0.21.1",
]
docs = [
    "mkdocs-material>=9.5.0",
]
# 剖面声明：默认 dependencies 仍含全栈，便于现网 `uv sync`。
# 瘦安装走 `uv sync --package hmd-nlu`（不拉 torch / docling / mineru）。
layout = [
    "pymupdf4llm>=0.0.17",
    "docling>=2.0.0",
    "mineru>=2.0.0",
    "pillow>=10.4.0",
]
embed = [
    "pymilvus[model]>=2.5.0",
    "FlagEmbedding>=1.3.3",
    "sentence-transformers>=3.0.0",
]
vision = [
    "transformers>=4.57.0",
    "qwen-vl-utils>=0.0.14",
    "av>=15.0.0",
    "torchvision>=0.20.0",
    "open_clip_torch>=2.23.0",
    "openai>=1.54.0",
]
lake = [
    "minio>=7.2.0",
    "pyiceberg[s3fs]>=0.7.0",
    "pyarrow>=17.0.0",
    "prefect>=3.0.0",
    "trino>=0.330.0",
]
obs = [
    "confluent-kafka>=2.3.0",
]

[project.scripts]
hmd = "biomed_ontology.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biomed_ontology"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
hmd-contracts = { workspace = true }
hmd-core = { workspace = true }
hmd-ingest = { workspace = true }
hmd-nlu = { workspace = true }
hmd-kg = { workspace = true }
hmd-index = { workspace = true }
hmd-access = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
# LinkML 生成的代码不做人工维护，改动会在下次 task gen 时丢失。
extend-exclude = ["src/biomed_ontology/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # 中文标识符与文案在本仓库是刻意选择（面向阿斯利华内部审校）。
    "RUF001", "RUF002", "RUF003",
    # str+Enum 而非 StrEnum：与 LinkML 生成的枚举保持同一形态，便于互相替换。
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# typer 的参数声明惯用法就是在默认值里调用 Option()。
"src/biomed_ontology/cli.py" = ["B008"]
"src/biomed_ontology/cli_foundation.py" = ["B008"]
"src/biomed_ontology/cli_lake.py" = ["B008"]
# FastAPI 同理：Body()/Header() 必须写在默认值里才能被框架识别。
"src/biomed_ontology/service/app.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not integration'"
markers = [
    "integration: 需本机 GraphDB（task foundation:up）；默认跳过",
]

# Astral ty（替代 mypy）。与 ruff 同属 uv 工具链。
[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
# 与 ruff 对齐：跳过 LinkML 生成物与第三方 vendored 树。
exclude = [
    "**/_generated/**",
    "docker/**",
    "ontology/**",
    "schema/generated/**",
]

[tool.ty.rules]
# 对齐旧 mypy ignore_missing_imports：第三方缺 stub 时不报 unresolved-import。
unresolved-import = "ignore"
