[project]
name = "biomed-ontology"
version = "0.1.0"
description = "Biomedical semantic layer data foundation for AI agent retrieval (Asliva PoC)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "linkml>=1.8.0",
    "linkml-runtime>=1.8.0",
    "sssom>=0.4.10",
    "curies>=0.10.0",
    "bioregistry>=0.11.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "networkx>=3.3",
    "polars>=1.9.0",
    "httpx>=0.27.0",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
rdf = [
    "rdflib>=7.1.0",
    "pyoxigraph>=0.4.0",
    "pyshacl>=0.26.0",
]
ontology = [
    "oaklib>=0.6.10",
    "pronto>=2.5.7",
    "kgcl-schema>=0.6.0",
]
# 向量检索。torch 由 pymilvus[model] 间接引入，体积大，因此单列 extra。
vector = [
    "pymilvus[model]>=2.5.0",
]
# 版面解析。pymupdf 为 AGPL-3.0/商业双授权，对外服务前需法务确认（见 NOTICE）。
parse = [
    "pymupdf>=1.24.0",
    "pillow>=10.4.0",
]
vision = [
    "openai>=1.54.0",
]
service = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # 3.x 把 streamable_http_app() 改名为 http_app()，跨大版本挂载方式不同
    "fastmcp>=3.0.0,<4.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "respx>=0.21.1",
]

[project.scripts]
hmd = "biomed_ontology.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biomed_ontology"]

[tool.ruff]
line-length = 100
target-version = "py311"
# LinkML 生成的代码不做人工维护，改动会在下次 make gen 时丢失。
extend-exclude = ["src/biomed_ontology/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # 中文标识符与文案在本仓库是刻意选择（面向阿斯利华内部审校）。
    "RUF001", "RUF002", "RUF003",
    # str+Enum 而非 StrEnum：与 LinkML 生成的枚举保持同一形态，便于互相替换。
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# typer 的参数声明惯用法就是在默认值里调用 Option()。
"src/biomed_ontology/cli.py" = ["B008"]
# FastAPI 同理：Body()/Header() 必须写在默认值里才能被框架识别。
"src/biomed_ontology/service/app.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
